# The wine cellar. Bottles live in the "Wine cellar" Local To-do list (todo.wine_cellar), one item per
# bottle; the Cellar dashboard (custom:pik-cellar-card) shows them with a picture and what they're worth.
# Pik adds bottles from a photo with script.wine_add, and can update a wine's value with
# script.wine_set_value. "We drank it" and the stars are on the Cellar screen.

script:
  wine_add:
    alias: "Cellar: add a wine"
    description: >-
      Adds bottles to the wine cellar. Use it when Tyler or Charlie sends a photo of a bottle (or names a
      wine) and says to add it. First identify the exact wine from the label (producer, wine name, vintage),
      look up its current typical retail price in US dollars (Wine-Searcher's average, or a major retailer),
      and find a clean product photo of that bottle on a plain background (a direct https link to a .jpg,
      .png or .webp image, from the winery or a retailer). name is how the wine reads on the label with the
      vintage first: "2019 Ridge Monte Bello" ("NV" for non-vintage).
    mode: queued
    max: 10
    fields:
      name:
        description: "Vintage and wine, e.g. 2019 Ridge Monte Bello"
        required: true
        selector:
          text:
      producer:
        description: "The winery"
        selector:
          text:
      vintage:
        description: "Year, or NV"
        selector:
          text:
      region:
        description: "e.g. Napa Valley, California"
        selector:
          text:
      grape:
        description: "Grape or blend, e.g. Cabernet Sauvignon"
        selector:
          text:
      value:
        description: "Typical retail price per bottle, US dollars (number)"
        selector:
          number:
            min: 0
            max: 100000
            mode: box
      value_source:
        description: "Where the price came from, e.g. Wine-Searcher avg"
        selector:
          text:
      image:
        description: "https link to a clean photo of the bottle"
        selector:
          text:
      notes:
        description: "Anything to remember (where we bought it, what it's for, drink by)"
        selector:
          text:
      bottles:
        description: "How many bottles (default 1)"
        selector:
          number:
            min: 1
            max: 48
            mode: box
    sequence:
      - variables:
          desc: >-
            {% set lines = [
              ('Producer', producer | default('', true)), ('Vintage', vintage | default('', true)),
              ('Region', region | default('', true)), ('Grape', grape | default('', true)),
              ('Value', (value | float(0) | round(0) | int) if value is defined and value | float(0) > 0 else ''),
              ('Valued', (now().strftime('%Y-%m-%d') ~ ' · ' ~ value_source | default('web price', true)) if value is defined and value | float(0) > 0 else ''),
              ('Image', image | default('', true)), ('Added', now().strftime('%Y-%m-%d')), ('Notes', notes | default('', true)) ] %}
            {{ lines | selectattr(1) | map('join', ': ') | join('\n') }}
          n: "{{ bottles | default(1, true) | int(1) }}"
      - repeat:
          count: "{{ n }}"
          sequence:
            - action: todo.add_item
              target: { entity_id: todo.wine_cellar }
              data:
                item: "{{ name }}"
                description: "{{ desc }}"
      - action: script.feed_post
        data:
          id: "cellar-{{ name | slugify }}"
          title: "In the cellar: {{ name }}{{ ' ×' ~ n if n | int > 1 else '' }}"
          category: home
          label: "Cellar · from Pik"
          detail: >-
            {{ ('Worth about $' ~ (value | float(0) | round(0) | int) ~ (' a bottle.' if n | int > 1 else '.')) if value is defined and value | float(0) > 0 else 'Added.' }}
          primary_label: Open the cellar
          primary_open: /dashboard-cellar/cellar
          secondary_label: Dismiss
          expires_hours: 12

  wine_set_value:
    alias: "Cellar: update a wine's value"
    description: >-
      Updates what a wine in the cellar is worth (every bottle of it that we still have). Use after looking up
      a current price. name must match the wine's name in the cellar.
    mode: queued
    fields:
      name:
        description: "The wine's name as it is in the cellar"
        required: true
        selector:
          text:
      value:
        description: "Price per bottle, US dollars"
        required: true
        selector:
          number:
            min: 0
            max: 100000
            mode: box
      value_source:
        description: "Where the price came from"
        selector:
          text:
    sequence:
      - action: todo.get_items
        target: { entity_id: todo.wine_cellar }
        data: { status: needs_action }
        response_variable: got
      - variables:
          matches: "{{ got['todo.wine_cellar']['items'] | selectattr('summary', 'search', '(?i)^' ~ (name | regex_escape) ~ '$') | list }}"
      - if: "{{ matches | count == 0 }}"
        then:
          - stop: "No wine by that name is in the cellar."
            error: true
      - repeat:
          for_each: "{{ matches }}"
          sequence:
            - variables:
                old: "{{ repeat.item.description | default('', true) }}"
                kept: "{{ old.split('\n') | reject('search', '^(Value|Valued):') | list }}"
            - action: todo.update_item
              target: { entity_id: todo.wine_cellar }
              data:
                item: "{{ repeat.item.uid }}"
                description: >-
                  {{ (kept + ['Value: ' ~ (value | float | round(0) | int), 'Valued: ' ~ now().strftime('%Y-%m-%d') ~ ' · ' ~ value_source | default('web price', true)]) | join('\n') }}
