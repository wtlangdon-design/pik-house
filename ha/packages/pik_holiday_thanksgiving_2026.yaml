            {% set words = q | regex_findall('[a-z0-9]+') %}
            {% set ns = namespace(id='', gap=10**9) %}
            {% for t in plan %}{% if t.i == q %}{% set ns.id = t.i %}{% set ns.gap = -1 %}{% endif %}{% endfor %}
            {% if ns.id == '' %}
              {% for t in plan if (is_state('input_boolean.tg26_' ~ t.i, 'on') != want) %}
                {% set x = t.x | lower | regex_findall('[a-z0-9]+') %}
                {% if words | count > 0 and words | select('in', x) | list | count == words | count %}
                  {% set gap = (as_timestamp(t.at) - as_timestamp(now())) | abs %}
                  {% if gap < ns.gap %}{% set ns.id = t.i %}{% set ns.gap = gap %}{% endif %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {{ ns.id }}
      - if: "{{ hit == '' }}"
        then:
          - variables: { result: { ok: false, message: "No task matches that. Ask holiday_whats_next for the list and use an id." } }
          - stop: "No match"
            response_variable: result
      - action: "input_boolean.turn_{{ 'on' if want else 'off' }}"
        target: { entity_id: "input_boolean.tg26_{{ hit }}" }
      - variables:
          row: "{{ plan | selectattr('i', 'eq', hit) | first }}"
          result: { ok: true, id: "{{ hit }}", task: "{{ row.d }} {{ row.h }}: {{ row.x }}", done: "{{ want }}" }
      - stop: "Done"
        response_variable: result

  holiday_log_turkey:
    alias: "Holiday cooking: log turkey temperatures"
    description: >-
      Logs probe readings in °F for the turkey (any of breast, thigh, wing). Returns all three latest readings
      and whether it's done. It's done only when all three read 165°F or more. Use for "the breast is 158".
    mode: queued
    fields:
      breast: { description: "Thickest part of the breast, °F", selector: { number: { min: 32, max: 250, mode: box } } }
      thigh: { description: "Innermost thigh, °F", selector: { number: { min: 32, max: 250, mode: box } } }
      wing: { description: "Innermost wing, °F", selector: { number: { min: 32, max: 250, mode: box } } }
    sequence:
      - if: "{{ breast is defined and breast | float(0) > 30 }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.tg26_turkey_breast }
            data: { value: "{{ breast | float | round(0) }}" }
      - if: "{{ thigh is defined and thigh | float(0) > 30 }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.tg26_turkey_thigh }
            data: { value: "{{ thigh | float | round(0) }}" }
      - if: "{{ wing is defined and wing | float(0) > 30 }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.tg26_turkey_wing }
            data: { value: "{{ wing | float | round(0) }}" }
      - variables:
          result: >-
            {% set r = namespace(d={}) %}
            {% for s in ['breast', 'thigh', 'wing'] %}{% set v = states('input_number.tg26_turkey_' ~ s) | float(0) %}{% set r.d = dict(r.d, **{s: (v | int if v > 30 else 'no reading')}) %}{% endfor %}
            {{ {'turkey_f': r.d, 'done': states('input_number.tg26_turkey_breast') | float(0) >= 165 and states('input_number.tg26_turkey_thigh') | float(0) >= 165 and states('input_number.tg26_turkey_wing') | float(0) >= 165} }}
      - stop: "Logged"
        response_variable: result

  holiday_step:
    alias: "Holiday cooking: recipe step"
    description: >-
      Walks through a Thanksgiving recipe step by step, from its first part to its last, the same way the kitchen screens do
      (one card per recipe; the screens move along too). action: next, back, repeat or first. dish: optional dish name,
      task id or a few words; without it, the recipe someone last used on a screen or by voice, else the one due now.
      Use for "next step", "next step on the stuffing" (moves it on), "go back", "what's this step" (repeat),
      "read me the gravy steps" (first). Read the step out with its ingredients
      and, if given, about how many minutes of work it takes (minutes_of_work).
      If it has a timer, offer to start it with kitchen_timer (that label and minutes). When a part is finished,
      tick it off with holiday_task_done (task_id).
    mode: queued
    fields:
      action: { description: "next, back, repeat or first", default: next, selector: { select: { options: [next, back, repeat, first] } } }
      dish: { description: "Optional: dish name, task id or a few words", selector: { text: null } }
    sequence:
      - variables:
          plan: [{"i":"tue_1900_turkey","at":"2026-11-24 19:00","d":"Tue","h":"7:00 PM","x":"Unwrap the turkey, giblets out, and read the label (already salted? skip the brine).","s":"turkey"},{"i":"tue_1900_brine","at":"2026-11-24 19:00","d":"Tue","h":"7:00 PM","x":"Mix brine (230 g salt + ¾ cup brown sugar per gallon) and get it to 40°F or colder by 8:00 (lots of ice).","s":"turkey"},{"i":"tue_1915_turkey","at":"2026-11-24 19:15","d":"Tue","h":"7:15 PM","x":"Spatchcock the turkey.","s":"turkey"},{"i":"tue_2000_turkey","at":"2026-11-24 20:00","d":"Tue","h":"8:00 PM","x":"Turkey into the brine (fridge, or cooler with ice at 40°F or colder).","s":"turkey"},{"i":"tue_2030_stuffing","at":"2026-11-24 20:30","d":"Tue","h":"8:30 PM","x":"Cube both loaves; spread on sheet pans to dry overnight.","s":"stuffing"},{"i":"tue_2100_turkey","at":"2026-11-24 21:00","d":"Tue","h":"9:00 PM","x":"Clear one full fridge shelf for the turkey's drying tray (from Wednesday 9:00).","s":"turkey"},{"i":"wed_0900_turkey","at":"2026-11-25 09:00","d":"Wed","h":"9:00 AM","x":"Turkey out of brine, patted very dry, uncovered on a rack in the fridge until Thursday.","s":"turkey"},{"i":"wed_0900_stuffing","at":"2026-11-25 09:00","d":"Wed","h":"9:00 AM","x":"Oven to 250°F; finish drying bread cubes if still soft. Cool; bag.","s":"stuffing"},{"i":"wed_0900_cran","at":"2026-11-25 09:00","d":"Wed","h":"9:00 AM","x":"Cranberry sauce; cool; fridge.","s":"cranberry sauce"},{"i":"wed_0930_eggs","at":"2026-11-25 09:30","d":"Wed","h":"9:30 AM","x":"Hard-boil eggs (check one at 14 min), ice, peel; filling; fridge separately.","s":"deviled eggs"},{"i":"wed_1030_mac","at":"2026-11-25 10:30","d":"Wed","h":"10:30 AM","x":"Lobster tails, ice, chop, fridge. Shred and grate cheeses.","s":"lobster mac"},{"i":"wed_1100_stuffing","at":"2026-11-25 11:00","d":"Wed","h":"11:00 AM","x":"Stuffing wet mix (butter, onion, celery, hearts, liver cooked through); cool in a shallow container; fridge.","s":"stuffing"},{"i":"wed_120