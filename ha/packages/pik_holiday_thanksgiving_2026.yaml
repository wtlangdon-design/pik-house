","x":"Burner 2: elbows in, 2 min short of al dente.","s":"lobster mac"},{"i":"thu_1500_cran","at":"2026-11-26 15:00","d":"Thu","h":"3:00 PM","x":"Cranberry sauce out of the fridge.","s":"cranberry sauce"},{"i":"thu_1500_salad","at":"2026-11-26 15:00","d":"Thu","h":"3:00 PM","x":"Vinaigrette out of the fridge.","s":"salad"},{"i":"thu_1508_mac","at":"2026-11-26 15:08","d":"Thu","h":"3:08 PM","x":"Assemble the mac and cheese.","s":"lobster mac"},{"i":"thu_1512_mac","at":"2026-11-26 15:12","d":"Thu","h":"3:12 PM","x":"Mac in at 425°F.","s":"lobster mac"},{"i":"thu_1515_mash","at":"2026-11-26 15:15","d":"Thu","h":"3:15 PM","x":"Burner 3: brown butter. Drain potatoes (save water); mash; hold covered on burner 1, lowest.","s":"mashed potatoes"},{"i":"thu_1520_turkey","at":"2026-11-26 15:20","d":"Thu","h":"3:20 PM","x":"Carve; platter; foil; into the 200°F smoker hold.","s":"turkey"},{"i":"thu_1530_x","at":"2026-11-26 15:30","d":"Thu","h":"3:30 PM","x":"Hot-hold check: stuffing and green beans read 140°F or hotter.","s":"hot-hold check"},{"i":"thu_1535_mac","at":"2026-11-26 15:35","d":"Thu","h":"3:35 PM","x":"Mac out; panko + chives on; tent loosely with foil. Oven off, door cracked so it falls toward 350°F.","s":"lobster mac"},{"i":"thu_1540_gbc","at":"2026-11-26 15:40","d":"Thu","h":"3:40 PM","x":"Green beans back in uncovered. The oven is still hotter than 350°F, so look at 5 minutes.","s":"green bean casserole"},{"i":"thu_1540_sprouts","at":"2026-11-26 15:40","d":"Thu","h":"3:40 PM","x":"Burner 5: char sprouts, batch 1 then 2 (herbs into the dressing first).","s":"brussels sprouts"},{"i":"thu_1545_salad","at":"2026-11-26 15:45","d":"Thu","h":"3:45 PM","x":"Slice endive; plain lettuce for Mom first.","s":"salad"},{"i":"thu_1550_salad","at":"2026-11-26 15:50","d":"Thu","h":"3:50 PM","x":"Toss the salad and plate it.","s":"salad"},{"i":"thu_1550_sprouts","at":"2026-11-26 15:50","d":"Thu","h":"3:50 PM","x":"Dress the sprouts lightly (rice on the side).","s":"brussels sprou