          stamp: "{{ now().strftime('%Y-%m-%d %H:%M') }}"
          due: >-
            {% set ns = namespace(out=[]) %}
            {% for t in plan if t.at == stamp and not is_state('input_boolean.tg26_' ~ t.i, 'on') %}{% set ns.out = ns.out + [t] %}{% endfor %}
            {{ ns.out }}
      - condition: "{{ due | count > 0 }}"
      - event: pik_holiday_task_due
        event_data: { plan: "thanksgiving_2026", tasks: "{{ due | map(attribute='i') | list }}" }
      - condition: "{{ not is_state('input_boolean.tg26_quiet', 'on') }}"
      - action: script.pik_announce
        data:
          message: >-
            {% if due | count == 1 %}{{ due[0].h }}. {{ due[0].x | replace(' → ', ', then ') | replace('→', ', then') | replace('°F', ' degrees') | replace('·', ',') }}
            {% else %}{% set names = due | map(attribute='s') | unique | list %}{% set n = ['zero','one','two','three','four','five','six','seven','eight','nine'][due | count] if due | count < 10 else due | count %}
            {{ n | capitalize }} things at {{ due[0].h }}: {{ names[:-1] | join(', ') ~ (' and ' if names | count > 1 else '') ~ names[-1] }}. Check the screen.{% endif %}
          phones: "{{ is_state('input_boolean.tg26_push', 'on') }}"

  - id: tg26_turkey_done
    alias: "Thanksgiving: the turkey is done"
    mode: single
    triggers:
      - trigger: template
        value_template: "{{ states('input_number.tg26_turkey_breast') | float(0) >= 165 and states('input_number.tg26_turkey_thigh') | float(0) >= 165 and states('input_number.tg26_turkey_wing') | float(0) >= 165 }}"
    actions:
      - action: script.pik_announce
        data:
          message: "The turkey is done: 165 degrees in the breast, thigh and wing. Off the smoker, tent it, and rest it 30 to 45 minutes."
          phones: true

