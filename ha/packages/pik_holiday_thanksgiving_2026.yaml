"Thu","h":"3:40 PM","x":"Burner 5: char sprouts, batch 1 then 2 (herbs into the dressing first)."},{"i":"thu_1545_salad","at":"2026-11-26 15:45","d":"Thu","h":"3:45 PM","x":"Slice endive; plain lettuce for Mom first."},{"i":"thu_1550_x","at":"2026-11-26 15:50","d":"Thu","h":"3:50 PM","x":"Finish: toss salad; dress sprouts lightly (rice on the side); onions on green beans; gravy to the boat; zest on cranberry."},{"i":"thu_1555_x","at":"2026-11-26 15:55","d":"Thu","h":"3:55 PM","x":"Spot-check every hot dish: 140°F or hotter. Anything cooler goes back in the still-warm oven for 5 minutes. Then to the table."},{"i":"thu_1600_x","at":"2026-11-26 16:00","d":"Thu","h":"4:00 PM","x":"Dinner."},{"i":"thu_1630_x","at":"2026-11-26 16:30","d":"Thu","h":"4:30 PM","x":"Two-hour rule: deviled eggs and roe dip back in the fridge."},{"i":"thu_1645_cake","at":"2026-11-26 16:45","d":"Thu","h":"4:45 PM","x":"Cake out of the fridge (dessert about 5:15, proposed)."},{"i":"thu_1800_x","at":"2026-11-26 18:00","d":"Thu","h":"6:00 PM","x":"Two-hour rule: everything back in the fridge. Turkey off the bone into shallow containers."}]
          stamp: "{{ now().strftime('%Y-%m-%d %H:%M') }}"
          due: >-
            {% set ns = namespace(out=[]) %}
            {% for t in plan if t.at == stamp and not is_state('input_boolean.tg26_' ~ t.i, 'on') %}{% set ns.out = ns.out + [t] %}{% endfor %}
            {{ ns.out }}
      - condition: "{{ due | count > 0 }}"
      - event: pik_holiday_task_due
        event_data: { plan: "thanksgiving_2026", tasks: "{{ due | map(attribute='i') | list }}" }
      - condition: "{{ not is_state('input_boolean.tg26_quiet', 'on') }}"
      - action: script.pik_announce
        data:
          message: >-
            {{ due[0].h }}. {% for t in due %}{{ t.x | replace(' → ', ', then ') | replace('→', ', then') | replace('°F', ' degrees') | replace('·', ',') }}{{ ' ' if not loop.last }}{% endfor %}
          phones: "{{ is_state('input_boolean.tg26_push', 'on') }}"

  - id: tg26_turkey_done
    alias: "Thanksgiving: the turkey is done"
    mode: single
    triggers:
      - trigger: template
        value_template: "{{ states('input_number.tg26_turkey_breast') | float(0) >= 165 and states('input_number.tg26_turkey_thigh') | float(0) >= 165 and states('input_number.tg26_turkey_wing') | float(0) >= 165 }}"
    actions:
      - action: script.pik_announce
        data:
          message: "The turkey is done: 165 degrees in the breast, thigh and wing. Off the smoker, tent it, and rest it 30 to 45 minutes."
          phones: true

script:
  holiday_whats_next:
    alias: "Holiday cooking: what's next"
    description: >-
      Thanksgiving cooking plan. Returns what's due now, what's next, how many earlier tasks aren't ticked off,
      the latest turkey readings, and running kitchen timers. Use for "what's next", "what should I be doing",
      "where are we", "how's the turkey". Each task has an id for holiday_task_done.
    mode: parallel
    sequence:
      - variables:
          plan: [{"i":"tue_1900_turkey","at":"2026-11-24 19:00","d":"Tue","h":"7:00 PM","x":"Turkey: confirm weight, fresh vs. thawed, and the label (no added solution). Remove giblets and hardware."},{"i":"tue_1915_turkey","at":"2026-11-24 19:15","d":"Tue","h":"7:15 PM","x":"Spatchcock the turkey."},{"i":"tue_1945_turkey","at":"2026-11-24 19:45","d":"Tue","h":"7:45 PM","x":"Mix brine (230 g salt + ¾ cup brown sugar per gallon); chill it to 40°F or colder."},{"i":"tue_2030_turkey","at":"2026-11-24 20:30","d":"Tue","h":"8:30 PM","x":"Turkey into the brine (fridge, or cooler with ice at 40°F or colder)."},{"i":"tue_2030_stuffing","at":"2026-11-24 20:30","d":"Tue","h":"8:30 PM","x":"Cube both loaves; spread on sheet pans to dry overnight."},{"i":"tue_2100_x","at":"2026-11-24 21:00","d":"Tue","h":"9:00 PM","x":"Clear one full fridge shelf for Wednesday's turkey drying tray."},{"i":"tue_2100_x_1","at":"2026-11-24 21:00","d":"Tue","h":"9:00 PM","x":"Groceries: are the oranges (Wed 9:00) and powdered sugar (Wed 1:00) here? If not, the bottled OJ is the backup."},{"i":"wed_0630_turkey","at":"2026-11-25 06:30","d":"Wed","h":"6:30 AM","x":"Turkey out of brine, patted very dry, uncovered on a rack in the fridge until Thursday."},{"i":"wed_0800_stuffing","at":"2026-11-25 08:00","d":"Wed","h":"8:00 AM","x":"Oven to 250°F; finish drying bread cubes if still soft. Cool; bag."},{"i":"wed_0900_cran","at":"2026-11-25 09:00","d":"Wed","h":"9:00 AM","x":"Cranberry sauce; cool; fridge."},{"i":"wed_0930_eggs","at":"2026-11-25 09:30","d":"Wed","h":"9:30 AM","x":"Hard-boil eggs (check one at 14 min), ice, peel; filling; fridge separately."},{"i":"wed_1030_mac","at":"2026-11-25 10:30","d":"Wed","h":"10:30 AM","x":"Lobster tails, ice, chop, fridge. Shred and grate cheeses."},{"i":"wed_1100_stuffing","at":"2026-11-25 11:00","d":"Wed","h":"11:00 AM","x":"Stuffing wet mix (butter, onion, celery, hearts, liver cooked through); cool in a shallow container; fridge."},{"i":"wed_1200_gbc","at":"2026-11-25 12:00","d":"Wed","h":"12:00 PM","x":"Green bean casserole: boil water, blanch, sauce, assemble; cool 30 min; fridge."},{"i":"wed_1300_cake","at":"2026-11-25 13:00","d":"Wed","h":"1:00 PM","x":"Oven to 350°F; gooey butter cake in at 1:20; check at 2:00; cool; fridge."},{"i":"wed_1430_turkey","at":"2026-11-25 14:30","d":"Wed","h":"2:30 PM","x":"Salt-free rub; one-stick garlic-herb butter; fridge."},{"i":"wed_1530_salad","at":"2026-11-25 15:30","d":"Wed","h":"3:30 PM","x":"Sherry vinaigrette; fridge."},{"i":"wed_1530_sprouts","at":"2026-11-25 15:30","d":"Wed","h":"3:30 PM","x":"Sprouts dressing base (no herbs); toast rice crisps with cayenne; cool; airtight."},{"i":"wed_1545_mac","at":"2026-11-25 15:45","d":"Wed","h":"3:45 PM","x":"GF panko topping; cool; airtight."},{"i":"wed_1630_x","at":"2026-11-25 16:30","d":"Wed","h":"4:30 PM","x":"Pellets: full hopper plus a spare bag for Thursday's smoke and 200°F hot hold."},{"i":"wed_1730_x","at":"2026-11-25 17:30","d":"Wed","h":"5:30 PM","x":"Fridge plan for Thursday; label each dish with its pull time. Check deliveries against the shopping list."},{"i":"thu_0830_dip","at":"2026-11-26 08:30","d":"Thu","h":"8:30 AM","x":"Cream cheese (dip) and herb butter out to soften."},{"i":"thu_0900_eggs","at":"2026-11-26 09:00","d":"Thu","h":"9:00 AM","x":"Crisp the prosciutto; drain; airtight at room temperature."},{"i":"thu_0915_dip","at":"2026-11-26 09:15","d":"Thu","h":"9:15 AM","x":"Make the roe dip (¾ of the roe folded in); cover; fridge."},{"i":"thu_0930_turkey","at":"2026-11-26 09:30","d":"Thu","h":"9:30 AM","x":"Fill hopper; smoker to 250°F."},{"i":"thu_0940_turkey","at":"2026-11-26 09:40","d":"Thu","h":"9:40 AM","x":"Herb butter under the skin; rub lightly outside."},{"i":"thu_1015_turkey","at":"2026-11-26 10:15","d":"Thu","h":"10:15 AM","x":"Turkey on, skin up, drip pan below, probe in the thigh."},{"i":"thu_1115_turkey","at":"2026-11-26 11:15","d":"Thu","h":"11:15 AM","x":"Log temperature; check pellets."},{"i":"thu_1200_sprouts","at":"2026-11-26 12:00","d":"Thu","h":"12:00 PM","x":"Sprouts: boil until just tender (our method), dry well, fridge."},{"i":"thu_1200_salad","at":"2026-11-26 12:00","d":"Thu","h":"12:00 PM","x":"Wash and dry greens; roll in towels; fridge."},{"i":"thu_1215_turkey","at":"2026-11-26 12:15","d":"Thu","h":"12:15 PM","x":"Log temperature. If the thigh is about 130°F, raise the smoker to 325–350°F now."},{"i":"thu_1245_turkey","at":"2026-11-26 12:45","d":"Thu","h":"12:45 PM","x":"Smoker at 325–350°F (crisp skin). Check every 20–30 min from now."},{"i":"thu_1315_mash","at":"2026-11-26 13:15","d":"Thu","h":"1:15 PM","x":"Cut potatoes; cold water; fridge."},{"i":"thu_1330_stuffing","at":"2026-11-26 13:30","d":"Thu","h":"1:30 PM","x":"Warm the stuffing wet mix until the butter melts."},{"i":"thu_1345_eggs","at":"2026-11-26 13:45","d":"Thu","h":"1:45 PM","x":"Pipe deviled eggs; cover; fridge."},{"i":"thu_1345_stuffing","at":"2026-11-26 13:45","d":"Thu","h":"1:45 PM","x":"Mix stuffing (bread + wet mix + broth added gradually); taste; into buttered casserole; foil on."},{"i":"thu_1350_x","at":"2026-11-26 13:50","d":"Thu","h":"1:50 PM","x":"Oven to 350°F."},{"i":"thu_1400_turkey","at":"2026-11-26 14:00","d":"Thu","h":"2:00 PM","x":"Turkey done window opens (2:00–2:45). Done only at 165°F in breast, thigh and wing."},{"i":"thu_1405_stuffing","at":"2026-11-26 14:05","d":"Thu","h":"2:05 PM","x":"Stuffing in, covered."},{"i":"thu_1430_gbc","at":"2026-11-26 14:30","d":"Thu","h":"2:30 PM","x":"Green bean casserole in from the fridge, covered."},{"i":"thu_1430_eggs","at":"2026-11-26 14:30","d":"Thu","h":"2:30 PM","x":"Appetizers out: eggs garnished, dip topped, chips. Back in the fridge by 4:30."},{"i":"thu_1440_stuffing","at":"2026-11-26 14:40","d":"Thu","h":"2:40 PM","x":"Uncover stuffing; bake to 165°F in the center."},{"i":"thu_1440_mash","at":"2026-11-26 14:40","d":"Thu","h":"2:40 PM","x":"Burner 1: potato water on. Burner 2: pasta water on."},{"i":"thu_1445_turkey","at":"2026-11-26 14:45","d":"Thu","h":"2:45 PM","x":"Turkey off once it's 165°F everywhere: tent, rest. Smoker to its lowest setting for the hot hold (aim 200–225°F); open the lid a few minutes so it drops faster."},{"i":"thu_1445_mac","at":"2026-11-26 14:45","d":"Thu","h":"2:45 PM","x":"Burner 3: mac sauce."},{"i":"thu_1450_gravy","at":"2026-11-26 14:50","d":"Thu","h":"2:50 PM","x":"Burner 4: gravy from drippings + broth (taste drippings first); hold on lowest."},{"i":"thu_1500_x","at":"2026-11-26 15:00","d":"Thu","h":"3:00 PM","x":"Stuffing (165°F) and green beans out, covered, into the 200°F smoker hold. Oven up to 425°F."},{"i":"thu_1500_mash","at":"2026-11-26 15:00","d":"Thu","h":"3:00 PM","x":"Burner 1: potatoes in."},{"i":"thu_1500_mac","at":"2026-11-26 15:00","d":"Thu","h":"3:00 PM","x":"Burner 2: elbows in, 2 min short of al dente."},{"i":"thu_1500_x_1","at":"2026-11-26 15:00","d":"Thu","h":"3:00 PM","x":"Cranberry sauce and vinaigrette out of the fridge."},{"i":"thu_1508_mac","at":"2026-11-26 15:08","d":"Thu","h":"3:08 PM","x":"Assemble the mac and cheese."},{"i":"thu_1512_mac","at":"2026-11-26 15:12","d":"Thu","h":"3:12 PM","x":"Mac in at 425°F."},{"i":"thu_1515_mash","at":"2026-11-26 15:15","d":"Thu","h":"3:15 PM","x":"Burner 3: brown butter. Drain potatoes (save water); mash; hold covered on burner 1, lowest."},{"i":"thu_1520_turkey","at":"2026-11-26 15:20","d":"Thu","h":"3:20 PM","x":"Carve; platter; foil; into the 200°F smoker hold."},{"i":"thu_1530_x","at":"2026-11-26 15:30","d":"Thu","h":"3:30 PM","x":"Hot-hold check: stuffing and green beans read 140°F or hotter."},{"i":"thu_1535_mac","at":"2026-11-26 15:35","d":"Thu","h":"3:35 PM","x":"Mac out; panko + chives on; tent loosely with foil. Oven off, door cracked so it falls toward 350°F."},{"i":"thu_1540_gbc","at":"2026-11-26 15:40","d":"Thu","h":"3:40 PM","x":"Green beans back in uncovered. The oven is still hotter than 350°F, so look at 5 minutes."},{"i":"thu_1540_sprouts","at":"2026-11-26 15:40","d":"Thu","h":"3:40 PM","x":"Burner 5: char sprouts, batch 1 then 2 (herbs into the dressing first)."},{"i":"thu_1545_salad","at":"2026-11-26 15:45","d":"Thu","h":"3:45 PM","x":"Slice endive; plain lettuce for Mom first."},{"i":"thu_1550_x","at":"2026-11-26 15:50","d":"Thu","h":"3:50 PM","x":"Finish: toss salad; dress sprouts lightly (rice on the side); onions on green beans; gravy to the boat; zest on cranberry."},{"i":"thu_1555_x","at":"2026-11-26 15:55","d":"Thu","h":"3:55 PM","x":"Spot-check every hot dish: 140°F or hotter. Anything cooler goes back in the still-warm oven for 5 minutes. Then to the table."},{"i":"thu_1600_x","at":"2026-11-26 16:00","d":"Thu","h":"4:00 PM","x":"Dinner."},{"i":"thu_1630_x","at":"2026-11-26 16:30","d":"Thu","h":"4:30 PM","x":"Two-hour rule: deviled eggs and roe dip back in the fridge."},{"i":"thu_1645_cake","at":"2026-11-26 16:45","d":"Thu","h":"4:45 PM","x":"Cake out of the fridge (dessert about 5:15, proposed)."},{"i":"thu_1800_x","at":"2026-11-26 18:00","d":"Thu","h":"6:00 PM","x":"Two-hour rule: everything back in the fridge. Turkey off the bone into shallow containers."}]
          result: >-
            {% set n = now() %}
            {% set soon = (n + timedelta(minutes=15)).strftime('%Y-%m-%d %H:%M') %}
            {% set back = (n - timedelta(minutes=30)).strftime('%Y-%m-%d %H:%M') %}
            {% set ns = namespace(due=[], nxt=[], late=[]) %}
            {% for t in plan if not is_state('input_boolean.tg26_' ~ t.i, 'on') %}
              {% set row = {'id': t.i, 'when': t.d ~ ' ' ~ t.h, 'task': t.x} %}
              {% if back <= t.at <= soon %}{% set ns.due = ns.due + [row] %}
              {% elif t.at > soon and ns.nxt | count < 5 %}{% set ns.nxt = ns.nxt + [row] %}
              {% elif t.at < back %}{% set ns.late = ns.late + [row] %}{% endif %}
            {% endfor %}
            {% set tk = namespace(r={}) %}
            {% for s in ['breast', 'thigh', 'wing'] %}{% set v = states('input_number.tg26_turkey_' ~ s) | float(0) %}{% set tk.r = dict(tk.r, **{s: (v | int if v > 30 else 'no reading')}) %}{% endfor %}
            {{ {'now': n.strftime('%a %-I:%M %p'), 'dinner': "Thursday, November 26 · dinner for 7 at 4:00 PM", 'due_now': ns.due, 'next': ns.nxt,
                'earlier_not_ticked': ns.late[-5:], 'earlier_not_ticked_count': ns.late | count,
                'turkey_f': tk.r, 'turkey_done': states('input_number.tg26_turkey_breast') | float(0) >= 165 and states('input_number.tg26_turkey_thigh') | float(0) >= 165 and states('input_number.tg26_turkey_wing') | float(0) >= 165,
                'turkey_rule': 'Done only at 165F in the thickest breast, innermost thigh and innermost wing. Never by a timer.'} }}
      - stop: "Plan"
        response_variable: result

  holiday_task_done:
    alias: "Holiday cooking: tick a task off"
    description: >-
      Ticks a task in the Thanksgiving plan off (or back on with done=false). "task" is its id from holiday_whats_next,
      or a few words from it ("stuffing in", "potato water"); words pick the unticked task nearest to now.
      Use for "the stuffing's in", "done with the brine", "tick off the gravy".
    mode: queued
    fields:
      task: { description: "Task id, or a few words from the task", required: true, selector: { text: null } }
      done: { description: "true = ticked off (default), false = not done", default: true, selector: { boolean: null } }
    sequence:
