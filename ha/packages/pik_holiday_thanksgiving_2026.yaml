","x":"Burner 2: elbows in, 2 min short of al dente.","s":"lobster mac"},{"i":"thu_1500_cran","at":"2026-11-26 15:00","d":"Thu","h":"3:00 PM","x":"Cranberry sauce out of the fridge.","s":"cranberry sauce"},{"i":"thu_1500_salad","at":"2026-11-26 15:00","d":"Thu","h":"3:00 PM","x":"Vinaigrette out of the fridge.","s":"salad"},{"i":"thu_1508_mac","at":"2026-11-26 15:08","d":"Thu","h":"3:08 PM","x":"Assemble the mac and cheese.","s":"lobster mac"},{"i":"thu_1512_mac","at":"2026-11-26 15:12","d":"Thu","h":"3:12 PM","x":"Mac in at 425°F.","s":"lobster mac"},{"i":"thu_1515_mash","at":"2026-11-26 15:15","d":"Thu","h":"3:15 PM","x":"Burner 3: brown butter. Drain potatoes (save water); mash; hold covered on burner 1, lowest.","s":"mashed potatoes"},{"i":"thu_1520_turkey","at":"2026-11-26 15:20","d":"Thu","h":"3:20 PM","x":"Carve; platter; foil; into the 200°F smoker hold.","s":"turkey"},{"i":"thu_1530_x","at":"2026-11-26 15:30","d":"Thu","h":"3:30 PM","x":"Hot-hold check: stuffing and green beans read 140°F or hotter.","s":"hot-hold check"},{"i":"thu_1535_mac","at":"2026-11-26 15:35","d":"Thu","h":"3:35 PM","x":"Mac out; panko + chives on; tent loosely with foil. Oven off, door cracked so it falls toward 350°F.","s":"lobster mac"},{"i":"thu_1540_gbc","at":"2026-11-26 15:40","d":"Thu","h":"3:40 PM","x":"Green beans back in uncovered. The oven is still hotter than 350°F, so look at 5 minutes.","s":"green bean casserole"},{"i":"thu_1540_sprouts","at":"2026-11-26 15:40","d":"Thu","h":"3:40 PM","x":"Burner 5: char sprouts, batch 1 then 2 (herbs into the dressing first).","s":"brussels sprouts"},{"i":"thu_1545_salad","at":"2026-11-26 15:45","d":"Thu","h":"3:45 PM","x":"Slice endive; plain lettuce for Mom first.","s":"salad"},{"i":"thu_1550_salad","at":"2026-11-26 15:50","d":"Thu","h":"3:50 PM","x":"Toss the salad and plate it.","s":"salad"},{"i":"thu_1550_sprouts","at":"2026-11-26 15:50","d":"Thu","h":"3:50 PM","x":"Dress the sprouts lightly (rice on the side).","s":"brussels sprouts"},{"i":"thu_1550_gbc","at":"2026-11-26 15:50","d":"Thu","h":"3:50 PM","x":"Crispy onions on the green beans.","s":"green bean casserole"},{"i":"thu_1550_gravy","at":"2026-11-26 15:50","d":"Thu","h":"3:50 PM","x":"Gravy into the boat.","s":"gravy"},{"i":"thu_1550_cran","at":"2026-11-26 15:50","d":"Thu","h":"3:50 PM","x":"Cranberry sauce into the bowl; zest on top.","s":"cranberry sauce"},{"i":"thu_1555_x","at":"2026-11-26 15:55","d":"Thu","h":"3:55 PM","x":"Spot-check every hot dish: 140°F or hotter. Anything cooler goes back in the still-warm oven for 5 minutes. Then to the table.","s":"spot-check every hot dish"},{"i":"thu_1600_x","at":"2026-11-26 16:00","d":"Thu","h":"4:00 PM","x":"Dinner.","s":"dinner"},{"i":"thu_1630_eggs","at":"2026-11-26 16:30","d":"Thu","h":"4:30 PM","x":"Two-hour rule: deviled eggs back in the fridge.","s":"deviled eggs"},{"i":"thu_1630_dip","at":"2026-11-26 16:30","d":"Thu","h":"4:30 PM","x":"Two-hour rule: roe dip back in the fridge.","s":"salmon roe dip"},{"i":"thu_1645_cake","at":"2026-11-26 16:45","d":"Thu","h":"4:45 PM","x":"Cake out of the fridge (dessert about 5:15, proposed).","s":"gooey butter cake"},{"i":"thu_1800_x","at":"2026-11-26 18:00","d":"Thu","h":"6:00 PM","x":"Two-hour rule: everything back in the fridge. Turkey off the bone into shallow containers.","s":"two-hour rule"}]
          runs: {"turkey":{"n":"Turkey","e":[{"k":"tue_1900_turkey","x":"7:00 PM: unwrap. Pull out the neck and giblets and any pop-up timer or leg clip; keep the neck in the fridge for the gravy. Make sure it's fully thawed (no ice inside). Read the label: if it says enhanced, basted, self-basting or kosher, or lists a salt solution, it's already salted: skip the brine (tick off the brine steps), pat it dry and keep it uncovered on the rack in the fridge until Thursday.","i":"","tm":null,"m":10},{"k":"tue_1900_brine","x":"Mix brine: for each gallon, dissolve 230 g salt and ¾ cup brown sugar in 1 quart hot water, then add 3 quarts cold water and ice. It must be 40°F or colder before the turkey goes in.","i":"1 gal cold water; 230 g Himalayan salt (weigh it); ¾ cup brown sugar","tm":null,"m":15},{"k":"tue_1915_turkey","x":"Spatchcock: breast down, cut along both sides of the backbone with shears and remove it. Flip, press firmly on the breastbone to flatten.","i":"","tm":null,"m":15},{"k":"tue_2000_turkey","x":"8:00 PM: turkey into the brining bag, brine over it until covered, seal, into the fridge or a cooler packed with ice (check it stays at or below 40°F).","i":"","tm":["Turkey: out of the brine",780,"done"],"m":10},{"k":"tue_2100_turkey","x":"Clear one full fridge shelf for the turkey's drying tray (from Wednesday 9:00).","i":"","tm":null},{"k":"wed_0900_turkey","x":"9:00 AM: lift the turkey out and discard the brine. Pat completely dry, including under the wings. Set skin-up on the rack over the sheet and refrigerate uncovered until Thursday morning.","i":"","tm":null,"m":10},{"k":"wed_1430_turkey","x":"2:30 PM: make the rub. Mash the butter with parsley, thyme, chives, sage, onion, garlic and 2 tbsp rub. Cover and refrigerate.","i":"2 tbsp paprika; 2 tbsp garlic powder; 2 tbsp onion powder; 1 tbsp black pepper; 1 tbsp dried thyme; 2 tbsp of that rub, into the butter; 8 tbsp unsalted butter, softened; ¼ cup each chopped fresh parsley, thyme, chives, sage, and onion; 5 garlic cloves, minced","tm":null,"m":15},{"k":"wed_1630_turkey","x":"Pellets: full hopper plus a spare bag for Thursday's smoke and 200°F hot hold.","i":"","tm":null},{"k":"thu_0900_turkey","x":"9:00 AM: take the herb butter out to soften.","i":"herb butter (made Wednesday)","tm":null,"m":1},{"k":"thu_0930_turkey","x":"9:30 AM: fill the pellet hopper and start the smoker at 250°F. Load the turkey only once the smoker reads 250°F.","i":"","tm":["Smoker at 250°F?",20,"check"],"m":5},{"k":"thu_0940_turkey","x":"9:40 AM: loosen the skin over breast, thighs and legs with your fingers. Push all the herb butter under the skin and spread it flat. Dust the outside lightly with the remaining rub.","i":"all herb butter; the rest homemade rub, lightly on the outside","tm":null,"m":15},{"k":"thu_1015_turkey","x":"10:15 AM: turkey on the grate skin-side up, drip pan underneath. Probe in the innermost thigh, not touching bone.","i":"","tm":["Turkey: first temperature check",60,"temp"],"m":5},{"k":"thu_1015_turkey","x":"Check and log the probe every hour; add pellets as needed.","i":"","tm":["Turkey: temperature check",60,"temp"],"m":2},{"k":"thu_1115_turkey","x":"Check and log the probe every hour; add pellets as needed.","i":"","tm":["Turkey: temperature check",60,"temp"],"m":2},{"k":"thu_1215_turkey","x":"About 12:30 PM (or once the thigh reads ~130°F): raise the smoker to 325–350°F to crisp the skin. From here, check every 20–30 minutes.","i":"","tm":["Turkey: temperature check",25,"temp"],"m":2},{"k":"thu_1245_turkey","x":"About 12:30 PM (or once the thigh reads ~130°F): raise the smoker to 325–350°F to crisp the skin. From here, check every 20–30 minutes.","i":"","tm":["Turkey: temperature check",25,"temp"],"m":2},{"k":"thu_1400_turkey","x":"Done only when breast, thigh and wing all read 165°F (log all three on the Turkey tab). Expected window: 2:00–2:45 PM. It's an estimate, not a timer.","i":"","tm":["Turkey: temperature check",20,"temp"],"m":2},{"k":"thu_1445_turkey","x":"Off the smoker onto the rack, tent loosely with foil, rest 30–45 minutes. Drippings to the gravy cook. Set the smoker to its lowest setting (200–225°F): it becomes the hot hold for the stuffing and green beans.","i":"","tm":["Turkey: rest check",30,"check"],"m":5},{"k":"thu_1520_turkey","x":"3:20 PM: carve. Legs off, split drums and thighs, wings off, lift each breast half off in one piece and slice across. Platter, foil, into the 200°F smoker hold until 3:55.","i":"","tm":null,"m":20}]},"stuffing":{"n":"Stuffing","e":[{"k":"tue_2030_stuffing","x":"8:30 PM: cut both loaves into ¾-inch cubes, spread on sheet pans, and leave out overnight to dry.","i":"2 loaves Carbonaut white gluten-free bread","tm":null,"m":20},{"k":"wed_0900_stuffing","x":"9:00 AM: if the cubes are still soft, dry them in a 250°F oven, stirring once, until crisp-dry. Cool; store in bags.","i":"2 loaves Carbonaut white gluten-free bread","tm":["Bread: dry yet?",30,"check"],"m":5},{"k":"wed_1100_stuffing","x":"11:00 AM: melt the butter; cook onion and celery until soft.","i":"2 sticks butter (16 tbsp); ½–1 cup onion, minced; ½–1 cup celery, minced","tm":["Onion & celery soft?",8,"check"],"m":10},{"k":"wed_1100_stuffing","x":"Add the minced hearts and liver and cook through completely (no pink). Season with dried parsley, sage and salt. Cool in a shallow container; refrigerate.","i":"≈¼ lb chicken hearts, minced; ≈¼ lb chicken liver, minced; to taste dried parsley, dried sage, salt","tm":null,"m":10},{"k":"thu_1330_stuffing","x":"1:30 PM: warm the wet mix gently until the butter melts.","i":"","tm":null,"m":5},{"k":"thu_1345_stuffing","x":"1:45 PM: in the big bowl, toss bread with the wet mix. Add broth a cup at a time until evenly moist. Taste for salt. Pack into the buttered casserole; cover with foil.","i":"2 loaves bread cubes, dried; a cup at a time chicken broth; a little butter, for the dish; dried parsley, dried sage, salt","tm":null,"m":15},{"k":"thu_1350_stuffing","x":"Oven to 350°F for the stuffing and green beans.","i":"","tm":["Oven at 350°F?",15,"check"]},{"k":"thu_1405_stuffing","x":"2:05 PM: bake at 350°F, covered.","i":"","tm":["Stuffing: uncover",35,"done"],"m":2},{"k":"thu_1440_stuffing","x":"2:40 PM: uncover and bake until the center reads 165°F and the top crisps.","i":"","tm":["Stuffing: check center 165°F",20,"check"],"m":2},{"k":"thu_1500_stuffing","x":"3:00 PM: out, covered, into the smoker hot hold (200–225°F). Check it reads 140°F or hotter at 3:30 and 3:50.","i":"","tm":null,"m":3}]},"cran":{"n":"Cranberry sauce","e":[{"k":"wed_0900_cran","x":"9:00 AM: combine cranberries, orange juice, maple syrup and vanilla in the pot (save the zest). Bring to a boil over medium-high.","i":"1 lb cranberries; 1 cup fresh-squeezed orange juice; ½ cup pure maple syrup; 1 tsp vanilla","tm":["Cranberries boiling?",5,"check"],"m":5},{"k":"wed_0900_cran","x":"Cover, lower the heat and simmer until berries pop and it coats a spoon.","i":"","tm":["Cranberries: popped and thick?",10,"check"],"m":2},{"k":"wed_0900_cran","x":"Uncover and simmer a few more minutes to thicken.","i":"","tm":["Thick enough?",4,"check"],"m":2},{"k":"wed_0900_cran","x":"Cool, then into an airtight container in the fridge.","i":"","tm":null,"m":5},{"k":"thu_1500_cran","x":"3:00 PM: out of the fridge. 3:50 PM: into the bowl; zest on top.","i":"1 orange, zested","tm":null,"m":2},{"k":"thu_1550_cran","x":"Cranberry sauce into the bowl; zest on top.","i":"","tm":null}]},"eggs":{"n":"Deviled eggs","e":[{"k":"wed_0930_eggs","x":"Put eggs in the saucepan, cover with cold water by an inch, and bring to a boil over high heat.","i":"8 large eggs","tm":["Eggs: water boiling?",10,"check"],"m":2},{"k":"wed_0930_eggs","x":"As soon as it boils, cover, turn off the heat and let the eggs sit. At Reno's elevation this takes a little longer: check one egg.","i":"","tm":["Eggs: check one egg",14,"check"],"m":1},{"k":"wed_0930_eggs","x":"Move eggs to ice water until cold.","i":"","tm":["Eggs: cooled",10,"done"],"m":2},{"k":"wed_0930_eggs","x":"Peel, halve lengthwise, and pop the yolks into a bowl. Cover the whites and refrigerate.","i":"","tm":null,"m":15},{"k":"wed_0930_eggs","x":"Mash yolks with the mayo, Dijon and a splash of cider vinegar until smooth. Taste. Spoon into the piping bag, seal, refrigerate.","i":"¼ cup mayonnaise; 2 tsp Dijon mustard; 1 splash apple cider vinegar","tm":null,"m":10},{"k":"thu_0900_eggs","x":"9:00 AM: crisp the prosciutto in a dry skillet over medium, turning once, until it darkens and stops sizzling. Drain on paper towels; it crisps as it cools. Crumble.","i":"≈2 oz prosciutto","tm":["Prosciutto: flip / check",3,"check"],"m":5},{"k":"thu_1345_eggs","x":"1:45 PM: pipe the filling into the whites. Cover and refrigerate.","i":"","tm":null,"m":10},{"k":"thu_1430_eggs","x":"2:30 PM: top with prosciutto and chives right before they go out. Back in the fridge by 4:30.","i":"≈2 oz prosciutto, crisped; 2 tbsp fresh chives, finely chopped","tm":null,"m":5},{"k":"thu_1630_eggs","x":"Two-hour rule: deviled eggs back in the fridge.","i":"","tm":null}]},"mac":{"n":"Lobster mac","e":[{"k":"wed_1030_mac","x":"10:30 AM: boil the lobster tails in salted water just until the shells turn red (slightly under). Ice, then pull the meat, chop, refrigerate.","i":"3 lobster tails","tm":["Lobster: shells red?",5,"check"],"m":15},{"k":"wed_1030_mac","x":"Shred the cheddar and gruyère; grate the pecorino. Refrigerate.","i":"1½ cups aged white cheddar, shredded; 1 cup gruyère, shredded; ½ cup aged white cheddar; ½ cup gruyère; ⅓ cup pecorino romano, grated","tm":null,"m":15},{"k":"wed_1545_mac","x":"3:45 PM: topping. Sauté shallot, garlic and thyme in butter and oil, add the GF panko and toast until golden. Cool; store airtight.","i":"1 tbsp butter; 1 tbsp olive oil; 1 tbsp shallot, grated; ½ tbsp garlic, grated; 1 tbsp thyme; ½ cup gluten-free panko","tm":["Panko: golden?",3,"check"],"m":8},{"k":"thu_1440_mac","x":"2:40 PM: pasta water on (salted).","i":"salt, for the water","tm":["Pasta water boiling?",15,"check"],"m":2},{"k":"thu_1445_mac","x":"2:45 PM: sauce. Sauté shallot, garlic and thyme in butter and oil 2–3 min; stir in gochujang and gochugaru; add the cooking sherry and reduce by about a third.","i":"3 tbsp butter; 1 tbsp olive oil; 2 tbsp shallot, grated; 1 tbsp garlic, grated; 2 tbsp fresh thyme leaves; 2 tbsp gochujang; 2 tbsp gochugaru; ½ cup Holland House sherry cooking wine","tm":null,"m":8},{"k":"thu_1445_mac","x":"Add the cream and simmer until reduced by about a third.","i":"3 cups heavy cream","tm":["Sauce: reduced by a third?",10,"check"],"m":2},{"k":"thu_1445_mac","x":"Off the heat: stir in cheddar and gruyère in three additions, then mascarpone. Add Worcestershire and hot sauce. Taste, then salt only if needed.","i":"1½ cups aged white cheddar, shredded; 1 cup gruyère, shredded; ⅓ cup mascarpone; 2 tsp Worcestershire; 2 tsp hot sauce; to taste salt (after tasting) and pepper","tm":null,"m":5},{"k":"thu_1500_oven425","x":"Oven up to 425°F for the mac.","i":"","tm":["Oven at 425°F?",12,"check"]},{"k":"thu_1500_mac","x":"3:00 PM: cook the elbows about 2 minutes short of the box's al dente time. Drain.","i":"8 oz dry elbow macaroni (regular)","tm":["Pasta: 2 min short of al dente",7,"check"],"m":2},{"k":"thu_1508_mac","x":"3:08 PM: layer in the dish: half the pasta, half the sauce, all the lobster, the rest of the pasta and sauce, then the topping cheeses.","i":"all cooked elbows; all the sauce; 3 lobster tails; ½ cup aged white cheddar; ½ cup gruyère; ⅓ cup pecorino romano, grated","tm":null,"m":8},{"k":"thu_1512_mac","x":"3:12 PM: bake at 425°F.","i":"","tm":["Mac: bubbling and golden?",20,"check"],"m":2},{"k":"thu_1535_mac","x":"3:35 PM: out. Fold parsley into the panko; scatter on with chives. Tent loosely with foil and rest until 3:55 (it sets the sauce); check it's 140°F or hotter before serving.","i":"toasted panko (from Wednesday); ⅓ cup parsley, chopped; to finish chives","tm":null,"m":5}]},"gbc":{"n":"Green bean casserole","e":[{"k":"wed_1200_gbc","x":"12:00 PM: big pot of salted water to a boil (it takes longer at Reno's elevation).","i":"salt, for the water","tm":["Bean water boiling?",15,"check"],"m":2},{"k":"wed_1200_gbc","x":"Blanch the beans 5 minutes, then into ice water. Drain well.","i":"2 lb green beans, trimmed","tm":["Beans: bright and just tender?",5,"check"],"m":8},{"k":"wed_1200_gbc","x":"Sauté the mushrooms in the butter and oil until their liquid is gone and they brown.","i":"1½ lb mushrooms (purchased sliced); 2 tbsp butter; 2 tbsp neutral oil","tm":["Mushrooms browned?",8,"check"],"m":10},{"k":"wed_1200_gbc","x":"Add garlic for 30 seconds, then the gluten-free flour for 1–2 minutes, stirring.","i":"2 garlic cloves, minced; ¼ cup gluten-free flour","tm":null,"m":3},{"k":"wed_1200_gbc","x":"Whisk in the broth, cream, soy sauce and lemon juice; simmer 5 minutes. Season.","i":"2 cups broth; 1½ cups cream; 1 tsp dark soy sauce; 2 tsp lemon juice; to taste salt and pepper","tm":["Sauce: simmered 5 min",5,"check"],"m":5},{"k":"wed_1200_gbc","x":"Fold in the beans and 1 cup crispy onions. Into the 13×9. Cool about 30 minutes, then cover and refrigerate.","i":"2 lb blanched beans; 1 cup crispy onions","tm":null,"m":5},{"k":"thu_1430_gbc","x":"2:30 PM: into the 350°F oven, covered with foil.","i":"","tm":["Green beans: covered stage (check heat)",30,"check"],"m":2},{"k":"thu_1500_gbc","x":"3:00 PM: out, still covered, into the smoker hot hold (200–225°F).","i":"","tm":null,"m":2},{"k":"thu_1540_gbc","x":"3:40 PM: back in the oven, uncovered, until bubbling. The oven is cooling from 425°F and still hotter than 350°F, so look at 5 minutes.","i":"","tm":["Green beans: bubbling?",5,"check"],"m":2},{"k":"thu_1550_gbc","x":"3:50 PM: top with the remaining 1 cup crispy onions right before serving.","i":"1 cup crispy onions","tm":null,"m":1}]},"cake":{"n":"Gooey butter cake","e":[{"k":"wed_1300_cake","x":"1:00 PM: heat the oven to 350°F. Grease the 13×9.","i":"","tm":["Oven at 350°F?",15,"check"],"m":5},{"k":"wed_1300_cake","x":"Mix the 18¼ oz cake mix, 1 egg and 8 tbsp melted butter; pat evenly into the pan.","i":"18¼ oz King Arthur GF yellow cake mix; 1 egg; 8 tbsp butter, melted","tm":null,"m":10},{"k":"wed_1300_cake","x":"Beat cream cheese and pumpkin smooth. Beat in 3 eggs, vanilla and melted butter. Mix in powdered sugar, cinnamon and nutmeg.","i":"8 oz cream cheese, softened; 15 oz canned pumpkin; 3 eggs; 1 tsp vanilla; 8 tbsp butter, melted; 16 oz powdered sugar; 1 tsp cinnamon; 1 tsp nutmeg","tm":null,"m":10},{"k":"wed_1300_cake","x":"1:20 PM: spread the filling over the crust and bake.","i":"","tm":["Cake: first doneness check",40,"check"],"m":5},{"k":"wed_1300_cake","x":"Pull when the edges are set and the center still jiggles slightly. Cool on a rack, then cover and refrigerate.","i":"","tm":null,"m":3},{"k":"thu_1645_cake","x":"≈4:45 PM: out of the fridge 30 minutes before dessert (if you like it less cold). Cut into squares.","i":"","tm":null,"m":5}]},"salad":{"n":"Salad","e":[{"k":"wed_1530_salad","x":"3:30 PM: rinse the chopped shallot in a strainer; drain.","i":"¼ cup shallot, finely chopped","tm":null,"m":2},{"k":"wed_1530_salad","x":"Combine shallot, garlic, sugar, salt, thyme, sherry vinegar and warm water. Slowly whisk in the oil. Refrigerate.","i":"¼ cup shallot, finely chopped; 1 garlic clove, finely grated; ¾ tsp sugar; ½ tsp salt; ≈1 tsp fresh thyme leaves, chopped; ¼ cup O Olive aged sherry vinegar; 2 tsp warm water; ¾ cup extra-virgin olive oil","tm":null,"m":8},{"k":"thu_1200_salad","x":"12:00 PM: wash the lettuces; spin or towel completely dry; roll in towels; refrigerate.","i":"2 heads butter lettuce; as needed romaine hearts","tm":null,"m":15},{"k":"thu_1500_salad","x":"3:00 PM: vinaigrette out of the fridge; whisk again before using.","i":"","tm":null,"m":1},{"k":"thu_1545_salad","x":"3:45 PM: slice the endive. Set aside plain lettuce for Mom first.","i":"2 Belgian endive heads; a few leaves butter lettuce, plain, for Mom","tm":null,"m":5},{"k":"thu_1550_salad","x":"3:52 PM: toss the rest with dressing a little at a time; plate.","i":"the greens; a little at a time vinaigrette","tm":null,"m":5}]},"sprouts":{"n":"Brussels sprouts","e":[{"k":"wed_1530_sprouts","x":"3:30 PM: mix fish sauce, water, sugar, rice vinegar, lime juice, garlic and chile until the sugar dissolves. Refrigerate (no herbs yet).","i":"¼ cup fish sauce; 2 tbsp water; 2 tbsp sugar; 1 tbsp rice vinegar; 1 tbsp lime juice; 1 small garlic clove, minced; 1 small red chile, minced","tm":null,"m":10},{"k":"wed_1530_sprouts","x":"Toast the rice crisps with the cayenne and a pinch of salt in 1 tbsp oil, about 30 seconds. Cool completely; store airtight.","i":"½ cup GF brown rice crisps (ordered); ¼ tsp cayenne; pinch salt; 1 tbsp oil","tm":["Crisps: toasted?",1,"check"],"m":5},{"k":"thu_1200_sprouts","x":"12:00 PM (our method): boil the sprouts in salted water until just tender.","i":"2 lb halved Brussels sprouts; salt, for the water","tm":["Sprouts: just tender? (check 4–6 min)",4,"check"],"m":5},{"k":"thu_1200_sprouts","x":"Drain, spread on towels to dry thoroughly, then refrigerate.","i":"","tm":null,"m":5},{"k":"thu_1540_sprouts","x":"3:40 PM: chop the cilantro and mint; stir into the dressing.","i":"¼ cup cilantro, chopped; 2 tbsp mint, chopped","tm":null,"m":5},{"k":"thu_1540_sprouts","x":"3:40 PM (burner 5, batch 1): very hot skillet, half the remaining oil, half the sprouts cut-side down. Char without stirring.","i":"½ tbsp oil; half sprouts","tm":["Sprouts batch 1: charred?",5,"check"],"m":6},{"k":"thu_1540_sprouts","x":"Batch 2 the same way.","i":"½ tbsp oil; the other half sprouts","tm":["Sprouts batch 2: charred?",5,"check"],"m":6},{"k":"thu_1550_sprouts","x":"3:52 PM: toss with just enough dressing to coat. Crispy rice in its own dish on the side.","i":"just enough dressing (from Wednesday, herbs in); rice crisps, in their own dish","tm":null,"m":3}]},"kitchen":{"n":"Kitchen","e":[{"k":"wed_1730_x","x":"Fridge plan for Thursday; label each dish with its pull time.","i":"","tm":null},{"k":"thu_1530_x","x":"Hot-hold check: stuffing and green beans read 140°F or hotter.","i":"","tm":null},{"k":"thu_1555_x","x":"Spot-check every hot dish: 140°F or hotter. Anything cooler goes back in the still-warm oven for 5 minutes. Then to the table.","i":"","tm":null},{"k":"thu_1600_x","x":"Dinner.","i":"","tm":null},{"k":"thu_1800_x","x":"Two-hour rule: everything back in the fridge. Turkey off the bone into shallow containers.","i":"","tm":null}]},"dip":{"n":"Salmon roe dip","e":[{"k":"thu_0900_dip","x":"9:00 AM: take the cream cheese out to soften.","i":"8 oz cream cheese, room temperature","tm":null,"m":1},{"k":"thu_1030_dip","x":"10:30 AM: beat the cream cheese until smooth.","i":"8 oz cream cheese, room temperature","tm":null,"m":3},{"k":"thu_1030_dip","x":"On medium, mix in sour cream, lemon juice, dill, scallion, cream, salt and pepper.","i":"½ cup sour cream; 2 tsp fresh lemon juice; 2 tbsp fresh dill, minced (save the sprigs); 1 scallion, minced (white and green); 1 tbsp cream; ¼ tsp kosher salt; to taste black pepper","tm":null,"m":5},{"k":"thu_1030_dip","x":"Gently fold in about three-quarters of the roe with a spatula. Scrape into the serving bowl, cover, refrigerate. Keep the rest of the roe cold.","i":"≈¾ salmon roe (keep the rest cold)","tm":null,"m":5},{"k":"thu_1430_dip","x":"2:30 PM: top with the remaining roe and dill sprigs. Serve with chips.","i":"the rest salmon roe; dill sprigs; 1–2 bags salty kettle chips","tm":null,"m":3},{"k":"thu_1630_dip","x":"Two-hour rule: roe dip back in the fridge.","i":"","tm":null}]},"mash":{"n":"Mashed potatoes","e":[{"k":"thu_1315_mash","x":"1:15 PM: cut the potatoes; cover with cold water; refrigerate.","i":"3 lb red potatoes, 1-inch chunks, partly skin-on","tm":null,"m":10},{"k":"thu_1440_mash","x":"2:40 PM: drain, cover with fresh cold water, salt it, and bring to a boil.","i":"salt, for the water","tm":["Potato water boiling?",20,"check"],"m":3},{"k":"thu_1500_mash","x":"3:00 PM: simmer until tender (allow extra time at Reno's elevation).","i":"","tm":["Potatoes: knife-tender?",15,"check"],"m":2},{"k":"thu_1515_mash","x":"Meanwhile brown the butter over medium until nutty and amber. Watch closely; pull it right away.","i":"6 tbsp unsalted butter, browned","tm":["Butter: browned?",4,"check"],"m":5},{"k":"thu_1515_mash","x":"Save 1½ cups of the hot cooking water, then drain. Back in the pot: pour in the brown butter, mash coarsely, add hot water a splash at a time, salt to taste.","i":"1½ cups hot cooking water, saved; 6 tbsp unsalted butter, browned; to taste sea salt","tm":null,"m":10},{"k":"thu_1515_mash","x":"Cover; hold on burner 1 at the lowest heat until 3:55, stirring once or twice. It should stay steaming (140°F or hotter).","i":"","tm":null,"m":1}]},"gravy":{"n":"Gravy","e":[{"k":"thu_1450_gravy","x":"2:45 PM: pour the drippings into the fat separator. Taste them.","i":"1 cup turkey drippings, fat separated","tm":null,"m":5},{"k":"thu_1450_gravy","x":"2:50 PM (burner 4): melt the butter over medium, whisk in the gluten-free flour, and cook 1 minute.","i":"3 tbsp butter; 3 tbsp gluten-free flour","tm":["Gravy: roux 1 minute",1,"check"],"m":3},{"k":"thu_1450_gravy","x":"Gradually whisk in the drippings and broth. Bring to a boil, then simmer, stirring, until it thickens.","i":"1 cup turkey drippings, fat separated; 2 cups low-sodium chicken or turkey broth","tm":["Gravy: thickened?",5,"check"],"m":5},{"k":"thu_1450_gravy","x":"Add thyme and sage; simmer about 10 more minutes. Adjust with broth and season to taste.","i":"1 tsp each fresh thyme and sage, minced; to taste salt and pepper; as needed broth, to loosen","tm":["Gravy: taste and adjust",10,"check"],"m":2},{"k":"thu_1450_gravy","x":"Hold on the lowest heat, stirring now and then. 3:50 PM: into the gravy boat. Served separately.","i":"","tm":null,"m":2},{"k":"thu_1550_gravy","x":"Hold on the lowest heat, stirring now and then. 3:50 PM: into the gravy boat. Served separately.","i":"","tm":null,"m":2}]}}
          act: "{{ action | default('next') }}"
          smap: >-
            {% set ns = namespace(m={}) %}
            {% for kv in states('input_text.tg26_steps').split(',') if ':' in kv %}{% set ns.m = dict(ns.m, **{kv.split(':')[0]: kv.split(':')[1] | int(0)}) %}{% endfor %}
            {{ ns.m }}
          when: >-
            {% set ns = namespace(m={}) %}{% for t in plan %}{% set ns.m = dict(ns.m, **{t.i: as_timestamp(t.at)}) %}{% endfor %}{{ ns.m }}
          target: >-
            {% set q = (dish | default('')) | lower | trim %}
            {% set words = q | regex_findall('[a-z0-9]+') %}
            {% set ns = namespace(id='', gap=10**12, name=false) %}
            {% for g, run in runs.items() %}
              {% set ks = run.e | map(attribute='k') | unique | list %}
              {% set openk = namespace(l=[]) %}{% for k in ks if not is_state('input_boolean.tg26_' ~ k, 'on') %}{% set openk.l = openk.l + [k] %}{% endfor %}
              {% if openk.l | count > 0 %}
                {% set gap = (when[openk.l[0]] - as_timestamp(now())) %}
                {% if q %}
                  {% set nm = run.n | lower | regex_findall('[a-z0-9]+') %}
                  {% set all = (run.n ~ ' ' ~ (run.e | map(attribute='x') | join(' '))) | lower | regex_findall('[a-z0-9]+') %}
                  {% set exact = q == g or q in ks %}
                  {% set byname = words | count > 0 and words | select('in', nm) | list | count == words | count %}
                  {% set byany = words | count > 0 and words | select('in', all) | list | count == words | count %}
                  {% if exact %}{% set ns.id = g %}{% set ns.gap = -1 %}{% set ns.name = true %}
                  {% elif ns.gap >= 0 and byname and (not ns.name or gap | abs < ns.gap) %}{% set ns.id = g %}{% set ns.gap = gap | abs %}{% set ns.name = true %}
                  {% elif ns.gap >= 0 and byany and not ns.name and gap | abs < ns.gap %}{% set ns.id = g %}{% set ns.gap = gap | abs %}{% endif %}
                {% elif gap <= 600 and gap | abs < ns.gap %}{% set ns.id = g %}{% set ns.gap = gap | abs %}{% endif %}
              {% endif %}
            {% endfor %}
            {% set f = states('input_text.tg26_focus') %}
            {% if not q and f in runs %}
              {% set fo = namespace(open=false) %}{% for e in runs[f].e if not is_state('input_boolean.tg26_' ~ e.k, 'on') %}{% set fo.open = true %}{% endfor %}
              {% if fo.open %}{% set ns.id = f %}{% endif %}
            {% endif %}
            {{ ns.id }}
      - if: "{{ target == '' }}"
        then:
          - variables: { result: { ok: false, message: "No recipe is in progress and nothing is due now. Ask holiday_whats_next, or name the dish." } }
          - stop: "No recipe"
            response_variable: result
      - variables:
          ents: "{{ runs[target].e }}"
          n: "{{ ents | count }}"
          start: >-
            {% set ns = namespace(i=-1) %}{% for j in range(ents | count) if ns.i < 0 and not is_state('input_boolean.tg26_' ~ ents[j].k, 'on') %}{% set ns.i = j %}{% endfor %}{{ [ns.i, 0] | max }}
          cur: "{{ [smap.get(target, 0) | int, start | int] | max }}"
          new: >-
            {% if act == 'first' %}{{ start }}{% elif act == 'back' %}{{ [cur - 1, start | int] | max }}{% elif act == 'repeat' %}{{ [cur, n - 1] | min }}{% else %}{{ [cur + (1 if target == states('input_text.tg26_focus') or (dish | default('') | trim) != '' else 0), n - 1] | min }}{% endif %}
          txt: >-
            {% set ns = namespace(out=[]) %}
            {% for k, v in dict(smap, **{target: new | int}).items() if (v | int) > 0 %}{% set ns.out = ns.out + [k ~ ':' ~ v] %}{% endfor %}
            {{ ns.out | join(',') }}
      - action: input_text.set_value
        target: { entity_id: input_text.tg26_steps }
        data: { value: "{{ txt[-250:] if txt | length <= 250 else txt[txt.find(',', txt | length - 250) + 1:] }}" }
      - action: input_text.set_value
        target: { entity_id: input_text.tg26_focus }
        data: { value: "{{ target }}" }
      - variables:
          s: "{{ ents[new | int] }}"
          row: "{{ plan | selectattr('i', 'eq', s.k) | first }}"
          part_end: "{{ (new | int) == (n | int) - 1 or ents[(new | int) + 1].k != s.k }}"
          result:
            ok: true
            task_id: "{{ s.k }}"
            part: "{{ row.d }} {{ row.h }}: {{ row.x }}"
            dish: "{{ runs[target].n }}"
            step: "{{ (new | int) + 1 }}"
            of: "{{ n }}"
            text: "{{ s.x }}"
            ingredients: "{{ s.i }}"
            minutes_of_work: "{{ s.m }}"
            timer: "{{ {'label': s.tm[0], 'minutes': s.tm[1], 'kind': s.tm[2]} if s.tm else none }}"
            last_step: "{{ (new | int) == (n | int) - 1 }}"
            note: "{{ 'Already on the step it is up to.' if act == 'back' and cur == (start | int) else ('That is the last step of this part; when it is done, tick it off with holiday_task_done (task_id ' ~ s.k ~ ').' if part_end else '') }}"
      - stop: "Step"
        response_variable: result
  holiday_place:
    alias: "Holiday cooking: put on / take off"
    description: >-
      Thanksgiving: put a dish on a burner, in the oven or on the smoker, or take it off, so the kitchen screens show what's
      really on the stove. dish: a few words ("cranberry sauce", "pasta", "turkey"). where: optional "burner 2", "oven" or
      "smoker" (default: where the plan puts it). action: on (default) or off. Use for "the cranberry sauce is on",
      "put the gravy on burner 3", "the stuffing's in the oven", "take the potatoes off". Ticking off the part that ends
      it frees the burner by itself. If the burner is taken, say what's on it and ask which burner to use.
    mode: queued
    fields:
      dish: { description: "A few words for the dish", required: true, selector: { text: null } }
      where: { description: "Optional: burner 1-5, oven or smoker", selector: { text: null } }
      action: { description: "on or off", default: "on", selector: { select: { options: ["on", "off"] } } }
    sequence:
      - variables:
          runs: [{"i":0,"st":"b1","r":"cran","n":"Cranberry sauce Cranberry sauce","l":"Cranberry sauce","from":"wed_0900_cran","to":"wed_0900_cran","at":"2026-11-25 09:00"},{"i":1,"st":"b1","r":"eggs","n":"Deviled eggs Eggs","l":"Eggs","from":"wed_0930_eggs","to":"wed_0930_eggs","at":"2026-11-25 09:30"},{"i":2,"st":"b1","r":"mac","n":"Lobster mac Lobster tails","l":"Lobster tails","from":"wed_1030_mac","to":"wed_1030_mac","at":"2026-11-25 10:30"},{"i":3,"st":"b1","r":"stuffing","n":"Stuffing Stuffing wet mix","l":"Stuffing wet mix","from":"wed_1100_stuffing","to":"wed_1100_stuffing","at":"2026-11-25 11:00"},{"i":4,"st":"b1","r":"gbc","n":"Green bean casserole Green bean water","l":"Green bean water","from":"wed_1200_gbc","to":"wed_1200_gbc","at":"2026-11-25 12:00"},{"i":5,"st":"b2","r":"gbc","n":"Green bean casserole Mushroom sauce","l":"Mushroom sauce","from":"wed_1200_gbc","to":"wed_1200_gbc","at":"2026-11-25 12:00"},{"i":6,"st":"b2","r":"sprouts","n":"Brussels sprouts Rice crisps","l":"Rice crisps","from":"wed_1530_sprouts","to":"wed_1530_sprouts","at":"2026-11-25 15:30"},{"i":7,"st":"b2","r":"mac","n":"Lobster mac Panko topping","l":"Panko topping","from":"wed_1545_mac","to":"wed_1545_mac","at":"2026-11-25 15:45"},{"i":8,"st":"b1","r":"eggs","n":"Deviled eggs Prosciutto","l":"Prosciutto","from":"thu_0900_eggs","to":"thu_0900_eggs","at":"2026-11-26 09:00"},{"i":9,"st":"b1","r":"sprouts","n":"Brussels sprouts Sprouts","l":"Sprouts","from":"thu_1200_sprouts","to":"thu_1200_sprouts","at":"2026-11-26 12:00"},{"i":10,"st":"b1","r":"stuffing","n":"Stuffing Stuffing wet mix","l":"Stuffing wet mix","from":"thu_1330_stuffing","to":"thu_1330_stuffing","at":"2026-11-26 13:30"},{"i":11,"st":"b1","r":"mash","n":"Mashed potatoes Potatoes","l":"Potatoes","from":"thu_1440_mash","to":"thu_1600_x","at":"2026-11-26 14:40"},{"i":12,"st":"b2","r":"mac","n":"Lobster mac Pasta","l":"Pasta","from":"thu_1440_mac","to":"thu_1500_mac","at":"2026-11-26 14:40"},{"i":13,"st":"b3","r":"mac","n":"Lobster mac Mac sauce","l":"Mac sauce","from":"thu_1445_mac","to":"thu_1508_mac","at":"2026-11-26 14:45"},{"i":14,"st":"b4","r":"gravy","n":"Gravy Gravy","l":"Gravy","from":"thu_1450_gravy","to":"thu_1550_gravy","at":"2026-11-26 14:50"},{"i":15,"st":"b3","r":"mash","n":"Mashed potatoes Brown butter","l":"Brown butter","from":"thu_1515_mash","to":"thu_1515_mash","at":"2026-11-26 15:15"},{"i":16,"st":"b5","r":"sprouts","n":"Brussels sprouts Sprouts","l":"Sprouts","from":"thu_1540_sprouts","to":"thu_1540_sprouts","at":"2026-11-26 15:40"},{"i":17,"st":"oven","r":"stuffing","n":"Stuffing Bread cubes","l":"Bread cubes","from":"wed_0900_stuffing","to":"wed_0900_stuffing","at":"2026-11-25 09:00"},{"i":18,"st":"oven","r":"cake","n":"Gooey butter cake Gooey butter cake","l":"Gooey butter cake","from":"wed_1300_cake","to":"wed_1300_cake","at":"2026-11-25 13:00"},{"i":19,"st":"oven","r":"stuffing","n":"Stuffing Stuffing","l":"Stuffing","from":"thu_1405_stuffing","to":"thu_1500_stuffing","at":"2026-11-26 14:05"},{"i":20,"st":"oven","r":"gbc","n":"Green bean casserole Green beans","l":"Green beans","from":"thu_1430_gbc","to":"thu_1500_gbc","at":"2026-11-26 14:30"},{"i":21,"st":"oven","r":"mac","n":"Lobster mac Lobster mac","l":"Lobster mac","from":"thu_1512_mac","to":"thu_1535_mac","at":"2026-11-26 15:12"},{"i":22,"st":"oven","r":"gbc","n":"Green bean casserole Green beans","l":"Green beans","from":"thu_1540_gbc","to":"thu_1550_gbc","at":"2026-11-26 15:40"},{"i":23,"st":"smoker","r":"turkey","n":"Turkey Turkey","l":"Turkey","from":"thu_1015_turkey","to":"thu_1445_turkey","at":"2026-11-26 10:15"},{"i":24,"st":"smoker","r":"stuffing","n":"Stuffing Stuffing","l":"Stuffing","from":"thu_1500_stuffing","to":"thu_1600_x","at":"2026-11-26 15:00"},{"i":25,"st":"smoker","r":"gbc","n":"Green bean casserole Green beans","l":"Green beans","from":"thu_1500_gbc","to":"thu_1540_gbc","at":"2026-11-26 15:00"},{"i":26,"st":"smoker","r":"turkey","n":"Turkey Carved turkey","l":"Carved turkey","from":"thu_1520_turkey","to":"thu_1600_x","at":"2026-11-26 15:20"},{"i":27,"st":"smoker","r":"turkey","n":"Turkey Heating up","l":"Heating up","from":"thu_0930_turkey","to":"thu_1015_turkey","at":"2026-11-26 09:30"},{"i":28,"st":"oven","r":"stuffing","n":"Stuffing Heating up","l":"Heating up","from":"thu_1350_stuffing","to":"thu_1405_stuffing","at":"2026-11-26 13:50"},{"i":29,"st":"oven","r":"mac","n":"Lobster mac Heating to 425°F","l":"Heating to 425°F","from":"thu_1500_oven425","to":"thu_1512_mac","at":"2026-11-26 15:00"}]
          act: "{{ action | default('on') }}"
          words: "{{ (dish | default('')) | lower | regex_findall('[a-z0-9]+') }}"
          live: >-
            {% set ns = namespace(out=[]) %}
            {% for kv in states('input_text.tg26_places').split(',') if kv | regex_match('^[0-9]+>(b[1-5]|oven|smoker)@[0-9]+$') %}
              {% set i = kv.split('>')[0] | int %}{% set st = kv.split('>')[1].split('@')[0] %}
              {% if i < runs | count and not is_state('input_boolean.tg26_' ~ runs[i].to, 'on') %}{% set ns.out = ns.out + [{'i': i, 'st': st, 't': kv.split('@')[1] | int}] %}{% endif %}
            {% endfor %}{{ ns.out }}
          want: >-
            {% set w = (where | default('')) | lower %}
            {% set d = w | regex_findall('[1-5]') %}
            {{ 'oven' if 'oven' in w else ('smoker' if 'smoker' in w or 'grill' in w else ('b' ~ d[0] if d else '')) }}
          pick: >-
            {% set ns = namespace(i=-1, gap=10**12) %}
            {% for u in runs if words | count > 0 and words | select('in', u.n | lower | regex_findall('[a-z0-9]+')) | list | count == words | count and not is_state('input_boolean.tg26_' ~ u.to, 'on') %}
              {% set on = live | selectattr('i', 'eq', u.i) | list | count > 0 %}
              {% if (act == 'off') == on %}{% set gap = (as_timestamp(u.at) - as_timestamp(now())) | abs %}{% if gap < ns.gap %}{% set ns.i = u.i %}{% set ns.gap = gap %}{% endif %}{% endif %}
            {% endfor %}{{ ns.i }}
      - if: "{{ pick | int < 0 }}"
        then:
          - variables: { result: { ok: false, message: "{{ 'Nothing like that is on right now.' if act == 'off' else 'No dish like that is waiting to go on. Name the dish, like cranberry sauce or pasta.' }}" } }
          - stop: "No match"
            response_variable: result
      - variables:
          u: "{{ runs[pick | int] }}"
          st: "{{ want if want else u.st }}"
          taken: "{{ (live | selectattr('st', 'eq', st) | rejectattr('i', 'eq', u.i) | list | first) if act == 'on' and st.startswith('b') else none }}"
      - if: "{{ taken is not none and taken != '' }}"
        then:
          - variables: { result: { ok: false, message: "{{ 'Burner ' ~ st[1:] ~ ' has the ' ~ runs[taken.i].l | lower ~ ' on it. Which burner should the ' ~ u.l | lower ~ ' go on?' }}" } }
          - stop: "Taken"
            response_variable: result
      - variables:
          txt: >-
            {% set ns = namespace(out=[]) %}{% for p in live if p.i != u.i %}{% set ns.out = ns.out + [p.i ~ '>' ~ p.st ~ '@' ~ p.t] %}{% endfor %}
            {% if act == 'on' %}{% set ns.out = ns.out + [u.i ~ '>' ~ st ~ '@' ~ (as_timestamp(now()) | int)] %}{% endif %}{{ ns.out | join(',') }}
      - action: input_text.set_value
        target: { entity_id: input_text.tg26_places }
        data: { value: "{{ txt[-250:] if txt | length <= 250 else txt[txt.find(',', txt | length - 250) + 1:] }}" }
      - variables:
          where_words: "{{ 'in the oven' if st == 'oven' else ('on the smoker' if st == 'smoker' else 'on burner ' ~ st[1:]) }}"
          result: { ok: true, dish: "{{ u.l }}", station: "{{ st }}", message: "{{ u.l ~ (' is ' ~ where_words if act == 'on' else ' is off ' ~ where_words[3:] if st != 'oven' else ' is out of the oven') }}." }
      - stop: "Done"
        response_variable: result
  holiday_card:
    alias: "Holiday cooking: open or fold a card"
    description: >-
      Thanksgiving: open a recipe's card on the kitchen screens (its step and ingredients show), or fold it. Use for
      "open the turkey card", "expand stuffing", "show me the gravy", "collapse the stuffing card", "fold that".
      dish: a few words for the dish (optional for close). action: open (default) or close. "Next step" afterwards
      follows the card you opened.
    mode: queued
    fields:
      dish: { description: "A few words for the dish", selector: { text: null } }
      action: { description: "open or close", default: "open", selector: { select: { options: ["open", "close"] } } }
    sequence:
      - variables:
          names: {"turkey":"Turkey","stuffing":"Stuffing","cran":"Cranberry sauce","eggs":"Deviled eggs","mac":"Lobster mac","gbc":"Green bean casserole","cake":"Gooey butter cake","salad":"Salad","sprouts":"Brussels sprouts","dip":"Salmon roe dip","mash":"Mashed potatoes","gravy":"Gravy"}
          act: "{{ action | default('open') }}"
          words: "{{ (dish | default('')) | lower | regex_findall('[a-z0-9]+') }}"
          target: >-
            {% set ns = namespace(id='') %}
            {% for g, n in names.items() if ns.id == '' and words | count > 0 and (words | select('in', (g ~ ' ' ~ n) | lower | regex_findall('[a-z0-9]+')) | list | count == words | count) %}{% set ns.id = g %}{% endfor %}
            {{ ns.id }}
      - if: "{{ act == 'open' and target == '' }}"
        then:
          - variables: { result: { ok: false, message: "Which dish? Say the dish, like turkey or stuffing." } }
          - stop: "No dish"
            response_variable: result
      - action: input_text.set_value
        target: { entity_id: input_text.tg26_focus }
        data: { value: "{{ target if act == 'open' else '-' }}" }
      - variables:
          result: { ok: true, message: "{{ (names[target] ~ ' is open on the screens.') if act == 'open' else 'Folded. Every card is one line now.' }}" }
      - stop: "Done"
        response_variable: result
