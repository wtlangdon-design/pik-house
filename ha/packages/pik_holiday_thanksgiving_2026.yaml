0:15 AM","x":"Turkey on, skin up, drip pan below, probe in the thigh.","s":"turkey"},{"i":"thu_1030_dip","at":"2026-11-26 10:30","d":"Thu","h":"10:30 AM","x":"Make the roe dip (¾ of the roe folded in); cover; fridge.","s":"salmon roe dip"},{"i":"thu_1115_turkey","at":"2026-11-26 11:15","d":"Thu","h":"11:15 AM","x":"Log temperature; check pellets.","s":"turkey"},{"i":"thu_1200_sprouts","at":"2026-11-26 12:00","d":"Thu","h":"12:00 PM","x":"Sprouts: boil until just tender (our method), dry well, fridge.","s":"brussels sprouts"},{"i":"thu_1200_salad","at":"2026-11-26 12:00","d":"Thu","h":"12:00 PM","x":"Wash and dry greens; roll in towels; fridge.","s":"salad"},{"i":"thu_1215_turkey","at":"2026-11-26 12:15","d":"Thu","h":"12:15 PM","x":"Log temperature. If the thigh is about 130°F, raise the smoker to 325–350°F now.","s":"turkey"},{"i":"thu_1245_turkey","at":"2026-11-26 12:45","d":"Thu","h":"12:45 PM","x":"Smoker at 325–350°F (crisp skin). Check every 20–30 min from now.","s":"turkey"},{"i":"thu_1315_mash","at":"2026-11-26 13:15","d":"Thu","h":"1:15 PM","x":"Cut potatoes; cold water; fridge.","s":"mashed potatoes"},{"i":"thu_1330_stuffing","at":"2026-11-26 13:30","d":"Thu","h":"1:30 PM","x":"Warm the stuffing wet mix until the butter melts.","s":"stuffing"},{"i":"thu_1345_eggs","at":"2026-11-26 13:45","d":"Thu","h":"1:45 PM","x":"Pipe deviled eggs; cover; fridge.","s":"deviled eggs"},{"i":"thu_1345_stuffing","at":"2026-11-26 13:45","d":"Thu","h":"1:45 PM","x":"Mix stuffing (bread + wet mix + broth added gradually); taste; into buttered casserole; foil on.","s":"stuffing"},{"i":"thu_1350_stuffing","at":"2026-11-26 13:50","d":"Thu","h":"1:50 PM","x":"Oven to 350°F for the stuffing and green beans.","s":"stuffing"},{"i":"thu_1400_turkey","at":"2026-11-26 14:00","d":"Thu","h":"2:00 PM","x":"Turkey done window opens (2:00–2:45). Done only at 165°F in breast, thigh and wing.","s":"turkey"},{"i":"thu_1405_stuffing","at":"2026-11-26 14:05","d":"Thu","h":"2:05 PM","x":"Stuffing 