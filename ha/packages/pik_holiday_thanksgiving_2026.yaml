      the latest turkey readings, and running kitchen timers. Use for "what's next", "what should I be doing",
      "where are we", "how's the turkey". Each task has an id for holiday_task_done.
    mode: parallel
    sequence:
      - variables:
          plan: [{"i":"tue_1900_turkey","at":"2026-11-24 19:00","d":"Tue","h":"7:00 PM","w":"Cook A","x":"Turkey: confirm weight, fresh vs. thawed, and the label (no added solution). Remove giblets and hardware."},{"i":"tue_1915_turkey","at":"2026-11-24 19:15","d":"Tue","h":"7:15 PM","w":"Cook A","x":"Spatchcock the turkey."},{"i":"tue_1945_turkey","at":"2026-11-24 19:45","d":"Tue","h":"7:45 PM","w":"Cook A","x":"Mix brine (230 g salt + ¾ cup brown sugar per gallon); chill it to 40°F or colder."},{"i":"tue_2030_turkey","at":"2026-11-24 20:30","d":"Tue","h":"8:30 PM","w":"Cook A","x":"Turkey into the brine (fridge, or cooler with ice at 40°F or colder)."},{"i":"tue_2030_stuffing","at":"2026-11-24 20:30","d":"Tue","h":"8:30 PM","w":"Cook B","x":"Cube both loaves; spread on sheet pans to dry overnight."},{"i":"tue_2100_x","at":"2026-11-24 21:00","d":"Tue","h":"9:00 PM","w":"Both","x":"Clear one full fridge shelf for Wednesday's turkey drying tray."},{"i":"wed_0630_turkey","at":"2026-11-25 06:30","d":"Wed","h":"6:30 AM","w":"Cook A","x":"Turkey out of brine, patted very dry, uncovered on a rack in the fridge until Thursday."},{"i":"wed_0800_stuffing","at":"2026-11-25 08:00","d":"Wed","h":"8:00 AM","w":"Cook A","x":"Oven to 250°F; finish drying bread cubes if still soft. Cool; bag."},{"i":"wed_0900_cran","at":"2026-11-25 09:00","d":"Wed","h":"9:00 AM","w":"Cook B","x":"Cranberry sauce; cool; fridge."},{"i":"wed_0930_eggs","at":"2026-11-25 09:30","d":"Wed","h":"9:30 AM","w":"Cook B","x":"Hard-boil eggs (check one at 14 min), ice, peel; filling; fridge separately."},{"i":"wed_1030_mac","at":"2026-11-25 10:30","d":"Wed","h":"10:30 AM","w":"Cook A","x":"Lobster tails, ice, chop, fridge. Shred and grate cheeses."},{"i":"wed_1100_stuffing","at":"2026-11-25 11:00","d":"Wed","h":"11:00 AM","w":"Cook A","x":"Stuffing wet mix (butter, onion, celery, hearts, liver cooked through); cool in a shallow container; fridge."},{"i":"wed_1200_gbc","at":"2026-11-25 12:00","d":"Wed","h":"12:0