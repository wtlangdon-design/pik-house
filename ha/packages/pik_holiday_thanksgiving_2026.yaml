":"2026-11-26 14:45","d":"Thu","h":"2:45 PM","x":"Turkey off once it's 165°F everywhere: tent, rest. Smoker to its lowest setting for the hot hold (aim 200–225°F); open the lid a few minutes so it drops faster."},{"i":"thu_1445_mac","at":"2026-11-26 14:45","d":"Thu","h":"2:45 PM","x":"Burner 3: mac sauce."},{"i":"thu_1450_gravy","at":"2026-11-26 14:50","d":"Thu","h":"2:50 PM","x":"Burner 4: gravy from drippings + broth (taste drippings first); hold on lowest."},{"i":"thu_1500_x","at":"2026-11-26 15:00","d":"Thu","h":"3:00 PM","x":"Stuffing (165°F) and green beans out, covered, into the 200°F smoker hold. Oven up to 425°F."},{"i":"thu_1500_mash","at":"2026-11-26 15:00","d":"Thu","h":"3:00 PM","x":"Burner 1: potatoes in."},{"i":"thu_1500_mac","at":"2026-11-26 15:00","d":"Thu","h":"3:00 PM","x":"Burner 2: elbows in, 2 min short of al dente."},{"i":"thu_1500_x_1","at":"2026-11-26 15:00","d":"Thu","h":"3:00 PM","x":"Cranberry sauce and vinaigrette out of the fridge."},{"i":"thu_1508_mac","at":"2026-11-26 15:08","d":"Thu","h":"3:08 PM","x":"Assemble the mac and cheese."},{"i":"thu_1512_mac","at":"2026-11-26 15:12","d":"Thu","h":"3:12 PM","x":"Mac in at 425°F."},{"i":"thu_1515_mash","at":"2026-11-26 15:15","d":"Thu","h":"3:15 PM","x":"Burner 3: brown butter. Drain potatoes (save water); mash; hold covered on burner 1, lowest."},{"i":"thu_1520_turkey","at":"2026-11-26 15:20","d":"Thu","h":"3:20 PM","x":"Carve; platter; foil; into the 200°F smoker hold."},{"i":"thu_1530_x","at":"2026-11-26 15:30","d":"Thu","h":"3:30 PM","x":"Hot-hold check: stuffing and green beans read 140°F or hotter."},{"i":"thu_1535_mac","at":"2026-11-26 15:35","d":"Thu","h":"3:35 PM","x":"Mac out; panko + chives on; tent loosely with foil. Oven off, door cracked so it falls toward 350°F."},{"i":"thu_1540_gbc","at":"2026-11-26 15:40","d":"Thu","h":"3:40 PM","x":"Green beans back in uncovered. The oven is still hotter than 350°F, so look at 5 minutes."},{"i":"thu_1540_sprouts","at":"2026-11-26 15:40","d":"Thu","h":"3:40 PM","x":"Burner 5: char sprouts, batch 1 then 2 (herbs into the dressing first)."},{"i":"thu_1545_salad","at":"2026-11-26 15:45","d":"Thu","h":"3:45 PM","x":"Slice endive; plain lettuce for Mom first."},{"i":"thu_1550_x","at":"2026-11-26 15:50","d":"Thu","h":"3:50 PM","x":"Finish: toss salad; dress sprouts lightly (rice on the side); onions on green beans; gravy to the boat; zest on cranberry."},{"i":"thu_1555_x","at":"2026-11-26 15:55","d":"Thu","h":"3:55 PM","x":"Spot-check every hot dish: 140°F or hotter. Anything cooler goes back in the still-warm oven for 5 minutes. Then to the table."},{"i":"thu_1600_x","at":"2026-11-26 16:00","d":"Thu","h":"4:00 PM","x":"Dinner."},{"i":"thu_1630_x","at":"2026-11-26 16:30","d":"Thu","h":"4:30 PM","x":"Two-hour rule: deviled eggs and roe dip back in the fridge."},{"i":"thu_1645_cake","at":"2026-11-26 16:45","d":"Thu","h":"4:45 PM","x":"Cake out of the fridge (dessert about 5:15, proposed)."},{"i":"thu_1800_x","at":"2026-11-26 18:00","d":"Thu","h":"6:00 PM","x":"Two-hour rule: everything back in the fridge. Turkey off the bone into shallow containers."}]
          steps: {"tue_1900_turkey":[{"r":"Turkey","x":"7:00 PM: unwrap, check the label, weigh it. Pull out the neck and giblets and any pop-up timer or leg clip. Keep the neck in the fridge (optional gravy flavor).","tm":null}],"tue_1915_turkey":[{"r":"Turkey","x":"Spatchcock: breast down, cut along both sides of the backbone with shears and remove it. Flip, press firmly on the breastbone to flatten.","tm":null}],"tue_1945_turkey":[{"r":"Turkey","x":"Mix brine: for each gallon, dissolve 230 g salt and ¾ cup brown sugar in 1 quart hot water, then add 3 quarts cold water and ice. It must be 40°F or colder before the turkey goes in.","tm":null}],"tue_2030_turkey":[{"r":"Turkey","x":"8:30 PM: turkey into the brining bag, brine over it until covered, seal, into the fridge or a cooler packed with ice (check it stays at or below 40°F).","tm":["Turkey: out of the brine",600,"done"]}],"tue_2030_stuffing":[{"r":"Stuffing","x":"8:30 PM: cut both loaves into ¾-inch cubes, spread on sheet pans, and leave out overnight to dry.","tm":null}],"wed_0630_turkey":[{"r":"Turkey","x":"6:30 AM: lift the turkey out and discard the brine. Pat completely dry, including under the wings. Set skin-up on the rack over the sheet and refrigerate uncovered until Thursday morning.","tm":null}],"wed_0800_stuffing":[{"r":"Stuffing","x":"8:00 AM: if the cubes are still soft, dry them in a 250°F oven, stirring once, until crisp-dry. Cool; store in bags.","tm":["Bread: dry yet?",30,"check"]}],"wed_0900_cran":[{"r":"Cranberry sauce","x":"9:00 AM: combine cranberries, orange juice, maple syrup and vanilla in the pot (save the zest). Bring to a boil over medium-high.","tm":["Cranberries boiling?",5,"check"]},{"r":"Cranberry sauce","x":"Cover, lower the heat and simmer until berries pop and it coats a spoon.","tm":["Cranberries: popped and thick?",10,"check"]},{"r":"Cranberry sauce","x":"Uncover and simmer a few more minutes to thicken.","tm":["Thick enough?",4,"check"]},{"r":"Cranberry sauce","x":"Cool, then into an airtight container in the fridge.","tm":null}],"wed_0930_eggs":[{"r":"Deviled eggs","x":"Put eggs in the saucepan, cover with cold water by an inch, and bring to a boil over high heat.","tm":["Eggs: water boiling?",10,"check"]},{"r":"Deviled eggs","x":"As soon as it boils, cover, turn off the heat and let the eggs sit. At Reno's elevation this takes a little longer: check one egg.","tm":["Eggs: check one egg",14,"check"]},{"r":"Deviled eggs","x":"Move eggs to ice water until cold.","tm":["Eggs: cooled",10,"done"]},{"r":"Deviled eggs","x":"Peel, halve lengthwise, and pop the yolks into a bowl. Cover the whites and refrigerate.","tm":null},{"r":"Deviled eggs","x":"Mash yolks with the mayo, Dijon and a splash of cider vinegar until smooth. Taste. Spoon into the piping bag, seal, refrigerate.","tm":null}],"wed_1030_mac":[{"r":"Lobster mac","x":"10:30 AM: boil the lobster tails in salted water just until the shells turn red (slightly under). Ice, then pull the meat, chop, refrigerate.","tm":["Lobster: shells red?",5,"check"]},{"r":"Lobster mac","x":"Shred the cheddar and gruyère; grate the pecorino. Refrigerate.","tm":null}],"wed_1100_stuffing":[{"r":"Stuffing","x":"11:00 AM: melt the butter; cook onion and celery until soft.","tm":["Onion & celery soft?",8,"check"]},{"r":"Stuffing","x":"Add the minced hearts and liver and cook through completely (no pink). Season with dried parsley, sage and salt. Cool in a shallow container; refrigerate.","tm":null}],"wed_1200_gbc":[{"r":"Green bean casserole","x":"12:00 PM: big pot of salted water to a boil (it takes longer at Reno's elevation).","tm":["Bean water boiling?",15,"check"]},{"r":"Green bean casserole","x":"Blanch the beans 5 minutes, then into ice water. Drain well.","tm":["Beans: bright and just tender?",5,"check"]},{"r":"Green bean casserole","x":"Sauté the mushrooms in the butter and oil until their liquid is gone and they brown.","tm":["Mushrooms browned?",8,"check"]},{"r":"Green bean casserole","x":"Add garlic for 30 seconds, then the gluten-free flour for 1–2 minutes, stirring.","tm":null},{"r":"Green bean casserole","x":"Whisk in the broth, cream, soy sauce and lemon juice; simmer 5 minutes. Season.","tm":["Sauce: simmered 5 min",5,"check"]},{"r":"Green bean casserole","x":"Fold in the beans and 1 cup crispy onions. Into the 13×9. Cool about 30 minutes, then cover and refrigerate.","tm":null}],"wed_1300_cake":[{"r":"Gooey butter cake","x":"1:00 PM: heat the oven to 350°F. Grease the 13×9.","tm":["Oven at 350°F?",15,"check"]},{"r":"Gooey butter cake","x":"Mix the 18¼ oz cake mix, 1 egg and 8 tbsp melted butter; pat evenly into the pan.","tm":null},{"r":"Gooey butter cake","x":"Beat cream cheese and pumpkin smooth. Beat in 3 eggs, vanilla and melted butter. Mix in powdered sugar, cinnamon and nutmeg.","tm":null},{"r":"Gooey butter cake","x":"1:20 PM: spread the filling over the crust and bake.","tm":["Cake: first doneness check",40,"check"]},{"r":"Gooey butter cake","x":"Pull when the edges are set and the center still jiggles slightly. Cool on a rack, then cover and refrigerate.","tm":null}],"wed_1430_turkey":[{"r":"Turkey","x":"2:30 PM: make the rub. Mash the butter with parsley, thyme, chives, sage, onion, garlic and 2 tbsp rub. Cover and refrigerate.","tm":null}],"wed_1530_salad":[{"r":"Salad","x":"3:30 PM: rinse the chopped shallot in a strainer; drain.","tm":null},{"r":"Salad","x":"Combine shallot, garlic, sugar, salt, thyme, sherry vinegar and warm water. Slowly whisk in the oil. Refrigerate.","tm":null}],"wed_1530_sprouts":[{"r":"Brussels sprouts","x":"3:30 PM: mix fish sauce, water, sugar, rice vinegar, lime juice, garlic and chile until the sugar dissolves. Refrigerate (no herbs yet).","tm":null},{"r":"Brussels sprouts","x":"Toast the rice crisps with the cayenne and a pinch of salt in 1 tbsp oil, about 30 seconds. Cool completely; store airtight.","tm":["Crisps: toasted?",1,"check"]}],"wed_1545_mac":[{"r":"Lobster mac","x":"3:45 PM: topping. Sauté shallot, garlic and thyme in butter and oil, add the GF panko and toast until golden. Cool; store airtight.","tm":["Panko: golden?",3,"check"]}],"thu_0830_dip":[{"r":"Salmon roe dip","x":"8:30 AM: take the cream cheese out to soften.","tm":null},{"r":"Turkey","x":"8:30 AM: take the herb butter out to soften.","tm":null}],"thu_0900_eggs":[{"r":"Deviled eggs","x":"9:00 AM: crisp the prosciutto in a dry skillet over medium, turning once, until it darkens and stops sizzling. Drain on paper towels; it crisps as it cools. Crumble.","tm":["Prosciutto: flip / check",3,"check"]}],"thu_0915_dip":[{"r":"Salmon roe dip","x":"9:15 AM: beat the cream cheese until smooth.","tm":null},{"r":"Salmon roe dip","x":"On medium, mix in sour cream, lemon juice, dill, scallion, cream, salt and pepper.","tm":null},{"r":"Salmon roe dip","x":"Gently fold in about three-quarters of the roe with a spatula. Scrape into the serving bowl, cover, refrigerate. Keep the rest of the roe cold.","tm":null}],"thu_0930_turkey":[{"r":"Turkey","x":"9:30 AM: fill the pellet hopper and start the smoker at 250°F. Load the turkey only once the smoker reads 250°F.","tm":["Smoker at 250°F?",20,"check"]}],"thu_0940_turkey":[{"r":"Turkey","x":"9:40 AM: loosen the skin over breast, thighs and legs with your fingers. Push all the herb butter under the skin and spread it flat. Dust the outside lightly with the remaining rub.","tm":null}],"thu_1015_turkey":[{"r":"Turkey","x":"10:15 AM: turkey on the grate skin-side up, drip pan underneath. Probe in the innermost thigh, not touching bone.","tm":["Turkey: first temperature check",60,"temp"]},{"r":"Turkey","x":"Check and log the probe every hour; add pellets as needed.","tm":["Turkey: temperature check",60,"temp"]}],"thu_1115_turkey":[{"r":"Turkey","x":"Check and log the probe every hour; add pellets as needed.","tm":["Turkey: temperature check",60,"temp"]}],"thu_1200_sprouts":[{"r":"Brussels sprouts","x":"12:00 PM (our method): boil the sprouts in salted water until just tender.","tm":["Sprouts: just tender? (check 4–6 min)",4,"check"]},{"r":"Brussels sprouts","x":"Drain, spread on towels to dry thoroughly, then refrigerate.","tm":null}],"thu_1200_salad":[{"r":"Salad","x":"12:00 PM: wash the lettuces; spin or towel completely dry; roll in towels; refrigerate.","tm":null}],"thu_1215_turkey":[{"r":"Turkey","x":"About 12:30 PM (or once the thigh reads ~130°F): raise the smoker to 325–350°F to crisp the skin. From here, check every 20–30 minutes.","tm":["Turkey: temperature check",25,"temp"]}],"thu_1245_turkey":[{"r":"Turkey","x":"About 12:30 PM (or once the thigh reads ~130°F): raise the smoker to 325–350°F to crisp the skin. From here, check every 20–30 minutes.","tm":["Turkey: temperature check",25,"temp"]}],"thu_1315_mash":[{"r":"Mashed potatoes","x":"1:15 PM: cut the potatoes; cover with cold water; refrigerate.","tm":null}],"thu_1330_stuffing":[{"r":"Stuffing","x":"1:30 PM: warm the wet mix gently until the butter melts.","tm":null}],"thu_1345_eggs":[{"r":"Deviled eggs","x":"1:45 PM: pipe the filling into the whites. Cover and refrigerate.","tm":null}],"thu_1345_stuffing":[{"r":"Stuffing","x":"1:45 PM: in the big bowl, toss bread with the wet mix. Add broth a cup at a time until evenly moist. Taste for salt. Pack into the buttered casserole; cover with foil.","tm":null}],"thu_1400_turkey":[{"r":"Turkey","x":"Done only when breast, thigh and wing all read 165°F (log all three on the Turkey tab). Expected window: 2:00–2:45 PM. It's an estimate, not a timer.","tm":null}],"thu_1405_stuffing":[{"r":"Stuffing","x":"2:05 PM: bake at 350°F, covered.","tm":["Stuffing: uncover",35,"done"]}],"thu_1430_gbc":[{"r":"Green bean casserole","x":"2:30 PM: into the 350°F oven, covered with foil.","tm":["Green beans: covered stage (check heat)",30,"check"]}],"thu_1430_eggs":[{"r":"Deviled eggs","x":"2:30 PM: top with prosciutto and chives right before they go out. Back in the fridge by 4:30.","tm":null},{"r":"Salmon roe dip","x":"2:30 PM: top with the remaining roe and dill sprigs. Serve with chips.","tm":null}],"thu_1440_stuffing":[{"r":"Stuffing","x":"2:40 PM: uncover and bake until the center reads 165°F and the top crisps.","tm":["Stuffing: check center 165°F",20,"check"]}],"thu_1440_mash":[{"r":"Mashed potatoes","x":"2:40 PM: drain, cover with fresh cold water, salt it, and bring to a boil.","tm":["Potato water boiling?",20,"check"]},{"r":"Lobster mac","x":"2:40 PM: pasta water on (salted).","tm":["Pasta water boiling?",15,"check"]}],"thu_1445_turkey":[{"r":"Turkey","x":"Off the smoker onto the rack, tent loosely with foil, rest 30–45 minutes. Drippings to the gravy cook. Set the smoker to its lowest setting (200–225°F): it becomes the hot hold for the stuffing and green beans.","tm":["Turkey: rest check",30,"check"]}],"thu_1445_mac":[{"r":"Lobster mac","x":"2:45 PM: sauce. Sauté shallot, garlic and thyme in butter and oil 2–3 min; stir in gochujang and gochugaru; add the cooking sherry and reduce by about a third.","tm":null},{"r":"Lobster mac","x":"Add the cream and simmer until reduced by about a third.","tm":["Sauce: reduced by a third?",10,"check"]},{"r":"Lobster mac","x":"Off the heat: stir in cheddar and gruyère in three additions, then mascarpone. Add Worcestershire and hot sauce. Taste, then salt only if needed.","tm":null}],"thu_1450_gravy":[{"r":"Gravy","x":"2:45 PM: pour the drippings into the fat separator. Taste them.","tm":null},{"r":"Gravy","x":"2:50 PM (burner 4): melt the butter over medium, whisk in the gluten-free flour, and cook 1 minute.","tm":["Gravy: roux 1 minute",1,"check"]},{"r":"Gravy","x":"Gradually whisk in the drippings and broth. Bring to a boil, then simmer, stirring, until it thickens.","tm":["Gravy: thickened?",5,"check"]},{"r":"Gravy","x":"Add thyme and sage; simmer about 10 more minutes. Adjust with broth and season to taste.","tm":["Gravy: taste and adjust",10,"check"]},{"r":"Gravy","x":"Hold on the lowest heat, stirring now and then. 3:50 PM: into the gravy boat. Served separately.","tm":null}],"thu_1500_x":[{"r":"Stuffing","x":"3:00 PM: out, covered, into the smoker hot hold (200–225°F). Check it reads 140°F or hotter at 3:30 and 3:50.","tm":null},{"r":"Green bean casserole","x":"3:00 PM: out, still covered, into the smoker hot hold (200–225°F).","tm":null}],"thu_1500_mash":[{"r":"Mashed potatoes","x":"3:00 PM: simmer until tender (allow extra time at Reno's elevation).","tm":["Potatoes: knife-tender?",15,"check"]}],"thu_1500_mac":[{"r":"Lobster mac","x":"3:00 PM: cook the elbows about 2 minutes short of the box's al dente time. Drain.","tm":["Pasta: 2 min short of al dente",7,"check"]}],"thu_1500_x_1":[{"r":"Cranberry sauce","x":"3:00 PM: out of the fridge. 3:50 PM: into the bowl; zest on top.","tm":null},{"r":"Salad","x":"3:00 PM: vinaigrette out of the fridge; whisk again before using.","tm":null}],"thu_1508_mac":[{"r":"Lobster mac","x":"3:08 PM: layer in the dish: half the pasta, half the sauce, all the lobster, the rest of the pasta and sauce, then the topping cheeses.","tm":null}],"thu_1512_mac":[{"r":"Lobster mac","x":"3:12 PM: bake at 425°F.","tm":["Mac: bubbling and golden?",20,"check"]}],"thu_1515_mash":[{"r":"Mashed potatoes","x":"Meanwhile brown the butter over medium until nutty and amber. Watch closely; pull it right away.","tm":["Butter: browned?",4,"check"]},{"r":"Mashed potatoes","x":"Save 1½ cups of the hot cooking water, then drain. Back in the pot: pour in the brown butter, mash coarsely, add hot water a splash at a time, salt to taste.","tm":null},{"r":"Mashed potatoes","x":"Cover; hold on burner 1 at the lowest heat until 3:55, stirring once or twice. It should stay steaming (140°F or hotter).","tm":null}],"thu_1520_turkey":[{"r":"Turkey","x":"3:20 PM: carve. Legs off, split drums and thighs, wings off, lift each breast half off in one piece and slice across. Platter, foil, into the 200°F smoker hold until 3:55.","tm":null}],"thu_1535_mac":[{"r":"Lobster mac","x":"3:35 PM: out. Fold parsley into the panko; scatter on with chives. Tent loosely with foil and rest until 3:55 (it sets the sauce); check it's 140°F or hotter before serving.","tm":null}],"thu_1540_gbc":[{"r":"Green bean casserole","x":"3:40 PM: back in the oven, uncovered, until bubbling. The oven is cooling from 425°F and still hotter than 350°F, so look at 5 minutes.","tm":["Green beans: bubbling?",5,"check"]}],"thu_1540_sprouts":[{"r":"Brussels sprouts","x":"3:40 PM: chop the cilantro and mint; stir into the dressing.","tm":null},{"r":"Brussels sprouts","x":"3:40 PM (burner 5, batch 1): very hot skillet, half the remaining oil, half the sprouts cut-side down. Char without stirring.","tm":["Sprouts batch 1: charred?",5,"check"]},{"r":"Brussels sprouts","x":"Batch 2 the same way.","tm":["Sprouts batch 2: charred?",5,"check"]}],"thu_1545_salad":[{"r":"Salad","x":"3:45 PM: slice the endive. Set aside plain lettuce for Mom first.","tm":null}],"thu_1550_x":[{"r":"Salad","x":"3:52 PM: toss the rest with dressing a little at a time; plate.","tm":null},{"r":"Brussels sprouts","x":"3:52 PM: toss with just enough dressing to coat. Crispy rice in its own dish on the side.","tm":null},{"r":"Green bean casserole","x":"3:50 PM: top with the remaining 1 cup crispy onions right before serving.","tm":null},{"r":"Gravy","x":"Hold on the lowest heat, stirring now and then. 3:50 PM: into the gravy boat. Served separately.","tm":null}],"thu_1645_cake":[{"r":"Gooey butter cake","x":"≈4:45 PM: out of the fridge 30 minutes before dessert (if you like it less cold). Cut into squares.","tm":null}]}
          act: "{{ action | default('next') }}"
          smap: >-
            {% set ns = namespace(m={}) %}
            {% for kv in states('input_text.tg26_steps').split(',') if ':' in kv %}{% set ns.m = dict(ns.m, **{kv.split(':')[0]: kv.split(':')[1] | int(0)}) %}{% endfor %}
            {{ ns.m }}
          target: >-
            {% set q = (task | default('')) | lower | trim %}
            {% set words = q | regex_findall('[a-z0-9]+') %}
            {% set ns = namespace(id='', gap=10**9) %}
            {% if q %}
              {% for t in plan if t.i in steps %}
                {% if t.i == q %}{% set ns.id = t.i %}{% set ns.gap = -1 %}{% endif %}
                {% set x = (t.x ~ ' ' ~ (steps[t.i] | map(attribute='r') | join(' '))) | lower | regex_findall('[a-z0-9]+') %}
                {% if ns.gap >= 0 and words | count > 0 and words | select('in', x) | list | count == words | count and not is_state('input_boolean.tg26_' ~ t.i, 'on') %}
                  {% set gap = (as_timestamp(t.at) - as_timestamp(now())) | abs %}{% if gap < ns.gap %}{% set ns.id = t.i %}{% set ns.gap = gap %}{% endif %}
                {% endif %}
              {% endfor %}
            {% else %}
              {% set f = states('input_text.tg26_focus') %}
              {% if f in steps and not is_state('input_boolean.tg26_' ~ f, 'on') %}{% set ns.id = f %}{% else %}
                {% for t in plan if t.i in steps and not is_state('input_boolean.tg26_' ~ t.i, 'on') and as_timestamp(t.at) <= as_timestamp(now()) + 600 %}
                  {% set gap = (as_timestamp(t.at) - as_timestamp(now())) | abs %}{% if gap < ns.gap %}{% set ns.id = t.i %}{% set ns.gap = gap %}{% endif %}
                {% endfor %}
              {% endif %}
            {% endif %}
            {{ ns.id }}
      - if: "{{ target == '' }}"
        then:
          - variables: { result: { ok: false, message: "No recipe is in progress and nothing with steps is due now. Ask holiday_whats_next, or name the dish." } }
          - stop: "No recipe"
            response_variable: result
      - variables:
          n: "{{ steps[target] | count }}"
          cur: "{{ smap.get(target, 0) | int }}"
          new: >-
            {% if act == 'first' %}0{% elif act == 'back' %}{{ [cur - 1, 0] | max }}{% elif act == 'repeat' %}{{ [cur, n - 1] | min }}{% else %}{{ [cur + (1 if target == states('input_text.tg26_focus') or cur > 0 else 0), n - 1] | min }}{% endif %}
          txt: >-
            {% set ns = namespace(out=[]) %}
            {% for k, v in dict(smap, **{target: new | int}).items() if (v | int) > 0 and not is_state('input_boolean.tg26_' ~ k, 'on') %}{% set ns.out = ns.out + [k ~ ':' ~ v] %}{% endfor %}
            {{ ns.out | join(',') }}
      - action: input_text.set_value
        target: { entity_id: input_text.tg26_steps }
        data: { value: "{{ txt[-250:] if txt | length <= 250 else txt[txt.find(',', txt | length - 250) + 1:] }}" }
      - action: input_text.set_value
        target: { entity_id: input_text.tg26_focus }
        data: { value: "{{ target }}" }
      - variables:
          s: "{{ steps[target][new | int] }}"
          row: "{{ plan | selectattr('i', 'eq', target) | first }}"
          result:
            ok: true
            task_id: "{{ target }}"
            task: "{{ row.d }} {{ row.h }}: {{ row.x }}"
            dish: "{{ s.r }}"
            step: "{{ (new | int) + 1 }}"
            of: "{{ n }}"
            text: "{{ s.x }}"
            timer: "{{ {'label': s.tm[0], 'minutes': s.tm[1], 'kind': s.tm[2]} if s.tm else none }}"
            last_step: "{{ (new | int) == (n | int) - 1 }}"
            note: "{{ 'Already on the first step.' if act == 'back' and cur == 0 else ('That was the last step; when it is done, tick the task off with holiday_task_done.' if (new | int) == (n | int) - 1 and act == 'next' and cur == new else '') }}"
      - stop: "Step"
        response_variable: result
