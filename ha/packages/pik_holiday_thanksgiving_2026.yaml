0","d":"Thu","h":"3:30 PM","w":"Cook A","x":"Hot-hold check: stuffing and GBC read 140°F or hotter."},{"i":"thu_1535_mac","at":"2026-11-26 15:35","d":"Thu","h":"3:35 PM","w":"Cook A","x":"Mac out; panko + chives on; tent loosely with foil. Oven off, door cracked so it falls toward 350°F."},{"i":"thu_1540_gbc","at":"2026-11-26 15:40","d":"Thu","h":"3:40 PM","w":"Cook A","x":"GBC back in uncovered. The oven is still hotter than 350°F, so look at 5 minutes."},{"i":"thu_1540_sprouts","at":"2026-11-26 15:40","d":"Thu","h":"3:40 PM","w":"Cook B","x":"Burner 5: char sprouts, batch 1 then 2 (herbs into the dressing first)."},{"i":"thu_1545_salad","at":"2026-11-26 15:45","d":"Thu","h":"3:45 PM","w":"Cook A","x":"Slice endive; plain lettuce for Mom first."},{"i":"thu_1550_x","at":"2026-11-26 15:50","d":"Thu","h":"3:50 PM","w":"Both","x":"Finish: toss salad; dress sprouts lightly (rice on the side); onions on GBC; gravy to the boat; zest on cranberry."},{"i":"thu_1555_x","at":"2026-11-26 15:55","d":"Thu","h":"3:55 PM","w":"Both","x":"Spot-check every hot dish: 140°F or hotter. Anything cooler goes back in the still-warm oven for 5 minutes. Then to the table."},{"i":"thu_1600_x","at":"2026-11-26 16:00","d":"Thu","h":"4:00 PM","w":"Both","x":"Dinner."},{"i":"thu_1645_cake","at":"2026-11-26 16:45","d":"Thu","h":"4:45 PM","w":"Both","x":"Cake out of the fridge (dessert about 5:15, proposed)."},{"i":"thu_1800_x","at":"2026-11-26 18:00","d":"Thu","h":"6:00 PM","w":"Both","x":"Two-hour rule: everything back in the fridge. Turkey off the bone into shallow containers."}]
          result: >-
            {% set n = now() %}
            {% set soon = (n + timedelta(minutes=15)).strftime('%Y-%m-%d %H:%M') %}
            {% set back = (n - timedelta(minutes=30)).strftime('%Y-%m-%d %H:%M') %}
            {% set ns = namespace(due=[], nxt=[], late=[]) %}
            {% for t in plan if not is_state('input_boolean.tg26_' ~ t.i, 'on') %}
              {% set row = {'id': t.i, 'when': t.d ~ ' ' ~ t.h, 'who': t.w, 'task': t.x} %}
              {% if back <= t.at <= soon %}{% set ns.due = ns.due + [row] %}
              {% elif t.at > soon and ns.nxt | count < 5 %}{% set ns.nxt = ns.nxt + [row] %}
              {% elif t.at < back %}{% set ns.late = ns.late + [row] %}{% endif %}
            {% endfor %}
            {% set tk = namespace(r={}) %}
            {% for s in ['breast', 'thigh', 'wing'] %}{% set v = states('input_number.tg26_turkey_' ~ s) | float(0) %}{% set tk.r = dict(tk.r, **{s: (v | int if v > 30 else 'no reading')}) %}{% endfor %}
            {{ {'now': n.strftime('%a %-I:%M %p'), 'dinner': "Thursday, November 26 · dinner for 7 at 4:00 PM", 'due_now': ns.due, 'next': ns.nxt,
                'earlier_not_ticked': ns.late[-5:], 'earlier_not_ticked_count': ns.late | count,
                'turkey_f': tk.r, 'turkey_done': states('input_number.tg26_turkey_breast') | float(0) >= 165 and states('input_number.tg26_turkey_thigh') | float(0) >= 165 and states('input_number.tg26_turkey_wing') | float(0) >= 165,
                'turkey_rule': 'Done only at 165F in the thickest breast, innermost thigh and innermost wing. Never by a timer.'} }}
      - stop: "Plan"
        response_variable: result

  holiday_task_done:
    alias: "Holiday cooking: tick a task off"
    description: >-
      Ticks a task in the Thanksgiving plan off (or back on with done=false). "task" is its id from holiday_whats_next,
      or a few words from it ("stuffing in", "potato water"); words pick the unticked task nearest to now.
      Use for "the stuffing's in", "done with the brine", "tick off the gravy".
    mode: queued
    fields:
