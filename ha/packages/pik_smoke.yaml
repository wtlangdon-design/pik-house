# Pik smoking: the Inkbird IBT-4XS read by the hub, so nobody has to walk out to the smoker.
# GENERATED by ha/gen-smoke.mjs. Don't edit by hand; change the script and regenerate.
#
# Finds the Inkbird by itself: the built-in Inkbird integration names the probes
# sensor.<device>_temperature_probe_1 … _4. (If it ever can't, put the four entity IDs, comma-separated,
# in input_text.smoke_probes.) Needs pik_kitchen.yaml for script.pik_announce.
#
#   sensor.smoke_probe_1 … _4       each probe in °F, read once a minute; unavailable when unplugged,
#                                   off or out of range. Attributes: food, kind, target, rate (°F/hour),
#                                   eta_min, flat (holding steady), source, hist (last 20 minutes)
#   input_text.smoke_probe_N_food   what the probe is in ("Brisket"; "Smoker" for an air probe); empty = not in use
#   input_select.smoke_probe_N_kind food | smoker
#   input_number.smoke_probe_N_target  pull temperature (food) or set temperature (smoker); 0 = just watch
#   input_boolean.smoke_on          a cook is going (turns on by itself when the Inkbird starts reading)
#   input_boolean.smoke_quiet       on = don't say anything on the Echos
#   automation smoke_watch          every minute: almost there, done (repeats twice until "got it"), the stall,
#                                   smoker dropping fast or off its set temperature, a probe or the Inkbird lost
#   scripts for Pik: smoke_probe, smoke_status, smoke_got_it, smoke_end

input_boolean:
  smoke_on: { name: "Smoking: a cook is going", icon: "mdi:grill" }
  smoke_quiet: { name: "Smoking: don't announce on the Echos", icon: "mdi:bullhorn-outline" }

input_datetime:
  smoke_started: { name: "Smoking: cook started", has_date: true, has_time: true }

input_text:
  smoke_probes: { name: "Smoking: probe sensors (leave empty to find the Inkbird by itself)", max: 255 }
  smoke_probe_1_food: { name: "Smoking: probe 1 is in", max: 40, icon: "mdi:food-steak" }
  smoke_probe_1_flags: { name: "Smoking: probe 1 alerts said", max: 100 }
  smoke_probe_2_food: { name: "Smoking: probe 2 is in", max: 40, icon: "mdi:food-steak" }
  smoke_probe_2_flags: { name: "Smoking: probe 2 alerts said", max: 100 }
  smoke_probe_3_food: { name: "Smoking: probe 3 is in", max: 40, icon: "mdi:food-steak" }
  smoke_probe_3_flags: { name: "Smoking: probe 3 alerts said", max: 100 }
  smoke_probe_4_food: { name: "Smoking: probe 4 is in", max: 40, icon: "mdi:food-steak" }
  smoke_probe_4_flags: { name: "Smoking: probe 4 alerts said", max: 100 }

input_select:
  smoke_probe_1_kind: { name: "Smoking: probe 1 kind", options: [food, smoker], initial: food, icon: "mdi:thermometer-probe" }
  smoke_probe_2_kind: { name: "Smoking: probe 2 kind", options: [food, smoker], initial: food, icon: "mdi:thermometer-probe" }
  smoke_probe_3_kind: { name: "Smoking: probe 3 kind", options: [food, smoker], initial: food, icon: "mdi:thermometer-probe" }
  smoke_probe_4_kind: { name: "Smoking: probe 4 kind", options: [food, smoker], initial: food, icon: "mdi:thermometer-probe" }

input_number:
  smoke_probe_1_target: { name: "Smoking: probe 1 target", min: 0, max: 600, step: 1, mode: box, unit_of_measurement: "°F", icon: "mdi:target" }
  smoke_probe_2_target: { name: "Smoking: probe 2 target", min: 0, max: 600, step: 1, mode: box, unit_of_measurement: "°F", icon: "mdi:target" }
  smoke_probe_3_target: { name: "Smoking: probe 3 target", min: 0, max: 600, step: 1, mode: box, unit_of_measurement: "°F", icon: "mdi:target" }
  smoke_probe_4_target: { name: "Smoking: probe 4 target", min: 0, max: 600, step: 1, mode: box, unit_of_measurement: "°F", icon: "mdi:target" }

template:
  - triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
      # Saying what a probe is in shows on its sensor right away, not at the next minute.
      - trigger: state
        entity_id: ["input_text.smoke_probe_1_food","input_select.smoke_probe_1_kind","input_number.smoke_probe_1_target","input_text.smoke_probe_2_food","input_select.smoke_probe_2_kind","input_number.smoke_probe_2_target","input_text.smoke_probe_3_food","input_select.smoke_probe_3_kind","input_number.smoke_probe_3_target","input_text.smoke_probe_4_food","input_select.smoke_probe_4_kind","input_number.smoke_probe_4_target"]
    actions:
      - variables:
          ids: >-
            {% set ov = states('input_text.smoke_probes') %}
            {% if ov not in ['', 'unknown', 'unavailable'] %}{% set l = ov.split(',') | map('trim') | list %}
            {% else %}
            {% set all = integration_entities('inkbird') | select('match', 'sensor\\.') | list %}
            {% set ns = namespace(l=[]) %}
            {% for n in range(1, 5) %}{% set ns.l = ns.l + [all | select('search', 'probe_' ~ n ~ '$') | first | default('')] %}{% endfor %}
            {% set l = ns.l %}
            {% endif %}
            {{ (l + ["","","",""])[:4] }}
          reads: >-
            {% set ns = namespace(out=[]) %}
            {% for e in ids %}
            {% set l = expand(e) if e else [] %}{% set s = l[0] if l | count > 0 else none %}
            {% set seen = (s.last_reported if s and s.last_reported is defined else (s.last_updated if s else none)) %}
            {% set ok = s is not none and s.state | is_number and seen is not none and (now() - seen).total_seconds() < 150 %}
            {% set v = s.state | float(0) if ok else 0 %}
            {% if ok and (s.attributes.unit_of_measurement | default('°F')) == '°C' %}{% set v = v * 9 / 5 + 32 %}{% endif %}
            {% set ns.out = ns.out + [(v | round(0) | int) if ok and -40 < v < 1100 else none] %}
            {% endfor %}{{ ns.out }}
          ts: "{{ now().timestamp() | int }}"
    sensor:
      - name: "Smoke probe 1"
        unique_id: pik_smoke_probe_1
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermometer-probe
        availability: "{{ reads[0] is not none }}"
        state: "{{ reads[0] }}"
        attributes:
          source: "{{ ids[0] }}"
          food: >-
            {% set food = states('input_text.smoke_probe_1_food') %}{{ '' if food in ['unknown', 'unavailable'] else food }}
          kind: "{{ states('input_select.smoke_probe_1_kind') }}"
          target: "{{ states('input_number.smoke_probe_1_target') | float(0) | int }}"
          hist: >-
            {% set h = this.attributes.hist | default([]) if this is defined and this.attributes is defined else [] %}
            {% set ns = namespace(l=[]) %}{% for p in h %}{% if ts - p[0] < 1260 %}{% set ns.l = ns.l + [p] %}{% endif %}{% endfor %}
            {{ ns.l + ([[ts, reads[0]]] if reads[0] is not none else []) }}
          rate: >-
            {% set h = this.attributes.hist | default([]) if this is defined and this.attributes is defined else [] %}
            {% set v = reads[0] %}{% set ns = namespace(b=none) %}
            {% for p in h %}{% if ts - p[0] <= 1200 and ts - p[0] >= 480 %}{% set ns.b = p %}{% endif %}{% endfor %}
            {{ (((v - ns.b[1]) / ((ts - ns.b[0]) / 3600)) | round(1)) if v is not none and ns.b is not none else none }}
          flat: >-
            {% set r = this.attributes.rate if this is defined and this.attributes is defined and this.attributes.rate is defined else none %}
            {{ r is number and -2.5 < r < 2.5 }}
          eta_min: >-
            {% set food = states('input_text.smoke_probe_1_food') %}{% set food = '' if food in ['unknown', 'unavailable'] else food %}
            {% set kind = states('input_select.smoke_probe_1_kind') %}{% set target = states('input_number.smoke_probe_1_target') | float(0) | int %}
            {% set r = this.attributes.rate if this is defined and this.attributes is defined and this.attributes.rate is defined else none %}
            {% set v = reads[0] %}
            {{ (((target - v) / r * 60) | round(0) | int) if kind == 'food' and target > 0 and v is not none and r is number and r >= 3 and v < target else none }}
      - name: "Smoke probe 2"
        unique_id: pik_smoke_probe_2
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermometer-probe
        availability: "{{ reads[1] is not none }}"
        state: "{{ reads[1] }}"
        attributes:
          source: "{{ ids[1] }}"
          food: >-
