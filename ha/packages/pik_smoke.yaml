automation:
  - id: smoke_start
    alias: "Smoking: the Inkbird started reading"
    description: "Turns the cook on. If the last cook ended more than 3 hours ago it's a new cook: probes set up more than 3 hours ago are cleared (ones just set, like Thanksgiving's, stay), and the start time is set."
    mode: single
    triggers:
      - trigger: template
        value_template: "{{ [\"sensor.smoke_probe_1\",\"sensor.smoke_probe_2\",\"sensor.smoke_probe_3\",\"sensor.smoke_probe_4\"] | select('has_value') | list | count > 0 }}"
        for: { minutes: 1 }
    conditions:
      - condition: state
        entity_id: input_boolean.smoke_on
        state: "off"
    actions:
      - variables:
          fresh: "{{ (now() - states.input_boolean.smoke_on.last_changed).total_seconds() > 10800 }}"
      - if: "{{ fresh }}"
        then:
          - repeat:
              for_each: "{{ range(1, 5) | list }}"
              sequence:
                - if: "{{ (now() - (expand('input_text.smoke_probe_' ~ repeat.item ~ '_food') | first).last_changed).total_seconds() > 10800 }}"
                  then:
                    - action: script.smoke_probe
                      data: { probe: "{{ repeat.item }}", food: "" }
      - if: "{{ fresh or states('input_datetime.smoke_started') in ['unknown', 'unavailable', ''] or (now() - (states('input_datetime.smoke_started') | as_datetime | as_local)).total_seconds() > 43200 }}"
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.smoke_started }
            data: { timestamp: "{{ now().timestamp() }}" }
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.smoke_on }
      - if: "{{ not is_state('input_boolean.smoke_quiet', 'on') and [\"input_text.smoke_probe_1_food\",\"input_text.smoke_probe_2_food\",\"input_text.smoke_probe_3_food\",\"input_text.smoke_probe_4_food\"] | map('states') | reject('in', ['', 'unknown', 'unavailable']) | list | count == 0 }}"
        then:
          - action: script.pik_announce
            data: { message: "The Inkbird is on. Tell me what each probe is in, like: probe 1 is the brisket." }
            continue_on_error: true

  - id: smoke_stop
    alias: "Smoking: the Inkbird stopped reading for 30 minutes"
    description: "Turns the cook off but keeps what each probe was in, in case it comes back in range."
    mode: single
    triggers:
      - trigger: template
        value_template: "{{ [\"sensor.smoke_probe_1\",\"sensor.smoke_probe_2\",\"sensor.smoke_probe_3\",\"sensor.smoke_probe_4\"] | select('has_value') | list | count == 0 }}"
        for: { minutes: 30 }
    conditions:
      - condition: state
        entity_id: input_boolean.smoke_on
        state: "on"
    actions:
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.smoke_on }

  - id: smoke_watch
    alias: "Smoking: watch the probes"
    description: "Every minute during a cook: almost there, done (twice more until someone says got it), the stall, the smoker dropping or off its setting, a probe or the Inkbird lost."
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/1"
        seconds: 20
    conditions:
      - condition: state
        entity_id: input_boolean.smoke_on
        state: "on"
    actions:
      - variables:
          plan: >-
            {% set m = (now().timestamp() / 60) | int %}
            {% set out = namespace(msgs=[], flags=[], phones=false, lost=[], labeled=0, gone=0) %}
            {% for i in range(1, 5) %}
            {% set food = states('input_text.smoke_probe_' ~ i ~ '_food') %}{% set food = '' if food in ['unknown', 'unavailable'] else food %}
            {% set what = 'the ' ~ (food | lower) %}
            {% set kind = states('input_select.smoke_probe_' ~ i ~ '_kind') %}
            {% set target = states('input_number.smoke_probe_' ~ i ~ '_target') | float(0) | int %}
            {% set e = 'sensor.smoke_probe_' ~ i %}{% set l = expand(e) %}{% set s = l[0] if l | count > 0 else none %}
            {% set ok = s is not none and s.state | is_number %}
            {% set v = s.state | float(0) | int if ok else 0 %}
            {% set rate = s.attributes.rate if ok and s.attributes.rate is defined else none %}
            {% set f = namespace(d={}) %}
            {% for tok in (states('input_text.smoke_probe_' ~ i ~ '_flags') | replace('unknown', '') | replace('unavailable', '')).split() %}
            {% set kv = tok.split('@') %}{% set f.d = dict(f.d, **{kv[0]: (kv[1] | int(0) if kv | count > 1 else 0)}) %}
            {% endfor %}
            {% set d = namespace(v=f.d) %}
            {% if food %}
            {% set out.labeled = out.labeled + 1 %}
            {% if not ok %}
            {% set away = (now() - s.last_changed).total_seconds() if s is not none else 9999 %}
            {% if away >= 120 %}
            {% set out.gone = out.gone + 1 %}
            {% if 'l' not in d.v %}{% set out.lost = out.lost + [[i, what]] %}{% set d.v = dict(d.v, l=0) %}{% endif %}
            {% endif %}
            {% else %}
            {% set d.v = dict(d.v | items | rejectattr(0, 'eq', 'l') | list) %}
            {% if kind == 'food' and v > 230 %}
            {% if 'x' not in d.v %}{% set out.msgs = out.msgs + ['Probe ' ~ i ~ ' reads ' ~ v ~ '. It may have slipped out of ' ~ what ~ '.'] %}{% set out.phones = true %}{% set d.v = dict(d.v, x=0) %}{% endif %}
            {% elif kind == 'food' and target > 0 %}
            {% set d.v = dict(d.v | items | rejectattr(0, 'eq', 'x') | list) %}
            {% if v < target - 15 %}
            {% set d.v = dict(d.v | items | rejectattr(0, 'in', ['n', 'd', 'a', 'r1', 'r2']) | list) %}
            {% elif v >= target and 'd' not in d.v %}
            {% set out.msgs = out.msgs + ['The ' ~ (food | lower) ~ ' hit ' ~ target ~ '. Time to take it off.'] %}{% set out.phones = true %}
            {% set d.v = dict(d.v, d=m, n=0) %}
            {% elif v >= target - 10 and v < target and 'n' not in d.v and 'd' not in d.v %}
            {% set out.msgs = out.msgs + ['The ' ~ (food | lower) ~ ' is at ' ~ v ~ ', almost to ' ~ target ~ '.'] %}
            {% set d.v = dict(d.v, n=0) %}
            {% elif 'd' in d.v and 'a' not in d.v and v >= target - 5 %}
            {% for r, after in [['r1', 10], ['r2', 20]] %}
            {% if r not in d.v and m - d.v['d'] >= after and ('r1' in d.v or r == 'r1') %}
            {% set out.msgs = out.msgs + ['Reminder: the ' ~ (food | lower) ~ ' is done. It is at ' ~ v ~ '.'] %}{% set out.phones = true %}
            {% set d.v = dict(d.v, **{r: 0}) %}
            {% endif %}
            {% endfor %}
            {% endif %}
            {% if target >= 190 and 150 <= v <= 180 and rate is number and -2.5 < rate < 2.5 %}
            {% if 'w' not in d.v %}{% set d.v = dict(d.v, w=m) %}
            {% elif m - d.v['w'] >= 30 and 's' not in d.v %}
            {% set out.msgs = out.msgs + ['The ' ~ (food | lower) ~ ' has been stuck around ' ~ v ~ ' for half an hour. That is the stall, and it is normal for big cuts. Wrap it if you want to push through.'] %}
            {% set d.v = dict(d.v, s=0) %}
            {% endif %}
            {% else %}{% set d.v = dict(d.v | items | rejectattr(0, 'eq', 'w') | list) %}
            {% endif %}
            {% elif kind == 'smoker' %}
            {% if rate is number and rate <= -50 and 'f' not in d.v and (target == 0 or v < target - 20) %}
            {% set out.msgs = out.msgs + ['The smoker is dropping fast. It is at ' ~ v ~ '. Check the pellets and the fire.'] %}{% set out.phones = true %}
            {% set d.v = dict(d.v, f=0) %}
            {% elif rate is number and rate > 0 %}{% set d.v = dict(d.v | items | rejectattr(0, 'eq', 'f') | list) %}
            {% endif %}
            {% if target > 0 and (v - target) | abs <= 15 and 'k' not in d.v %}{% set d.v = dict(d.v, k=0) %}{% endif %}
            {% if target > 0 and (v - target) | abs > 25 and 'k' in d.v %}
            {% if 'o' not in d.v %}{% set d.v = dict(d.v, o=m) %}
            {% elif m - d.v['o'] >= 10 and 'O' not in d.v %}
            {% set out.msgs = out.msgs + ['The smoker is at ' ~ v ~ ', and it is set for ' ~ target ~ '.'] %}{% set d.v = dict(d.v, O=0) %}
            {% endif %}
            {% elif target > 0 and (v - target) | abs <= 15 %}{% set d.v = dict(d.v | items | rejectattr(0, 'in', ['o', 'O']) | list) %}
            {% endif %}
            {% endif %}
            {% endif %}
            {% endif %}
            {% set ns2 = namespace(t=[]) %}
            {% for k, val in d.v | dictsort %}{% set ns2.t = ns2.t + [k ~ ('@' ~ val if val else '')] %}{% endfor %}
            {% set out.flags = out.flags + [ns2.t | join(' ')] %}
            {% endfor %}
            {% if out.lost | count and out.gone == out.labeled %}
            {% set out.msgs = out.msgs + ['I lost the Inkbird. It might be off, out of range, or out of battery.'] %}{% set out.phones = true %}
            {% else %}
            {% for p in out.lost %}{% set out.msgs = out.msgs + ['Probe ' ~ p[0] ~ ', ' ~ p[1] ~ ', stopped reading. Check that it is plugged in all the way.'] %}{% endfor %}
            {% endif %}
            {{ {'msgs': out.msgs, 'flags': out.flags, 'phones': out.phones} }}
      - repeat:
          for_each: "{{ range(1, 5) | list }}"
          sequence:
            # Keep a "got it" that landed while this run was working it out.
            - variables:
                cur: "{{ states('input_text.smoke_probe_' ~ repeat.item ~ '_flags') | replace('unknown', '') }}"
                new: >-
                  {% set p = plan.flags[repeat.item - 1] %}{% set keys = p.split() | map('regex_replace', '@.*', '') | list %}
                  {{ (p ~ ' a') | trim if 'a' in cur.split() and 'a' not in keys and 'd' in keys else p }}
            - if: "{{ cur != new }}"
              then:
                - action: input_text.set_value
                  target: { entity_id: "input_text.smoke_probe_{{ repeat.item }}_flags" }
                  data: { value: "{{ new }}" }
      - if: "{{ plan.msgs | count > 0 }}"
        then:
          - event: smoke_alert
            event_data: { message: "{{ plan.msgs | join(' ') }}" }
          - if: "{{ not is_state('input_boolean.smoke_quiet', 'on') }}"
            then:
              - action: script.pik_announce
                data: { message: "{{ plan.msgs | join(' ') }}", phones: "{{ plan.phones }}" }
                continue_on_error: true

script:
  smoke_probe:
    alias: "Smoking: set a probe"
    description: >-
      Says what an Inkbird probe is in and the temperature to take it to, e.g. "probe 1 is the brisket",
      "probe 2 is the pork shoulder, take it to 200", "probe 4 is the smoker at 250", or "clear probe 3".
      probe: 1-4. food: a few words ("brisket", "pork shoulder", "smoker"); empty clears the probe.
      target: °F, optional; if left out a usual pull temperature is used for common cuts
      (brisket and pork shoulder 203, ribs 198, poultry 165, pork loin, fish and lamb 145, prime rib 130).
      A probe in "smoker" (or "pit", "grill") watches the smoker's air instead of food.
    mode: queued
    fields:
      probe: { description: "Probe number, 1 to 4", required: true, selector: { number: { min: 1, max: 4, mode: box } } }
      food: { description: What it's in; empty clears the probe, selector: { text: null } }
      target: { description: "Temperature in °F (optional)", selector: { number: { min: 0, max: 600, mode: box } } }
      kind: { description: "food or smoker (optional; worked out from the words)", selector: { select: { options: [food, smoker] } } }
    sequence:
      - variables:
          n: "{{ probe | int(0) }}"
          words: "{{ (food | default('') | string | trim)[:40] }}"
          low: "{{ words | lower }}"
          hit: >-
            {% set ns = namespace(h=none) %}{% for p in [["smoker","smoker",0],["pit","smoker",0],["grill","smoker",0],["chamber","smoker",0],["ambient","smoker",0],["air","smoker",0],["prime rib","food",130],["rib roast","food",130],["tri tip","food",135],["tri-tip","food",135],["roast beef","food",130],["beef rib","food",203],["short rib","food",203],["pork shoulder","food",203],["pork butt","food",203],["boston butt","food",203],["pulled pork","food",203],["pork loin","food",145],["tenderloin","food",145],["pork chop","food",145],["brisket","food",203],["chuck","food",203],["rib","food",198],["turkey","food",165],["chicken","food",165],["breast","food",165],["thigh","food",165],["wing","food",165],["duck","food",165],["hen","food",165],["salmon","food",145],["trout","food",145],["fish","food",145],["lamb","food",145],["ham","food",140],["sausage","food",160],["brat","food",160],["burger","food",160],["meatloaf","food",160],["steak","food",130]] %}{% if ns.h is none and p[0] in low %}{% set ns.h = p %}{% endif %}{% endfor %}{{ ns.h }}
          k: "{{ kind if kind is defined and kind in ['food', 'smoker'] else (hit[1] if hit else 'food') }}"
          t: "{{ (target | int(0)) if target is defined and target not in [none, ''] else (hit[2] if hit and hit[1] == k else 0) }}"
      - if: "{{ n < 1 or n > 4 }}"
        then:
          - variables: { result: { ok: false, message: "The Inkbird has probes 1 to 4. Which one?" } }
          - stop: "Bad probe"
            response_variable: result
      - action: input_text.set_value
        target: { entity_id: "input_text.smoke_probe_{{ n }}_food" }
        data: { value: "{{ words }}" }
      - action: input_select.select_option
        target: { entity_id: "input_select.smoke_probe_{{ n }}_kind" }
        data: { option: "{{ k if words else 'food' }}" }
      - action: input_number.set_value
        target: { entity_id: "input_number.smoke_probe_{{ n }}_target" }
        data: { value: "{{ t if words else 0 }}" }
      - action: input_text.set_value
        target: { entity_id: "input_text.smoke_probe_{{ n }}_flags" }
        data: { value: "" }
      # Setting up a probe while the Inkbird is reading (re)starts the cook, e.g. after "we're done smoking".
      - if: "{{ words != '' and is_state('input_boolean.smoke_on', 'off') and [\"sensor.smoke_probe_1\",\"sensor.smoke_probe_2\",\"sensor.smoke_probe_3\",\"sensor.smoke_probe_4\"] | select('has_value') | list | count > 0 }}"
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.smoke_started }
            data: { timestamp: "{{ now().timestamp() }}" }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.smoke_on }
      - variables:
          result: >-
            {% set v = states('sensor.smoke_probe_' ~ n) %}
            {% set now_txt = (' It reads ' ~ v ~ ' right now.') if v | is_number else ' It is not reading yet.' %}
            {% if not words %}{% set msg = 'Probe ' ~ n ~ ' is cleared.' %}
            {% elif k == 'smoker' %}{% set msg = 'Probe ' ~ n ~ ' is watching the smoker' ~ ((', set for ' ~ t) if t else '') ~ '.' ~ now_txt %}
            {% elif t %}{% set msg = 'Probe ' ~ n ~ ' is the ' ~ low ~ ', and I will tell you at ' ~ t ~ '.' ~ now_txt %}
            {% else %}{% set msg = 'Probe ' ~ n ~ ' is the ' ~ low ~ '. What temperature should I tell you at?' %}{% endif %}
            {{ {'ok': true, 'probe': n, 'food': words, 'kind': k, 'target_f': t, 'message': msg} }}
      - stop: "Set"
        response_variable: result

  smoke_status:
    alias: "Smoking: how's it going"
    description: >-
      Live Inkbird readings for "how's the brisket", "what's the smoker at", "how long on the pork".
      For each probe in use: what it's in, °F now, target, how fast it's rising (°F per hour), rough
      minutes to target (a guess; big cuts stall), and whether it's holding steady (the stall). Speak briefly.
    mode: parallel
    sequence:
      - variables:
          result: >-
            {% set ns = namespace(p=[]) %}
            {% for i in range(1, 5) %}
              {% set food = states('input_text.smoke_probe_' ~ i ~ '_food') %}
              {% set e = 'sensor.smoke_probe_' ~ i %}
              {% if food not in ['', 'unknown', 'unavailable'] or has_value(e) %}
                {% set ns.p = ns.p + [{'probe': i, 'food': food if food not in ['', 'unknown', 'unavailable'] else 'not set',
                   'kind': states('input_select.smoke_probe_' ~ i ~ '_kind'),
                   'now_f': states(e) | int if has_value(e) else 'not reading',
                   'target_f': states('input_number.smoke_probe_' ~ i ~ '_target') | float(0) | int,
                   'rising_f_per_hour': state_attr(e, 'rate'), 'minutes_to_target': state_attr(e, 'eta_min'),
                   'holding_steady': state_attr(e, 'flat') == true}] %}
              {% endif %}
            {% endfor %}
            {% set st = states('input_datetime.smoke_started') %}
            {{ {'cooking': is_state('input_boolean.smoke_on', 'on'), 'probes': ns.p,
                'minutes_since_start': (((now() - (st | as_datetime | as_local)).total_seconds() / 60) | int) if is_state('input_boolean.smoke_on', 'on') and st not in ['unknown', 'unavailable', ''] else none,
                'note': 'No probes are reading. The Inkbird may be off or out of range.' if ns.p | selectattr('now_f', 'number') | list | count == 0 else ''} }}
      - stop: "Status"
        response_variable: result

  smoke_got_it:
    alias: "Smoking: got it"
    description: 'Stops the "it is done" reminders, e.g. "got it" or "I pulled the brisket". probe: optional; leave out for all.'
    mode: queued
    fields:
      probe: { description: "Probe number (optional)", selector: { number: { min: 1, max: 4, mode: box } } }
    sequence:
      - repeat:
          for_each: "{{ [probe | int] if probe is defined and probe not in [none, ''] else range(1, 5) | list }}"
          sequence:
            - variables:
                cur: "{{ states('input_text.smoke_probe_' ~ repeat.item ~ '_flags') | replace('unknown', '') }}"
            - if: "{{ cur is search('(^| )d@') and not cur is search('(^| )a( |$)') }}"
              then:
                - action: input_text.set_value
                  target: { entity_id: "input_text.smoke_probe_{{ repeat.item }}_flags" }
                  data: { value: "{{ (cur ~ ' a') | trim }}" }
      - variables: { result: { ok: true, message: "Got it. No more reminders." } }
      - stop: "Done"
        response_variable: result

  smoke_end:
    alias: "Smoking: end the cook"
    description: 'Ends the cook and clears every probe ("we are done smoking", "end the cook").'
    mode: single
    sequence:
      - action: input_text.set_value
        target: { entity_id: ["input_text.smoke_probe_1_flags","input_text.smoke_probe_2_flags","input_text.smoke_probe_3_flags","input_text.smoke_probe_4_flags"] }
        data: { value: "" }
      - action: input_text.set_value
        target: { entity_id: ["input_text.smoke_probe_1_food","input_text.smoke_probe_2_food","input_text.smoke_probe_3_food","input_text.smoke_probe_4_food"] }
        data: { value: "" }
      - action: input_number.set_value
        target: { entity_id: ["input_number.smoke_probe_1_target","input_number.smoke_probe_2_target","input_number.smoke_probe_3_target","input_number.smoke_probe_4_target"] }
        data: { value: 0 }
      - action: input_select.select_option
        target: { entity_id: ["input_select.smoke_probe_1_kind","input_select.smoke_probe_2_kind","input_select.smoke_probe_3_kind","input_select.smoke_probe_4_kind"] }
        data: { option: food }
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.smoke_on }
      - variables: { result: { ok: true, message: "The cook is ended and the probes are cleared." } }
      - stop: "Ended"
        response_variable: result
