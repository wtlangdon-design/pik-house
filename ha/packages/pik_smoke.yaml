            {% set ns = namespace(l=[]) %}{% for p in h %}{% if ts - p[0] < 1260 %}{% set ns.l = ns.l + [p] %}{% endif %}{% endfor %}
            {{ ns.l + ([[ts, reads[1]]] if reads[1] is not none else []) }}
          rate: >-
