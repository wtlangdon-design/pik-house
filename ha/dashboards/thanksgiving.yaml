# The Thanksgiving dashboard: holiday cooking mode on one full-screen page.
# Paste into: Settings → Dashboards → (Thanksgiving) → pencil → ⋮ → Raw configuration editor.
#   …/kitchen  the Chromebook (1280×800)
#   …/echo     the Echo Show 15: the far view, big type to read from the stove
title: Thanksgiving
views:
  - title: Kitchen
    path: kitchen
    panel: true
    cards:
      - type: custom:pik-holiday-card
        plan: thanksgiving_2026
        prefix: tg26
        timers: 12
  - title: Echo Show
    path: echo
    panel: true
    cards:
      - type: custom:pik-holiday-card
        plan: thanksgiving_2026
        prefix: tg26
        timers: 12
        layout: far
