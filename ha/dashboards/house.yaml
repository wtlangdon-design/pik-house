# The house feed: Pik on the kitchen Chromebook, live (1280×800).
# Data: the House feed list (todo.house_feed, filled by script.feed_post), the plant catalog and soil sensors,
# the Ecobee, Leviton lights, Rachio, Ring, the Echo Show, the shared kitchen timers, the wine cellar
# (todo.wine_cellar) and RNO's live parking counts; an active Instacart/Grubhub/DoorDash delivery takes the parking tile's place.
# The Energy tile reads the Powerwall 3 through Teslemetry (cloud; Tesla shut off the Powerwall 3's local API).
# A tile with nothing behind it hides.
title: House
views:
  - title: House
    path: house
    panel: true
    cards:
      - type: custom:pik-house-card
        weather: weather.hallway_thermostat   # the Ecobee's forecast (Met.no reads ~15° warm here: the hub's elevation is set to 0)
        sun: sun.sun
        thermostat: climate.hallway_thermostat
        feed_list: todo.house_feed
        plants_list: todo.plants
        plants_quiet: input_text.pik_plants_quiet
        timers: 12
        calendar: calendar.tyler_charlie   # the shared calendar; until it's connected the header shows a placeholder
        cellar: { list: todo.wine_cellar, path: /dashboard-cellar/cellar }
        airport:
          name: RNO
          lots:
            - { name: Long-Term Garage, short: Garage, entity: sensor.rno_parking_long_term_garage }
            - { name: Park & Walk, entity: sensor.rno_parking_park_walk }
            - { name: Long-Term Surface, short: Surface, entity: sensor.rno_parking_long_term_surface }
            - { name: Short-Term, entity: sensor.rno_parking_short_term_garage }
        plant_groups:
          - { name: Kitchen, indicator: nerve plant, sensor: sensor.gw1200b_soil_moisture_1, dry: 15, dry_entity: input_number.pik_dry_kitchen }
          - { name: Big aroids, indicator: entry monstera, sensor: sensor.gw1200b_soil_moisture_2, dry: 25, dry_entity: input_number.pik_dry_big_aroids }
          - { name: Bedroom & office, indicator: spider plant, sensor: sensor.gw1200b_soil_moisture_3, dry: 25, dry_entity: input_number.pik_dry_bedroom_office }
          - { name: Trees & palms, indicator: bedroom fiddle leaf fig, sensor: sensor.gw1200b_soil_moisture_4, dry: 22, dry_entity: input_number.pik_dry_trees_palms }
          - { name: Tough guys, indicator: big ZZ in the yellow pot, sensor: sensor.gw1200b_soil_moisture_5, dry: 10, dry_entity: input_number.pik_dry_tough_guys }
          - { name: Jungle cacti, indicator: blooming Christmas cactus, sensor: sensor.gw1200b_soil_moisture_6, dry: 18, dry_entity: input_number.pik_dry_jungle_cacti }
          - { name: Desert cacti, indicator: tall euphorbia, sensor: sensor.gw1200b_soil_moisture_7, dry: 5, dry_entity: input_number.pik_dry_desert_cacti }
        lights:   # every Leviton light plus the Wemo nightstand lamps, by room (the tile counts single lights)
          - { name: Kitchen, entities: [light.kitchen_cans, light.kitchen_chandelier, light.bar] }
          - { name: Living room, entities: [light.living_room_chandelier, light.living_room_cans] }
          - { name: Dining room, entities: [light.dining_room_chandelier, light.dining_room_cans] }
          - { name: Bedroom, entities: [light.master_bedroom, light.master_closet, switch.nightstand1, switch.nightstand2] }   # the Wemo nightstand lamps
          - { name: Master bath, entities: [light.bathroom, light.vanity, light.shower] }
          - { name: Office, entities: [light.office, light.office_cans] }
          - { name: Entry & hall, entities: [light.entryway, light.hallway] }
          - { name: Front door, entities: [light.front_door] }
        watering:
          yard: { name: Rachio, standby: switch.outside_home_controller_standby }
        doorbell: { name: Gate, camera: camera.outside_gate_live_view }
        echo: { media_player: media_player.tyler_s_echo_show_15 }
        energy:   # Teslemetry: battery > 0 = discharging, grid > 0 = importing (the card flips them)
          solar_power: sensor.home_solar_power
          load_power: sensor.home_load_power
          battery_power: sensor.home_battery_power
          grid_power: sensor.home_grid_power
          battery_level: sensor.home_percentage_charged
          grid_status: binary_sensor.home_grid_status
          capacity_kwh: 13.5
        holiday:
          - { name: Thanksgiving, path: /dashboard-thanksgiving/kitchen, from: "2026-11-24", to: "2026-11-26" }
