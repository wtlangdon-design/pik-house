.app{--bg:#F3ECE0;--glow:#FCF7EE;--ink:#2A2019;--muted:#7A6B5A;--card:#FFFBF4;--line:#E2D5C1;--soft:#EDE3D3;--btn:#2A2019;--btnInk:#FBF6EE;--urg:#C2452F;--urgBg:#FFF0EA;
  position:relative;width:1280px;height:800px;overflow:hidden;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 22% 38%,var(--glow) 0%,var(--bg) 58%);transition:background .6s,color .6s}
.app.dark{--bg:#12181C;--glow:#232C2C;--ink:#F1E8DA;--muted:#A3988A;--card:#1D2529;--line:#2F3A3F;--soft:#243035;--btn:#F1E8DA;--btnInk:#1A1F22;--urg:#FF8F6B;--urgBg:#2C1F1C}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.eb{font:700 11px 'DM Sans',system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
/* top strip */
.top{position:absolute;left:44px;right:44px;top:26px;height:64px;display:flex;align-items:center;gap:28px}
.clock{font:400 58px/1 'Instrument Serif',Georgia,serif;letter-spacing:-.01em}
.clock span{font:600 18px 'DM Sans',system-ui,sans-serif;color:var(--muted);margin-left:6px}
.date{font:500 16px 'DM Sans',system-ui,sans-serif;color:var(--muted);line-height:1.3}
.sep{width:1px;height:40px;background:var(--line)}
.wx{display:flex;align-items:baseline;gap:8px;font:500 16px 'DM Sans',system-ui,sans-serif;color:var(--muted)}
.wx b{font:400 34px 'Instrument Serif',Georgia,serif;color:var(--ink)}
.airok{color:#5E8A5A}.dark .airok{color:#ADDFB9}
.demo{margin-left:auto;display:flex;gap:8px}
.upc{margin-left:auto;min-width:0;max-width:470px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.upc .eb{margin-bottom:1px}
.upc .ul{font:500 15px/1.3 'DM Sans',system-ui,sans-serif;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.upc .ul b{font-weight:700}
.upc .ul i{font-style:normal;color:var(--muted)}
.upc.ph .ul{color:var(--muted);white-space:normal;font-size:14px;max-width:330px}
.dbtn{height:44px;padding:0 14px;border-radius:22px;border:1px dashed var(--line);background:transparent;color:var(--muted);font:600 13px 'DM Sans',system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.dbtn.on{border-style:solid;border-color:var(--ink);color:var(--ink)}
.ghost{height:44px;padding:0 14px;border-radius:22px;border:1px dashed var(--line);background:transparent;color:var(--muted);font:600 13px 'DM Sans',system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.ghost.on{border-style:solid;border-color:var(--ink);color:var(--ink)}
/* stage */
.stage{position:absolute;left:44px;right:44px;top:118px;height:452px;display:flex;align-items:center;gap:34px}
.pikcol{width:300px;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
.pikbtn{width:280px;height:280px;transition:width .4s,height .4s;padding:0;border:none;background:transparent;cursor:pointer;border-radius:50%}
.pikbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pikname{display:flex;align-items:center;gap:10px;margin-top:4px}
.pikname b{font:400 34px 'Instrument Serif',Georgia,serif}
.pill{display:inline-block;border:1px solid var(--line);border-radius:100px;padding:5px 11px;font:700 10px 'DM Sans',system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:var(--card)}
.pill.alert{color:var(--urg);border-color:var(--urg)}
.mic{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px 'DM Sans',system-ui,sans-serif;cursor:pointer}
.mic.off{border-color:var(--urg);color:var(--urg)}
.bubble{position:relative;flex:1;min-width:0;height:420px;box-sizing:border-box;padding:30px 36px 28px;border-radius:34px;background:var(--card);border:1px solid var(--line);box-shadow:0 30px 60px -30px rgba(80,55,30,.35);display:flex;flex-direction:column;transition:background .4s,border-color .4s}
.dark .bubble{box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.bubble::before{content:"";position:absolute;left:-13px;top:150px;width:24px;height:24px;background:var(--card);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg);transition:background .4s,border-color .4s}
.bubble.urgent{background:var(--urgBg);border-color:var(--urg)}
.bubble.urgent::before{background:var(--urgBg);border-color:var(--urg)}
.btop{display:flex;align-items:center;gap:12px}
.pdots{display:flex;gap:6px;margin-left:4px}
.pdots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.pdots i.on{background:var(--ink)}
.nav{margin-left:auto;display:flex;gap:8px}
.nbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.nbtn.dim{opacity:.3;cursor:default}
.cat{display:flex;align-items:center;gap:8px;margin-top:26px}
.cd{width:10px;height:10px;border-radius:50%;display:block;background:#B7A58C}
.cd.plant{background:#6E9A68}.cd.weather{background:#5F94C4}.cd.bill{background:#D8953F}.cd.home{background:#8B76C9}.cd.package{background:#D07B5E}.cd.energy{background:#E0A93E}.cd.door{background:var(--urg)}.cd.air{background:#8D9C96}.cd.light{background:#E0A93E}.cd.water{background:#4F9BC4}
.utag{color:var(--urg)}
.btitle{font:400 46px/1.05 'Instrument Serif',Georgia,serif;letter-spacing:-.01em;margin:12px 0 0}
.bdetail{font:400 19px/1.5 'DM Sans',system-ui,sans-serif;color:var(--muted);margin:14px 0 0;max-width:640px}
.acts{display:flex;gap:12px;margin-top:auto}
.pbtn{height:56px;padding:0 26px;border-radius:28px;border:none;background:var(--btn);color:var(--btnInk);font:700 16px 'DM Sans',system-ui,sans-serif;cursor:pointer}
.urgent .pbtn{background:var(--urg);color:#fff}
.sbtn{height:56px;padding:0 24px;border-radius:28px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 16px 'DM Sans',system-ui,sans-serif;cursor:pointer}
.peek{margin-left:auto;max-width:340px;min-width:0;display:flex;align-items:center;gap:10px;height:56px;padding:0 20px;border-radius:28px;border:1px solid var(--line);background:transparent;color:var(--muted);font:500 15px 'DM Sans',system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.peek .pt{overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.peek:hover{border-color:var(--muted)}
.urgent .peek{display:none}
.q{font:italic 400 30px/1.2 'Instrument Serif',Georgia,serif;color:var(--muted);margin:26px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:none}
.ans{font:400 40px/1.15 'Instrument Serif',Georgia,serif;margin:18px 0 0;min-height:0;overflow-y:auto;overflow-wrap:anywhere}
.ans.s2{font-size:33px}
.ans.s3{font-size:27px;line-height:1.2}
.ans.s4{font-size:23px;line-height:1.25}
.wait{font:600 13px 'DM Sans',system-ui,sans-serif;color:var(--muted)}
/* pebbles */
.pebs{position:absolute;left:44px;right:44px;top:598px;height:166px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:14px}
.peb{min-width:0}
.pebs.five .pv{font-size:44px}
.pebs.six{gap:10px}.pebs.six .peb{padding:16px 16px}.pebs.six .pv{font-size:38px}.pebs.six .ps{font-size:13px}
.peb.outab{cursor:default}.peb.outab.map{cursor:pointer;border-color:var(--muted)}.peb.outab .pv{font-size:40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.peb .ps{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.peb{box-sizing:border-box;padding:18px 20px;border-radius:28px;border:1px solid var(--line);background:var(--soft);color:var(--ink);text-align:left;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;transition:background .4s,border-color .4s}
.peb:hover{border-color:var(--muted)}
.peb.out{border-color:var(--urg);background:var(--urgBg)}
.pv{font:400 50px/1 'Instrument Serif',Georgia,serif;margin-top:10px}
.pv small{font:500 15px 'DM Sans',system-ui,sans-serif;color:var(--muted);margin-left:6px}
.pv.dry{color:var(--urg)}
.ps{font:500 14px/1.35 'DM Sans',system-ui,sans-serif;color:var(--muted);margin-top:auto}
.mini{display:flex;align-items:center;gap:6px;margin-top:10px}
.mini b{width:8px;height:8px;border-radius:50%;display:block}
.dots{flex:1;display:flex;justify-content:space-between;padding:0 3px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--line);display:block}
.dots.on i{background:var(--w);animation:dot 1.2s ease-in-out infinite}
.dots.on i:nth-child(2){animation-delay:.2s}.dots.on i:nth-child(3){animation-delay:.4s}
.dots.on.rev i:nth-child(1){animation-delay:.4s}.dots.on.rev i:nth-child(3){animation-delay:0s}
@keyframes dot{0%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.4)}}

.pikbtn svg{transition:width .4s,height .4s}
.tmode .pikbtn{width:214px;height:214px}
.tmode .pikbtn svg{width:214px;height:214px}
.timers{display:flex;flex-direction:column;gap:10px;margin-top:12px;width:100%}
.tchip{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 8px;border-radius:40px;background:var(--card);border:1px solid var(--line)}
.tchip svg{flex-shrink:0;transform:rotate(-90deg)}
.tr-bg{fill:none;stroke:var(--soft);stroke-width:6}
.tr-fg{fill:none;stroke:#E0A93E;stroke-width:6;stroke-linecap:round;stroke-dasharray:163.4;transition:stroke-dashoffset 1s linear}
.tt{flex:1;min-width:0;line-height:1}
.tt b{display:block;font:400 34px 'Instrument Serif',Georgia,serif;font-variant-numeric:tabular-nums}
.tt span{display:block;font:600 12px 'DM Sans',system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.tx{height:44px;min-width:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:transparent;color:var(--ink);font:700 14px 'DM Sans',system-ui,sans-serif;cursor:pointer}
.tchip.tdone{border-color:var(--urg);background:var(--urgBg);animation:tpulse 1s ease-in-out infinite}
.tchip.tdone .tr-fg{stroke:var(--urg)}
.tchip.tdone .tt b{color:var(--urg)}
.tchip.tdone .tx{background:var(--urg);border-color:var(--urg);color:#fff}
@keyframes tpulse{0%,100%{box-shadow:0 0 0 0 rgba(194,69,47,.0)}50%{box-shadow:0 0 0 8px rgba(194,69,47,.18)}}
.np{cursor:default;background:var(--card)}
.nphead{display:flex;align-items:center;gap:8px}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.eq i{width:3px;height:4px;border-radius:1px;background:#E0A93E;display:block}
.eq.on i{animation:eq .9s ease-in-out infinite}
.eq.on i:nth-child(2){animation-delay:.2s}.eq.on i:nth-child(3){animation-delay:.45s}
@keyframes eq{0%,100%{height:4px}50%{height:12px}}
.npt{font:400 32px/1.05 'Instrument Serif',Georgia,serif;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npc{display:flex;gap:6px;margin-top:auto}
.nc{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 18px/1 'DM Sans',system-ui,sans-serif;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.nc.main{background:var(--btn);color:var(--btnInk);border-color:var(--btn)}
.cd.reminder{background:#C98A3A}
@media (prefers-reduced-motion: reduce){.eq i,.tchip.tdone{animation:none!important}}
.bbar{position:relative;display:block;height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:16px}
.bfill{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background-color:#6E9A68;transition:width .6s}
.bfill.chg,.bfill.dis{background-image:linear-gradient(90deg,rgba(255,255,255,0) 0,rgba(255,255,255,.6) 50%,rgba(255,255,255,0) 100%);background-size:60px 100%;background-repeat:no-repeat;animation:shim 1.8s linear infinite}
.bfill.dis{animation-direction:reverse}
.bfill.out{background-color:var(--urg)}
@keyframes shim{from{background-position:-60px 0}to{background-position:calc(100% + 60px) 0}}
.gd{display:flex;gap:7px;margin-top:12px}
.gd i{width:16px;height:16px;border-radius:50%;display:block;background:#9BC096}
.dark .gd i{background:#3E5A44}
.gd i.dry{background:var(--urg)}
.gd i.wet{background:#8EC3CF}
.dark .gd i.wet{background:#2E4F4C}
/* sheets */
.scrim{position:absolute;inset:0;background:rgba(30,22,15,.38);z-index:20;animation:fade .3s ease-out;border:0;padding:0;cursor:pointer}
.dark .scrim{background:rgba(0,0,0,.55)}
.sheet{position:absolute;left:24px;right:24px;bottom:0;height:612px;z-index:21;box-sizing:border-box;padding:14px 36px 30px;border-radius:34px 34px 0 0;background:var(--card);border:1px solid var(--line);border-bottom:0;box-shadow:0 -20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;animation:up .38s cubic-bezier(.2,.8,.25,1)}
@keyframes up{0%{transform:translateY(100%)}100%{transform:none}}
@keyframes fade{0%{opacity:0}100%{opacity:1}}
.handle{width:56px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 10px}
.shead{display:flex;align-items:center;gap:16px}
.stitle{font:400 44px/1 'Instrument Serif',Georgia,serif;margin:0}
.done{margin-left:auto;height:48px;padding:0 24px;border-radius:24px;border:none;background:var(--btn);color:var(--btnInk);font:700 15px 'DM Sans',system-ui,sans-serif;cursor:pointer}
.sbody{flex:1;min-height:0;display:grid;gap:22px;margin-top:22px}
/* energy sheet */
.esb{grid-template-columns:1fr 340px}
.ewin{border-radius:26px;background:#1C221E;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ewin.out{box-shadow:inset 0 0 0 1.5px #C46A50}
.nlbl{fill:#CDBDA6;font:700 10.5px 'DM Sans',system-ui,sans-serif;letter-spacing:.1em}
.nval{fill:#FAEDD8;font:700 16px 'DM Sans',system-ui,sans-serif}
.hval{fill:#FFE1AA;font:700 19px 'DM Sans',system-ui,sans-serif}
.flow .wire{fill:none;stroke:#A59986;stroke-width:2;opacity:.3;stroke-dasharray:2 7;stroke-linecap:round}
.flow .pk{fill:none;stroke-linecap:round;stroke-width:5;stroke-dasharray:1 15;display:none}
.flow.on .wire{stroke:var(--w);opacity:.55;stroke-dasharray:none;stroke-width:2.4}
.flow.on .pk{display:inline;stroke:var(--w);animation:pkt 1.6s linear infinite;filter:drop-shadow(0 0 3px var(--w))}
.flow.on.rev .pk{animation-direction:reverse}
.w-sun{--w:#FFC580}.w-grid{--w:#A8C9D9}.w-bat{--w:#ADDFB9}
@keyframes pkt{to{stroke-dashoffset:-32}}
.moon,.cut{display:none}
.dark .sunic{display:none}.dark .moon{display:inline}
.out .cut{display:inline}
.out .gridnode{stroke:#FAA192;fill:#352A22}
.win{fill:#6B5240}
.dark .win{fill:#FFD28D;filter:drop-shadow(0 0 4px #FFC580)}
.stats{display:flex;flex-direction:column;gap:10px}
.lead{font:400 30px/1.12 'Instrument Serif',Georgia,serif}
.leadsub{font:400 15px/1.45 'DM Sans',system-ui,sans-serif;color:var(--muted);margin-top:4px}
.stat{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font:500 15px 'DM Sans',system-ui,sans-serif;color:var(--muted)}
.stat b{font:700 17px 'DM Sans',system-ui,sans-serif;color:var(--ink)}
.bigbtn{height:56px;border-radius:28px;border:none;background:var(--urg);color:#fff;font:700 16px 'DM Sans',system-ui,sans-serif;cursor:pointer;margin-top:6px}
.bigbtn.ink{background:var(--btn);color:var(--btnInk)}
/* plants sheet */
.psb{grid-template-columns:1fr 330px}
.plist{display:flex;flex-direction:column}
.prow{flex:1;display:grid;grid-template-columns:34px 1fr 210px 52px 76px 104px;align-items:center;gap:14px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.stopn{width:28px;height:28px;border-radius:50%;background:var(--urg);color:#fff;font:700 13px/28px 'DM Sans',system-ui,sans-serif;text-align:center}
.okdot{width:12px;height:12px;border-radius:50%;background:#9BC096;margin-left:8px}
.dark .okdot{background:#5E8A5A}
.wet .okdot{background:#8EC3CF}
.pname b{display:block;font:600 18px 'DM Sans',system-ui,sans-serif}
.pname span{display:block;font:400 13px 'DM Sans',system-ui,sans-serif;color:var(--muted);margin-top:2px}
.meter{position:relative;height:8px;border-radius:8px;background:var(--soft);overflow:hidden}
.mfill{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:#7FAE79;transition:width .6s}
.mtick{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.5}
.dry .mfill{background:var(--urg)}.wet .mfill{background:#6FB0C2}
.ppct{font:700 18px 'DM Sans',system-ui,sans-serif;text-align:right}
.pst{font:600 13px 'DM Sans',system-ui,sans-serif;color:var(--muted)}
.dry .ppct,.dry .pst{color:var(--urg)}
.wbtn{height:44px;border-radius:22px;border:none;background:var(--btn);color:var(--btnInk);font:700 14px 'DM Sans',system-ui,sans-serif;cursor:pointer}
.rcol{display:flex;flex-direction:column;gap:10px;padding:22px;border-radius:26px;background:var(--soft)}
.rstop{display:flex;align-items:center;gap:12px;font:600 16px 'DM Sans',system-ui,sans-serif}
.rstop .rp{margin-left:auto;font:500 14px 'DM Sans',system-ui,sans-serif;color:var(--muted)}
.note{font:400 13px/1.5 'DM Sans',system-ui,sans-serif;color:var(--muted);margin-top:auto}
/* home sheet */
.hsb{grid-template-columns:1.1fr 1.3fr 1fr}
.hpanel{padding:22px 24px;border-radius:26px;background:var(--soft);display:flex;flex-direction:column}
.thermo{display:flex;align-items:center;justify-content:center;gap:22px;margin:auto 0}
.tbtn{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:400 30px/1 'DM Sans',system-ui,sans-serif;cursor:pointer;padding:0}
.tset{font:400 96px/1 'Instrument Serif',Georgia,serif}
.csub{font:500 14px 'DM Sans',system-ui,sans-serif;color:var(--muted);text-align:center}
.lights{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.lp{height:64px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 17px 'DM Sans',system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;gap:12px;padding:0 18px}
.lp i{width:14px;height:14px;border-radius:50%;background:var(--line);display:block}
.lp small{margin-left:auto;font:600 13px 'DM Sans',system-ui,sans-serif;color:var(--muted)}
.lights.many{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lights.many .lp{height:50px;font-size:15px;padding:0 12px;gap:8px;border-radius:16px}
.lights.many .lp i{width:11px;height:11px;flex:none}
.lights.many .lp small{font-size:12px;white-space:nowrap}
.lp.on{border-color:#D8953F}
.lp.on i{background:#F0A54E;box-shadow:0 0 12px #F0A54E}
.zone{padding:12px 0;border-bottom:1px solid var(--line)}
.zone b{display:block;font:600 17px 'DM Sans',system-ui,sans-serif}
.zone span{display:block;font:400 14px 'DM Sans',system-ui,sans-serif;color:var(--muted);margin-top:3px}
.zbtn{margin-top:10px;height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px 'DM Sans',system-ui,sans-serif;cursor:pointer}
.cam{margin-top:auto;height:56px;border-radius:28px;border:none;background:var(--btn);color:var(--btnInk);font:700 15px 'DM Sans',system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.toast{position:absolute;left:50%;top:34px;transform:translateX(-50%);z-index:30;padding:13px 22px;border-radius:24px;background:var(--btn);color:var(--btnInk);font:600 14px 'DM Sans',system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toastin .35s ease-out;white-space:nowrap}
@keyframes toastin{0%{opacity:0;transform:translate(-50%,-10px)}100%{opacity:1;transform:translate(-50%,0)}}
.app.night{--bg:#0B0F12;--glow:#141B1E}
.night .pebs{opacity:.3}
.night .top{opacity:.55}
.night .pikbtn{transform:scale(.84)}
.pikbtn{transition:transform .6s}
.night .bubble:not(.urgent){opacity:.72}
.night .top .clock{color:var(--muted)}
.night .pik{filter:brightness(.8)}
@media (prefers-reduced-motion: reduce){.flow .pk,.dots i,.sheet,.scrim{animation:none!important}}
/* Pik */
.pik svg{display:block;overflow:visible}
.pik .ring{fill:none;stroke:#A99070;stroke-width:1.45;opacity:.58;transform-origin:128px 128px;transition:stroke .4s,opacity .4s,stroke-width .4s}
.pik .hs{stop-color:#A99070;transition:stop-color .5s}
.pik .mute,.pik .badge2{opacity:0;transition:opacity .4s}
.pik .light{transition:opacity .4s}
.pik .f{opacity:0;transition:opacity .28s}
.pik .body{transform-origin:128px 128px}
.pik .mouth{transform-origin:135px 145px}
.p-rest .f-rest,.p-listen .f-listen,.p-think .f-think,.p-speak .f-speak,.p-muted .f-muted,.p-alert .f-alert{opacity:1}
.p-listen .ring{stroke:#ADDFB9;stroke-width:2.4;opacity:.96;animation:pkPulse 1.8s ease-in-out infinite}
.p-listen .hs{stop-color:#ADDFB9}
.p-think .ring{stroke:#C1AFF6;opacity:.96;stroke-dasharray:1 9;stroke-linecap:round;animation:pkSpin 8s linear infinite}
.p-think .hs{stop-color:#C1AFF6}
.p-speak .ring{stroke:#FFD28D;stroke-width:2.4;opacity:.96}
.p-speak .hs{stop-color:#FFD28D}
.p-speak .body{animation:pkBob 1.6s ease-in-out infinite}
.p-speak .mouth{animation:pkTalk .34s ease-in-out infinite alternate}
.p-muted .ring{stroke:#A9AAA1;opacity:.96;stroke-dasharray:4 8}
.p-muted .hs{stop-color:#A9AAA1}
.p-muted .mute,.p-muted .badge2{opacity:1}
.p-muted .light{opacity:.4}
.p-alert .ring{stroke:#FF8F6B;stroke-width:2.8;opacity:1;animation:pkPulse 1.1s ease-in-out infinite}
.p-alert .hs{stop-color:#FF8F6B}
@keyframes pkPulse{0%,100%{transform:scale(1);opacity:.96}50%{transform:scale(1.045);opacity:.5}}
@keyframes pkSpin{to{transform:rotate(360deg)}}
@keyframes pkBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes pkTalk{from{transform:scaleY(.35)}to{transform:scaleY(1.1)}}
@media (prefers-reduced-motion: reduce){.pik *{animation:none!important}}

.blk.done .btick{text-decoration:none}
/* ---------- one page (v3 design) ---------- */
.op{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden}
.op header{position:relative;flex:none}
.hd{height:74px;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(243,236,224,.95)}
.hd .clock{white-space:nowrap}
.ttl{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.ttl b{font:600 16px 'DM Sans',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ringbar{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:var(--btn);color:var(--btnInk);border-radius:18px;padding:7px 8px 7px 16px;animation:rgp 1.2s ease-in-out infinite}
.ringbar b{color:#F3D9A8;font-variant-numeric:tabular-nums;white-space:nowrap}
.ringbar span{flex:1;font-size:14.5px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ringbar small{color:#E2CFB0;white-space:nowrap;font-size:12.5px}
.ringbar button{height:40px;padding:0 18px;border-radius:20px;border:0;background:var(--btnInk);color:var(--ink);font-weight:700;font-size:14px;white-space:nowrap;cursor:pointer}
@keyframes rgp{0%,100%{box-shadow:0 0 0 0 rgba(201,138,58,0)}50%{box-shadow:0 0 0 5px rgba(201,138,58,.45)}}
.tkb{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px 0 8px;border-radius:25px;background:var(--card);border:1px solid var(--line);white-space:nowrap;cursor:pointer}
.tkb .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 12px 'DM Sans',sans-serif}
.dot.hot{background:var(--temp)}.dot.warn{background:var(--chk)}.dot.ok{background:var(--done)}.dot.off{background:#9C8B78}
.tkb .t{display:flex;flex-direction:column;line-height:1.2;text-align:left}.tkb .t b{font-size:14px}.tkb .t span{font-size:12px;color:var(--muted)}
.ico{width:46px;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:18px;cursor:pointer;flex:none}
.ico.off{background:var(--soft);color:#9C8B78}
.ibtn{height:46px;padding:0 18px;border-radius:23px;border:1px solid var(--btn);background:var(--btn);color:var(--btnInk);font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer;flex:none}
.cdn{text-align:right;white-space:nowrap}.cdn .big{font:400 30px/1 'Instrument Serif',Georgia,serif}
.stn{min-height:100px;display:grid;grid-template-columns:200px 250px 1fr;gap:10px;padding:10px 22px;flex:none;border-bottom:1px solid var(--line)}
.sn{border-radius:16px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);padding:9px 12px;display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left}
.sn.smoker{border-left-color:var(--smoker)}.sn.oven{border-left-color:var(--oven)}
.sn.idle{opacity:.6;border-left-color:var(--line)}
.sn b{font-size:14.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sn i{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp{font:700 12px 'DM Sans',sans-serif;color:var(--oven);letter-spacing:0;text-transform:none}
.stovebox{border-radius:16px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--stove);padding:8px 10px 8px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.burners{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:1}
.bn{display:flex;gap:7px;align-items:flex-start;border-radius:11px;padding:5px 7px;background:#F6EEE2;min-width:0}
.bn.free{background:transparent;border:1px dashed var(--line)}
.bn div{display:flex;flex-direction:column;min-width:0}
.bn b{font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bn i{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bdy{flex:1;display:grid;grid-template-columns:1fr 330px;gap:18px;padding:14px 22px 10px;min-height:0}
.lc{display:flex;flex-direction:column;min-height:0;gap:8px}
.rc{display:flex;flex-direction:column;min-height:0;gap:12px}
.nowh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nowh h2{font-size:34px;margin:0;line-height:1;white-space:nowrap}
.prev{font-size:13px;color:var(--muted)}
.tlist{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0;flex:1;padding-bottom:4px}
.tc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:11px 12px 11px 14px;display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:start}
.tc.due{background:linear-gradient(90deg,#FFF3DF,var(--card) 60%);border-color:#EBCB98}
.tc.ringing{border:2px solid var(--chk);animation:rgp 1.2s ease-in-out infinite}
.tc.done{opacity:.72;padding-top:6px;padding-bottom:6px;align-items:center}.tc.done .x{text-decoration:line-through;font-size:14.5px}.tc.done .meta{display:none}
/* time cells: .tt (the page's old .tm is the timer pill) */
.tc .tt{font:700 16px 'DM Sans',sans-serif;font-variant-numeric:tabular-nums;padding-top:2px}
.tc .x{font-size:17px;line-height:1.35}
.tc .meta{margin-top:6px;font-size:12.5px;color:var(--muted)}
.tc .acts{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;max-width:none}
.sb{height:38px;padding:0 13px;border-radius:19px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;cursor:pointer}
.sb.chk{border-color:var(--chk);color:#8A5A1C;background:var(--chkBg)}.sb.dn{border-color:var(--done);color:var(--done);background:var(--doneBg)}.sb.tp{border-color:var(--temp);color:var(--temp);background:var(--tempBg)}
.sb.run{background:var(--btn);color:var(--btnInk);border-color:var(--btn)}
.sb.rang{background:var(--urg);color:#fff;border-color:var(--urg)}
.sb.ink{background:var(--btn);color:var(--btnInk);border-color:var(--btn)}
.tc .tick{width:38px;height:38px}
.tc.done .tick{width:30px;height:30px}
.how{grid-column:2 / 4;border-top:1px dashed var(--line);padding-top:10px;margin-top:2px;display:grid;grid-template-columns:1fr 260px;gap:18px}
.how p{margin:4px 0 0;font-size:15.5px;line-height:1.45}
.snav{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.pips{display:flex;gap:4px;margin-left:4px}.pips i{width:8px;height:8px;border-radius:50%;background:var(--line)}.pips i.on{background:var(--ink)}.pips i.past{background:#B8A58C}
.hing{max-height:190px;overflow:auto;border-left:1px solid var(--line);padding-left:14px}
.hing .ig{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;margin-top:5px}
.hing .ig b{white-space:nowrap;font-variant-numeric:tabular-nums}
.hing .ig .sec{grid-column:1 / 3;font:700 10px 'DM Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.how .lnk{font-weight:700;font-size:13px;text-decoration:underline;cursor:pointer;display:inline-block;margin-top:8px;background:none;border:0;padding:0}
.nextbox{flex:none;border-top:1px solid var(--line);padding-top:6px}
.nx{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:center;padding:5px 14px;font-size:15px}
.nx .tt{font:700 14px 'DM Sans',sans-serif;color:var(--muted);font-variant-numeric:tabular-nums}
.nx span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.earl summary{font-size:13px;color:var(--muted);cursor:pointer;padding:0 2px}
.rcard2{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:13px 16px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.tnone{margin:6px 0 0;font:500 13px 'DM Sans',sans-serif;color:var(--muted)}
.tg{display:grid;grid-template-columns:1fr auto;gap:2px 6px;align-items:center;padding:6px 8px 6px 10px;border-radius:12px;background:#F6EEE2;min-width:0}
.tg.ring{background:var(--urg);color:#fff}
.tg .l{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;grid-column:1 / 3}
.tg .tl{font:700 19px 'DM Sans',sans-serif;font-variant-numeric:tabular-nums}
.tg .mini{display:flex;gap:4px;justify-content:flex-end}
.tg .mini button{height:26px;padding:0 8px;border-radius:13px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:11.5px;font-weight:600;cursor:pointer}
.tg .k{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.k.check{background:var(--chk)}.k.done{background:var(--done)}.k.temp{background:var(--temp)}.tg.ring .k{background:#fff}
.dcard{flex:1;min-height:0;display:flex;flex-direction:column}
.dlist{display:flex;flex-direction:column;margin-top:6px;overflow:auto;min-height:0}
.dr{display:grid;grid-template-columns:12px 1fr auto;gap:9px;align-items:center;padding:4px 2px;border-bottom:1px solid #F0E7DA;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;width:100%;cursor:pointer}
.dr:last-child{border-bottom:0}
.dr .sd{width:10px;height:10px;border-radius:50%}
.sd.wait{background:#D8C8B1}.sd.cold{background:var(--fridge)}.sd.act{background:var(--chk)}.sd.hot{background:var(--oven)}.sd.ok{background:var(--done)}
.dr b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.dr span.g{color:var(--done);font-weight:700}.dr span.w{color:#8A5A1C;font-weight:700}
.dr.tky{background:#FFF6E8;border-radius:8px;box-shadow:0 0 0 4px #FFF6E8;margin:4px 0;border-bottom:0}.dr.tky span{font-weight:700;color:#8A5A1C}
.dr.grp span{white-space:normal;max-width:none}
.hotbtn{height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--done);background:var(--doneBg);color:var(--done);font:700 12px 'DM Sans',sans-serif;cursor:pointer;white-space:nowrap}
.dkey{font-size:11.5px;color:var(--muted);margin-top:2px}
.rbn{height:56px;flex:none;display:flex;align-items:center;gap:14px;padding:0 22px;border-top:1px solid var(--line);background:rgba(243,236,224,.95)}
.rbn .days{display:flex;gap:4px}
.rbn .days button{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:12.5px;cursor:pointer}
.rbn .days button.on{background:var(--btn);color:var(--btnInk);border-color:var(--btn)}
.track{position:relative;flex:1;height:38px;cursor:pointer}
.track .ln{position:absolute;left:0;right:0;top:19px;height:2px;background:var(--line)}
.track .fh{position:absolute;top:13px;height:14px;background:#F3E0C2;border-radius:7px}
.track .hr{position:absolute;top:27px;font-size:10.5px;color:#9C8B78;transform:translateX(-50%);white-space:nowrap}
.track .d{position:absolute;top:14px;width:12px;height:12px;border-radius:50%;transform:translateX(-50%);border:2px solid var(--card)}
.d.smoker{background:var(--smoker)}.d.oven{background:var(--oven)}.d.stove{background:var(--stove)}.d.prep{background:var(--prep)}.d.fridge{background:var(--fridge)}
.d.past{opacity:.3}
.track .nowl{position:absolute;top:2px;bottom:0;width:2px;background:var(--urg)}
.track .nowl:before{content:'now';position:absolute;top:-2px;left:5px;font:700 10px 'DM Sans',sans-serif;color:var(--urg)}
.scrim2{position:absolute;inset:0;background:rgba(42,32,25,.35);z-index:38;border:0}
.psheet{position:absolute;left:30px;right:30px;top:20px;bottom:0;background:var(--card);border-radius:28px 28px 0 0;border:1px solid var(--line);z-index:40;padding:18px 26px 40px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.seg{display:flex;gap:4px;background:var(--soft);border-radius:20px;padding:3px;align-self:flex-start;flex-wrap:wrap}
.seg button{height:34px;padding:0 16px;border:0;border-radius:17px;background:transparent;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink)}
.tpop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100% - 40px));max-height:calc(100% - 30px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 60px -24px rgba(0,0,0,.45);z-index:40;padding:20px 22px 18px}
.tph{display:flex;align-items:flex-start;gap:14px}
.tph>div{flex:1;min-width:0}
.tph h3{margin:0;font-size:30px;font-weight:400;line-height:1.05}
.tph p{margin:4px 0 0;font-size:14px;color:var(--muted);line-height:1.35}
.tpn{margin:12px 0 0;font-size:13px;color:var(--muted);line-height:1.4;text-align:center}
.spots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.spots button{height:84px;border-radius:14px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.spots button.on{border:2px solid var(--ink)}
.spots b{font:400 30px/1 'Instrument Serif',serif}.spots span{font-size:12px;color:var(--muted)}.spots .sp{font:600 13px 'DM Sans',sans-serif;color:var(--ink)}
.spots button.ok{background:var(--doneBg);border-color:var(--done)}
.entry{margin-top:10px;height:52px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;font:700 26px 'DM Sans',sans-serif;font-variant-numeric:tabular-nums}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pad button{height:52px;border-radius:14px;border:1px solid var(--line);background:#fff;font:600 20px 'DM Sans',sans-serif;cursor:pointer}
.pad button.go{background:var(--btn);color:var(--btnInk);border-color:var(--btn);font-size:17px}
.entry .muted{font:500 15px 'DM Sans',sans-serif}
:host([layout=echo]) .rbn{display:none}

.stp{grid-column:2 / 4;border-top:1px dashed var(--line);padding-top:8px;margin-top:-2px}
.stp .sh{display:flex;align-items:center;gap:8px;font:700 11px 'DM Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stp .arr{margin-left:auto;display:flex;gap:6px}
.stp .ar{width:44px;height:36px;border-radius:18px;border:1px solid var(--line);background:var(--card);font:600 22px/1 'DM Sans',sans-serif;cursor:pointer;color:var(--ink)}
.stp .ar:disabled{opacity:.3;cursor:default}
.stp p{margin:6px 0 0;font-size:15.5px;line-height:1.45}
.dlink{border:0;background:none;padding:0;font:inherit;color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;cursor:pointer}
span.dlink{text-decoration:none;cursor:default}
.tc .nm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:700 19px/1.25 'DM Sans',sans-serif;min-height:36px}
.tc .nm .pips{display:inline-flex;gap:3px;align-items:center}.tc .nm .pips i{width:7px;height:7px;border-radius:50%;background:#E5D7C3}.tc .nm .pips i.past{background:#BFAE98}.tc .nm .pips i.part{background:#D9B98A}.tc .nm .pips i.on{background:var(--ink);width:9px;height:9px}
.tc .nm .arr{margin-left:auto;display:flex;gap:6px}.tc .nm .ar{width:44px;height:36px;border-radius:18px;border:1px solid var(--line);background:var(--card);font:600 22px/1 'DM Sans',sans-serif;cursor:pointer;color:var(--ink)}.tc .nm .ar:disabled{opacity:.3;cursor:default}
.rc3 .acts{align-self:start;padding-top:0}
.rc3 .stp{margin-top:0}
.tc .nm .sc{font:600 12px 'DM Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tc .nm+.x{margin-top:3px;font-size:15.5px;color:#4A3D31}
.tc .tt small{display:block;font:600 11px 'DM Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.tc.ahead{background:repeating-linear-gradient(135deg,var(--card),var(--card) 12px,#FBF5EC 12px,#FBF5EC 24px);border-style:dashed}
.tc.done .nm{font-size:15px}.tc.done .nxt{margin-top:3px;font-size:13.5px;color:var(--muted)}
.tc.done.late{opacity:.8}.tc.done.late .x{text-decoration:none}
.stp .sh{min-height:36px}
.sb.set{border-color:var(--chk);color:#8A5A1C;background:var(--chkBg)}
details.settings{margin-top:22px}
details.settings summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
details.settings .card{margin-top:10px;display:flex;flex-direction:column;gap:8px;max-width:640px}
details.settings p{margin:0}
details.settings textarea{width:100%;border-radius:14px;border:1px solid var(--line);padding:10px;font:12px monospace}
/* the step on the left, this step's ingredients in a column on the right */
.stp .sb2.two{display:grid;grid-template-columns:1fr 250px;gap:18px;align-items:start}
.stp .si{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;align-content:start;font-size:13.5px;line-height:1.35;border-left:1px solid var(--line);padding-left:14px;margin-top:6px}
.stp .si b{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tc.due .stp p{font-size:16px}
/* review 2: badges, estimates, reminders */
.tc .tt small.now{display:inline-block;margin-top:5px;padding:2px 9px;border-radius:10px;background:var(--btn);color:var(--btnInk);letter-spacing:.08em}
.tc .nm .est,.steps .est{font:600 12px 'DM Sans',sans-serif;font-style:normal;color:#6B5A48;background:var(--soft);border-radius:10px;padding:3px 9px;white-space:nowrap}
.tc.rem{padding-top:9px;padding-bottom:9px;align-items:center}.tc.rem .x{font-size:16.5px}
/* put on a burner / in the oven / on the smoker */
.pl{position:relative;width:46px;height:42px;border-radius:14px;border:1.5px solid var(--stove);background:var(--card);color:#8A5A1C;cursor:pointer;display:grid;place-items:center;padding:0;flex:none}
.pl svg{width:24px;height:24px}
.pl.on{background:var(--btn);border-color:var(--btn);color:var(--btnInk)}.pl.on .pn{background:#C9822F}

.pl .bang{position:absolute;bottom:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--urg);color:#fff;font:800 12px/18px 'DM Sans',sans-serif;text-align:center;border:2px solid var(--card)}
.bn.plan{background:transparent;border:1px dashed var(--stove);opacity:.75}.bn.plan b{font-style:italic;font-weight:600}
.bn.on{background:#F8E6CC}
.bn.clash{background:#FDE4DA;border:1px solid var(--urg)}.bn i.w{color:var(--urg);font-weight:700}
.sn b.pl8{font-style:italic;opacity:.65}
.bpick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.bpick button{position:relative;height:96px;border-radius:14px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:14px 4px 6px}
.bpick button:disabled{opacity:.55;cursor:default;background:var(--soft)}
.bpick b{font-size:14px}.bpick span{font-size:11.5px;color:var(--muted);text-align:center}
.tpop.pick{width:min(560px,calc(100% - 40px))}
/* one emblem everywhere: station icon + a notification-style number badge in the top-right corner */
.ic{position:relative;display:inline-grid;place-items:center;width:28px;height:28px;flex:none;color:var(--stove)}
.ic svg{width:100%;height:100%}
.ic .pn{position:absolute;top:-6px;right:-8px;min-width:17px;height:17px;border-radius:9px;background:#E5484D;color:#fff;font:700 10.5px/17px 'DM Sans',sans-serif;text-align:center;padding:0 4px;border:2px solid var(--card);box-sizing:border-box}
.pl .ic{width:26px;height:26px;color:inherit}
.pl .ic .pn{top:-14px;right:-16px;min-width:20px;height:20px;line-height:16px;font-size:11.5px}
.pl.busy .ic .pn{background:#B9A48A}
.pl .bang{bottom:-7px;right:-7px}
.bn{align-items:center}.bn .ic{width:26px;height:26px;margin:0 4px 0 1px}
.bn.free .ic{color:#C9B79E}.bn.plan .ic{opacity:.7}.bn.on .ic{color:#8A5A1C}.bn.on .ic .pn,.bn.clash .ic .pn{background:#E5484D}

/* time cell: the time, then its badge underneath, both flush left with room to breathe */

/* ===== design pass: calmer surfaces, one meaning per color, bigger step text ===== */
/* colors: amber = now / in progress, red = a problem, green = done. Nothing else carries meaning. */
.op{--amber:#C9822F;--amberInk:#7A4E17;--amberBg:#FBEBD3;--amberBg2:#FFF4E4;--shadow:0 1px 2px rgba(60,40,20,.06),0 3px 10px rgba(60,40,20,.05)}
/* cards: no outlines, soft shading; "now" cards are warm with an amber edge */
.tc{border:0;box-shadow:var(--shadow);border-radius:18px}

\xB7 dinner for 7 at 4:00 PM",tz:"-08:00",dinner:"2026-11-26T16:00:00-08:00",days:{tue:"2026-11-24",wed:"2026-11-25",thu:"2026-11-26"},dayNames:{tue:"Tuesday night",wed:"Wednesday",thu:"Thursday"},recipes:[{id:"eggs",n:1,name:"Dijon deviled eggs with crisp prosciutto and chives",tag:"Family recipe",gf:"Gluten-free",yield:"16 halves",active:"35 min",passive:"35 min (boil, ice bath)",src:null,equip:["Saucepan with lid","Bowl of ice water","Small bowl and fork","Piping bag or zip-top bag","Skillet and paper towels (prosciutto)","Egg plate or platter"],ingr:[["8","large eggs"],["\xBC cup","mayonnaise"],["2 tsp","Dijon mustard"],["1 splash","apple cider vinegar","about \xBD tsp; family recipe says a splash"],["\u22482 oz","prosciutto","amount is our suggestion for 16 halves"],["2 tbsp","fresh chives, finely chopped"]],done:"Yolks fully set and pale yellow all the way through. Prosciutto is crisp when it snaps after cooling.",ahead:"Boil, peel and make the filling Wednesday. Keep whites and filling separate, covered, in the fridge. Crisp the prosciutto Thursday morning.",store:"Filling and whites: fridge up to 2 days. Assembled eggs go back in the fridge within 2 hours of coming out. Prosciutto: airtight at room temperature, same day.",steps:[{d:"wed",t:"Put eggs in the saucepan, cover with cold water by an inch, and bring to a boil over high heat.",min:2,tm:["Eggs: water boiling?",10,"check"],ing:[[0]]},{d:"wed",t:"As soon as it boils, cover, turn off the heat and let the eggs sit. At Reno's elevation this takes a little longer: check one egg.",min:1,tm:["Eggs: check one egg",14,"check"],ing:[]},{d:"wed",t:"Move eggs to ice water until cold.",min:2,tm:["Eggs: cooled",10,"done"],ing:[]},{d:"wed",t:"Peel, halve lengthwise, and pop the yolks into a bowl. Cover the whites and refrigerate.",min:15,ing:[]},{d:"wed",t:"Mash yolks with the mayo, Dijon and a splash of cider vinegar until smooth. Taste. Spoon into the piping bag, seal, refrigerate.",min:10,ing:[[1],[2],[3]]},{d:"t old in about three-quarters of the roe with a spatula. Scrape into the serving bowl, cover, refrigerate. Keep the rest of the roe cold.",min:5,ing:[[8,"\u2248\xBE","salmon roe (keep the rest cold)"]]},{d:"thu",t:"2:30 PM: top with the remaining roe and dill sprigs. Serve with chips.",min:3,ing:[[8,"the rest","salmon roe"],[3,"","dill sprigs"],[9]]}]},{id:"turkey",n:3,name:"Smoked spatchcock turkey with garlic-herb butter",tag:"smoking-meat.com, adapted",gf:"Gluten-free",yield:"17.6-lb bird, dinner for 7 plus leftovers",active:"1 hr 30 min over 3 days",passive:"\u224811\xBD hr brine, overnight drying, \u22483\xBD\u20134\xBD hr smoke, 30\u201345 min rest",src:["Jeff Phillips, smoking-meat.com","https://www.smoking-meat.com/spatchcocked-turkey-with-herbed-butter"],equip:["Poultry shears and a big cutting board","Brining bag (from the Kinder's kit) set inside a container or cooler","Rimmed baking sheet with a rack (drying, carrying)","Disposable deep roaster as a drip pan under the grate","Leave-in probe + instant-read thermometer","Foil, paper towels","Carving board with a groove","Fat separator (optional, for drippings)"],ingr:[["\u2014","Brine, per gallon (make enough to cover: about 2 gallons spatchcocked, 3 if it goes in whole)"],["1 gal","cold water"],["230 g","Himalayan salt (weigh it)","on your kitchen scale; matches the recipe's 1 cup coarse kosher salt"],["\xBE cup","brown sugar"],["\u2014","Garlic-herb butter (the recipe's)"],["8 tbsp","unsalted butter, softened"],["\xBC cup each","chopped fresh parsley, thyme, chives, sage, and onion"],["5","garlic cloves, minced"],["2 tbsp","homemade rub (below)"],["\u2014","Homemade salt-free rub (your choice)"],["2 tbsp","paprika"],["2 tbsp","garlic powder"],["2 tbsp","onion powder"],["1 tbsp","black pepper"],["1 tbsp","dried thyme"],["","2 tbsp go in the butter; the rest goes lightly on the outside"]],done:"USDA: 165\xB0F in all three places: thickest part of the breast, innermost thigh, innermost wing. The recipe's 160\xB0F breast target is overridden. Log readings on the Turkey tab.",ahead:"Spatchcock and brine Tuesday night; dry uncovered in the fridge Wednesday to Thursday morning. Butter and rub Wednesday.",store:"Carve the rest off the bone, into shallow containers, in the fridge within 2 hours of serving. Eat within 3\u20134 days; reheat to 165\xB0F.",flags:[["note","Rub and bag","Homemade salt-free rub only: no commercial rub, no Kinder's seasoning packets. The Kinder's bag is a brining bag, not an oven bag. Butter stays at one stick even though the bird is bigger than the recipe's."],["conf","Read the label first","If it says enhanced, basted, self-basting or kosher, or lists a salt solution, the turkey is already salted. Skip the brine: pat it dry and keep it uncovered on the rack in the fridge until Thursday."],["note","Brine strength",`Your first salt brine (last year was buttermilk), so this uses the recipe's brine: 230 g per gallon, the usual reading of its "1 cup coarse kosher". It brines about 11\xBD hours (in at 9:30 PM Tuesday, out at 9 AM Wednesday) instead of the recipe's 10, so expect it a touch saltier. Weigh the salt on your kitchen scale. The drippings will be saltier than last year's, so taste before they go in the gravy.`]],steps:[{d:"tue",t:"8:30 PM: unwrap. Pull out the neck and giblets and any pop-up timer or leg clip; keep the neck in the fridge for the gravy. Make sure it's fully thawed (no ice inside). Read the label: if it says enhanced, basted, self-basting or kosher, or lists a salt solution, it's already salted: skip the brine (tick off the brine steps), pat it dry and keep it uncovered on the rack in the fridge until Thursday.",min:10,ing:[]},{d:"tue",t:"Mix brine: for each gallon, dissolve 230 g salt and \xBE cup brown sugar in 1 quart hot water, then add 3 quarts cold water and ice. It must be 40\xB0F or colder before the turkey goes in.",min:15,ing:[[1],[2],[3]]},{d:"tue",t:"Spatchcock: breast down, cut along both sides of the backbone with shears and remove it. Flip, press firmly on the breastbone to flatten.",min:15,ing:[]},{d:"tue",t:"9:30 PM: turkey into the brining bag, brine over it until covered, seal, into the fridge or a cooler packed with ice (check it stays at or below 40\xB0F).",min:10,tm:["Turkey: out of the brine",690,"done"],ing:[]},{d:"wed",t:"9:00 AM: lift the turkey out and discard the brine. If it went into the brine whole, spatchcock it now. Feel the cavity and thighs for ice; a little is fine, it has a full day in the fridge to finish thawing. Pat completely dry, including under the wings. Set skin-up on the rack over the sheet and refrigerate uncovered until Thursday morning.",min:10,ing:[]},{d:"wed",t:"5:00 PM: make the rub. Mash the butter with parsley, thyme, chives, sage, onion, garlic and 2 tbsp rub. Cover and refrigerate.",min:15,ing:[[10],[11],[12],[13],[14],[8,"2 tbsp","of that rub, into the butter"],[5],[6],[7]]},{d:"thu",t:"9:00 AM: take the herb butter out to soften.",min:1,ing:[[5,"","herb butter (made Wednesday)"]]},{d:"thu",t:"9:15 AM: fill the pellet hopper and start the smoker at 250\xB0F. Feel inside the cavity and the thickest part of the thighs: any ice left means a longer cook, so put it on as soon as the smoker reads 250\xB0F. Load the turkey only once the smoker reads 250\xB0F.",min:5,tm:["Smoker at 250\xB0F?",20,"check"],ing:[]},{d:"thu",t:"9:25 AM: loosen the skin over breast, thighs and legs with your fingers. Push all the herb butter under the skin and spread it flat. Dust the outside lightly with the remaining rub.",min:15,ing:[[5,"all","herb butter"],[15,"the rest","homemade rub, lightly on the outside"]]},{d:"thu",t:"10:00 AM: turkey on the grate skin-side up, drip pan underneath. Probe in the innermost thigh, not touching bone.",min:5,tm:["Turkey: first temperature check",60,"temp"],ing:[]},{d:"thu",t:"Check and log the probe every hour; add pellets as needed.",min:2,tm:["Turkey: temperature check",60,"temp"],ing:[]},{d:"thu",t:"About 12:30 PM (or once ring it to a full boil.",store:"Leftovers: fridge within 2 hours, 3\u20134 days; reheat to a rolling boil.",flags:[["note","Drippings","Skim the fat, then taste before measuring them in. If they're very salty, use less and make up the difference with broth."]],steps:[{d:"wed",t:"6:30 PM (burner 4): melt the butter over medium, whisk in the gluten-free flour, and cook 1 minute.",min:3,tm:["Gravy base: roux 1 minute",1,"check"],ing:[[0],[1]]},{d:"wed",t:"Gradually whisk in the 2 cups of broth. Bring to a boil, then simmer, stirring, until it's thick enough to coat a spoon. It should be thicker than gravy: Thursday's drippings thin it.",min:5,tm:["Gravy base: thickened?",5,"check"],ing:[[3]]},{d:"wed",t:"Stir in the thyme and sage; simmer 5 more minutes. No salt yet: the drippings are salty from the brine.",min:2,tm:["Gravy base: herbs simmered",5,"check"],ing:[[4]]},{d:"wed",t:'Pour into a shallow container; cool up to 30 minutes, then cover and refrigerate. Label it "Gravy base \xB7 Thu 2:50".',min:5,ing:[]},{d:"thu",t:"2:45 PM: pour the drippings into the fat separator. Taste them.",min:5,ing:[[2]]},{d:"thu",t:"2:50 PM (burner 4): gravy base into the saucepan over medium; whisk as it melts and loosens. Whisk in the drippings, less if they're very salty (short on drippings? make it up with broth).",min:5,ing:[[2],[3,"1 cup","broth, only if the drippings are short"]]},{d:"thu",t:"Bring it to a full boil, stirring, then simmer 3\u20135 minutes. Loosen with broth if it's thick; season to taste.",min:5,tm:["Gravy: boiled and tasted?",5,"check"],ing:[[3,"as needed","broth, to loosen"],[5]]},{d:"thu",t:"Hold on the lowest heat, stirring now and then.",min:2,ing:[]},{d:"thu",t:"3:50 PM: into the gravy boat. Served separately.",min:2,ing:[]}]},{id:"stuffing",n:5,name:"Great-Grandma Pesch's sage stuffing",tag:"Family recipe \xB7 non-negotiable",gf:"Gluten-free",yield:"One large buttered casserole",active:"50 min",passive:"Bread drying whole on the counter (\u224848 hr); \u224855 min bake",equip:["Large skillet","Very large bowl","Buttered casserole (your own; deep 13\xD79 or larger)","Foil","Instant-read thermometer"],ingr:[["2 loaves","Carbonaut white gluten-free bread","dried whole, then broken into pieces Thursday"],["2 sticks","butter (16 tbsp)","plus a little for the dish"],["\xBD\u20131 cup","onion, minced"],["\xBD\u20131 cup","celery, minced"],["\u2248\xBC lb","chicken hearts, minced","our practical estimate (\u22488\u201310 hearts), not a family measurement. Hearts only; no gizzards."],["\u2248\xBC lb","chicken liver, minced","our practical estimate (\u22482\u20133 livers), not a family measurement"],["to moisten","chicken broth","add gradually by how the bread absorbs it. 4\u20136 cups is the shopping allowance, not a pour."],["to taste","dried parsley, dried sage, salt"]],done:"Center reads 165\xB0F (USDA) and the top is crisp at the edges.",ahead:"The loaves dry whole on the counter from Tuesday night to Thursday (about 48 hours), then get broken into pieces. Wednesday: cook the butter, onion, celery and organs (the 'wet' mix) and refrigerate. Combine with bread and broth only right before baking: USDA says never refrigerate mixed, uncooked stuffing.",store:"Leftovers in shallow containers within 2 hours; fridge 3\u20134 days; reheat to 165\xB0F.",flags:[["jc","Our estimate, not the family's","The family recipe gives no organ amounts. About \xBC lb each of hearts and liver is our practical starting point; adjust to taste. Broth goes in gradually."],["jc","Bake time and temperature","The family recipe doesn't say. We scheduled 350\xB0F: \u224835 min covered, then \u224820 uncovered, until the center reads 165\xB0F."]],steps:[{d:"tue",t:"9:00 PM: take both loaves out of their bags and leave them out on the counter, uncovered, to dry whole until Thursday (about 48 hours).",min:2,ing:[[0]]},{d:"wed",t:"11:00 AM: melt the butter; cook onion and celery until soft.",min:10,tm:["Onion & celery soft?",8,"check"],ing:[[1],[2],[3]]},{d:"wed",t:"Add the minced hearts and liver and cook until no pink remains and the largest piece reads 165\xB0F. Season with dried parsley, sage and salt. Cool in a shallow container; refrigerate.",min:10,ing:[[4],[5],[7]]},{d:"thu",t:"1:30 PM: break the dried loaves into bite-size pieces into the big bowl.",min:10,ing:[[0,"2 loaves","bread, dried whole"]]},{d:"thu",t:"1:30 PM: warm the wet mix gently until the butter melts.",min:5,ing:[]},{d:"thu",t:"1:45 PM: in the big bowl, toss bread with the wet mix. Add broth a cup at a time until evenly moist. Taste for salt. Pack into the buttered casserole; cover with foil.",min:15,ing:[[0,"","the broken bread"],[6,"a cup at a time","chicken broth"],[1,"a little","butter, for the dish"],[7,"","dried parsley, dried sage, salt"]]},{d:"thu",t:"2:05 PM: bake at 350\xB0F, covered.",min:2,tm:["Stuffing: uncover",35,"done"],ing:[]},{d:"thu",t:"2:40 PM: uncover and bake until the center reads 165\xB0F and the top crisps.",min:2,tm:["Stuffing: check center 165\xB0F",20,"check"],ing:[]},{d:"thu",t:"3:00 PM: out, covered, into the smoker hot hold (200\u2013225\xB0F). Check it reads 140\xB0F or hotter at 3:30 and 3:50.",min:3,ing:[]}]},{id:"gbc",n:6,name:"Kenji's green bean casserole",tag:"Serious Eats, adapted",gf:"Not gluten-free (crispy onions)",yield:"One 13\xD79 pan",active:"45 min",passive:"\u224840 min bake from cold",src:["Serious Eats","https://www.seriouseats.com/homemade-green-bean-casserole-recipe"],equip:["Large pot","Colander","Ice-bath bowl","Large skillet","13\xD79 baking dish (disposable, on a sheet pan)","Foil"],ingr:[["2 lb","green beans, trimmed"],["1\xBD lb","mushrooms (purchased sliced)","chop smaller if you like"],["2 tbsp","butter"],["2 tbsp","neutral oil","replaces the fried-shallot oil"],["2","garlic cloves, minced"],["\xBC cup","gluten-free flour"],["2 cups","broth"],["1\xBD cups","cream"],["1 tsp","dark soy sauce","the recipe's 2 tsp is for regular soy; dark is stronger, so start with half and taste"],["2 tsp", *{box-sizing:border-box}
button{font:inherit;color:inherit}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.eb{font:700 11px/1.2 'DM Sans',system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1280px;margin:0 auto;padding:18px 28px 28px;min-height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:flex-end;gap:16px;margin-bottom:14px}
.ti{display:flex;flex-direction:column;gap:2px}
h1{margin:0;font-size:46px;line-height:1}
.sub{color:var(--muted);font-size:15px}
.acts{margin-left:auto;display:flex;align-items:center;gap:10px}
.cf{font-weight:600;font-size:14px}
.btn{height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px;cursor:pointer}
.btn.ink{background:var(--btn);color:var(--btnInk);border-color:var(--btn)}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.ico{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-size:18px;cursor:pointer}
.ico.off{background:var(--soft)}
.banner{display:flex;align-items:center;gap:14px;background:var(--amberBg);border-radius:18px;padding:12px 14px 12px 20px;margin-bottom:14px;font-weight:600;font-size:16px}
.banner span{flex:1}
.grid{flex:1;display:grid;gap:16px;grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(0,1fr)}
.grid.g1{grid-template-columns:1fr}
.tile{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:18px 22px 18px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-height:250px;position:relative;border:2px solid transparent}
.th{display:flex;align-items:center;gap:12px}
.em{position:relative;width:34px;height:34px;color:var(--smoke);flex:none}
.em svg{width:100%;height:100%;display:block}
.pn{position:absolute;top:-6px;right:-8px;min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;font:700 11px/19px 'DM Sans',sans-serif;text-align:center;padding:0 5px;box-shadow:0 0 0 2px var(--card)}
.nm{font-weight:700;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nm.none{color:var(--muted);font-weight:600}
.word{margin-left:auto;flex:none;height:28px;line-height:28px;padding:0 12px;border-radius:14px;font-weight:700;font-size:13px;background:var(--soft);color:var(--muted)}
.mid{display:flex;align-items:flex-end;gap:14px}
.temp{font-size:84px;line-height:.9;letter-spacing:-.01em}
.temp small{font:600 18px 'DM Sans',sans-serif;color:var(--muted);margin-left:4px;vertical-align:top;position:relative;top:10px}
.tg{margin-left:auto;text-align:right;display:flex;flex-direction:column;gap:2px;padding-bottom:6px}
.tg b{font:400 34px/1 'Instrument Serif',Georgia,serif}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--amber)}
.spark{width:100%;flex:1;min-height:36px;height:46px;display:block}
.spark .ln2{fill:none;stroke:var(--smoke);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round;opacity:.75}
.spark .tl{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4;vector-effect:non-scaling-stroke;opacity:.6}
.ln{font-size:15px;line-height:1.4;color:var(--ink);margin-top:auto}
.got{position:absolute;right:20px;bottom:16px}
.tile.done .ln{padding-right:110px}
/* one meaning per color: amber = close / watch, red = problem, green = done */
.tile.off,.tile.idle{background:#FBF6EC}
.tile.off .temp,.tile.idle .temp{color:var(--muted)}
.tile.warn{border-color:var(--amber)}.tile.warn .word{background:var(--amberBg);color:var(--amberInk)}
.tile.stall .word{background:var(--amberBg);color:var(--amberInk)}
.tile.bad{border-color:var(--red);background:#FFF6F2}.tile.bad .word{background:var(--red);color:#fff}
.tile.done{border-color:var(--green);background:#F6FAF2}.tile.done .word{background:var(--green);color:#fff}.tile.done .bar i{background:var(--green)}
.tile.ok .word{background:var(--greenBg);color:var(--green)}
/* editor */
.scrim{position:fixed;inset:0;background:rgba(42,32,25,.35);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{width:min(860px,100%);background:var(--card);border-radius:28px 28px 0 0;padding:22px 26px 24px;display:flex;flex-direction:column;gap:16px;max-height:92vh;overflow:auto}
.sh h2{margin:4px 0 0;font-size:34px}
.chips,.kinds{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:15px;cursor:pointer}
.chip.on{background:var(--btn);color:var(--btnInk);border-color:var(--btn)}
.txt{height:48px;border-radius:14px;border:1px solid var(--line);padding:0 16px;font:500 17px 'DM Sans',sans-serif;background:#fff}
.row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:52px;height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.stepper b{min-width:120px;text-align:center;font:400 30px 'Instrument Serif',Georgia,serif}
.foot{display:flex;gap:10px;align-items:center;padding-top:4px}
@media (max-width:760px){
  .wrap{padding:14px}
  header{flex-wrap:wrap}
  .acts{margin-left:0}
  .grid{grid-template-columns:1fr;grid-auto-rows:auto}
  .tile{min-height:0}
  .temp{font-size:64px}
}
@media (max-height:760px) and (min-width:761px){
  .tile{min-height:0;padding:14px 20px}
  .temp{font-size:68px}
  h1{font-size:38px}
}

:host{--bg:#F3ECE0;--ink:#2A2019;--muted:#7A6B5A;--card:#FFFBF4;--line:#E2D5C1;--soft:#EDE3D3;--btn:#2A2019;--btnInk:#FBF6EE;--green:#4F7A4A;--greenBg:#E4EEDD;--dry:#C2452F;--dryBg:#FBE7E1;
display:block;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;min-height:100%}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.wrap{position:relative;min-height:100vh;padding-bottom:60px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px 10px;max-width:1200px;margin:0 auto}
header h1{margin:0;font-size:40px;line-height:1}
.sub{color:var(--muted);font-size:14px}
nav{display:flex;gap:8px;padding:6px 24px 14px;max-width:1200px;margin:0 auto;overflow-x:auto}
.chip{flex:none;height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.chip b{font-weight:700;color:var(--muted)}
.chip i{font-style:normal;font-size:12px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--greenBg);color:var(--green)}
.chip.dry i{background:var(--dryBg);color:var(--dry)}
.chip.on{background:var(--btn);color:var(--btnInk);border-color:var(--btn)}.chip.on b{color:inherit}
main{max-width:1200px;margin:0 auto;padding:0 24px}
section{margin:6px 0 22px}
.gh{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.gh h2{margin:0;font:700 20px 'DM Sans',sans-serif}
.soil{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.soil.dry{color:var(--dry)}
.thr{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.thr .tb{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:none;color:inherit;font:700 15px/1 'DM Sans',sans-serif;cursor:pointer}
.bar{width:80px;height:8px;border-radius:4px;background:var(--soft);overflow:hidden;display:inline-block}
.bar i{display:block;height:100%;background:var(--green);border-radius:4px}
.soil.dry .bar i{background:var(--dry)}
.lnk{margin-left:auto;border:0;background:none;color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;padding:6px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0 0 10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.tile img,.tile .ph{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--soft)}
.ph,.tile .ph{display:flex;align-items:center;justify-content:center;color:#B7A68F;background:var(--soft)}
.ph svg{width:38%;height:38%}
.tn{font-weight:700;font-size:15px;line-height:1.25;padding:6px 10px 0}
.ts{font-size:12.5px;color:var(--muted);padding:0 10px;line-height:1.3}
.badge{position:absolute;top:8px;left:8px;font-size:11px;font-weight:800;letter-spacing:.04em;background:var(--btn);color:var(--btnInk);border-radius:9px;padding:3px 8px}
.tile.ind{border-color:var(--btn)}
.empty{color:var(--muted);font-size:14px;margin:0 0 6px}
.grid.past .tile{opacity:.6}
.pastsec .lnk{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.ink{background:var(--btn);color:var(--btnInk);border-color:var(--btn)}
.btn.sm{height:34px;padding:0 13px;font-size:13px}
.btn[disabled]{opacity:.6}
.scrim{position:fixed;inset:0;background:rgba(42,32,25,.35);z-index:30}
.sheet{position:fixed;z-index:31;top:50%;left:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:92vh;overflow:auto;background:var(--card);border-radius:24px;box-shadow:0 20px 60px rgba(42,32,25,.3)}
.sheet .x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:20px;border:0;background:rgba(255,251,244,.9);font-size:24px;cursor:pointer;z-index:2}
.big{width:100%;max-height:52vh;object-fit:cover;display:block}
.big.ph{height:220px}
.body{padding:18px 22px 22px}
.body h2{margin:0 0 10px;font-size:32px;line-height:1.1}
.row{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--soft);font-size:15px}
.row span{width:110px;flex:none;color:var(--muted)}
.muted{color:var(--muted);font-size:14px;line-height:1.45}
.eb{display:block;font:700 11px/1.2 'DM Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.hrow{display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0}
.hrow img,.ph.sm{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.cf{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.form label{display:flex;flex-direction:column;gap:5px;margin:10px 0;font-size:13px;font-weight:700;color:var(--muted)}
.form input:not([type=file]),.form select{height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 12px;font-size:16px;font-weight:500;color:var(--ink)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .two label{margin:0}
.form label.photo{flex-direction:row;align-items:center;gap:14px;cursor:pointer}
.form label.photo img,.form label.photo .ph{width:96px;height:96px;border-radius:16px;object-fit:cover;flex:none}
.form label.photo input{position:absolute;width:1px;height:1px;opacity:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--btn);color:var(--btnInk);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:40;max-width:90vw}
@media (max-width:600px){header{padding:14px 14px 6px}header h1{font-size:32px}nav,main{padding-left:14px;padding-right:14px}.grid{grid-template-columns:repeat(2,1fr)}.form .two{grid-template-columns:1fr}}

:host{--wine:#7A2E3A;--wineBg:#F4E3E3;--gold:#C98A3A}
.tot{display:flex;gap:22px;align-items:flex-end}
.tot div{display:flex;flex-direction:column;align-items:flex-end}
.tot b{font:400 34px/1 'Instrument Serif',Georgia,serif}
.tot span{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.tile .bt{width:100%;aspect-ratio:3/4;background:linear-gradient(#FBF6EE,#EFE5D6);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile .bt img{width:auto;height:92%;max-width:90%;object-fit:contain;aspect-ratio:auto;background:none;mix-blend-mode:multiply}
.bt>span,.bigbt>span{height:100%;width:100%;display:flex;align-items:center;justify-content:center;color:#B7A68F}
.tile .bt svg{height:62%;width:auto}
.val{font-weight:800;font-size:14px;padding:2px 10px 0;color:var(--wine)}
.cnt{position:absolute;top:8px;right:8px;font-size:12px;font-weight:800;background:var(--wine);color:#fff;border-radius:10px;padding:3px 8px}
.stars{display:flex;gap:2px;padding:0 10px;color:var(--gold);font-size:15px;letter-spacing:1px}
.stars .off{color:#D9CBB6}
.rate{display:flex;gap:6px;margin:10px 0 4px}
.rate button{width:52px;height:52px;border-radius:26px;border:1px solid var(--line);background:var(--card);font-size:28px;line-height:1;cursor:pointer;color:#D9CBB6}
.rate button.on{color:var(--gold);border-color:var(--gold);background:#FBF1E2}
.bigbt{width:100%;height:min(46vh,420px);background:linear-gradient(#FBF6EE,#EFE5D6);display:flex;align-items:center;justify-content:center}
.bigbt img{height:92%;max-width:90%;object-fit:contain;mix-blend-mode:multiply}
.bigbt svg{height:60%;width:auto}
.note{width:100%;min-height:70px;border-radius:12px;border:1px solid var(--line);padding:10px 12px;font-size:16px;resize:vertical;background:#fff}
.how{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:16px 18px;max-width:640px}
.how b{display:block;font-size:16px;margin-bottom:4px}
.src{font-size:12px;color:var(--muted)}

.kicker{font-size:13px;letter-spacing:1.8px;text-transform:uppercase;font-weight:600}
.h1{font-family:var(--serif);font-weight:400;font-size:56px;line-height:1.02;margin:8px 0 0}
.glass{background:rgba(252,248,241,.75);border:1px solid var(--line);border-radius:28px;padding:22px 28px}
.lanes{display:flex;flex-direction:column;gap:14px}
.lane{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center}
.lane b{font-weight:600}
.track{position:relative;height:50px;border-radius:12px}
.ev{position:absolute;top:0;bottom:0;border-radius:10px;color:#FCF8F1;font-size:13px;padding:0 10px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;min-width:10px}
.nowline{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--clay);border-radius:1px}
.hours{display:grid;grid-template-columns:96px minmax(0,1fr);font-size:13px;color:var(--mute);margin-bottom:8px}
.hours i{display:block}.hours div{position:relative;height:16px}.hours span{position:absolute;transform:translateX(-50%)}
.cards4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.sc{border-radius:24px;padding:18px 22px;background:rgba(252,248,241,.75);border:1px solid var(--line)}
.sc .big{font-family:var(--serif);font-size:36px;line-height:1.02;margin-top:6px}
.sc .sub{font-size:15px;color:var(--mute2);margin-top:6px;line-height:1.4}
.dark-s{color:#F3EDE3}
.dark-s .glass,.dark-s .sc{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
.dark-s .sc .sub{color:#C7CEE3}
.bigplants{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:14px;align-items:end}
.bp{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.bp .bar{width:22px;height:300px;border-radius:9px;background:rgba(94,138,90,.14);position:relative;overflow:hidden}
.bp .bar i{position:absolute;left:0;right:0;bottom:0;background:var(--green);border-radius:9px}
.bp .bar u{position:absolute;left:-4px;right:-4px;height:2px;background:#E39B4B}
.bp.dry .bar i{background:#E39B4B}
.bp b{font-size:15px}.bp span{font-size:13px;color:var(--mute)}
.bigshelf{display:flex;gap:8px;align-items:flex-end;justify-content:center;border-bottom:4px solid #6B4A3A;padding:0 20px}
.bigshelf svg{width:34px;height:118px}

/* ---------- Moments ---------- */
.mom{position:absolute;inset:0;display:flex;flex-direction:column;animation:fade .45s ease;z-index:5}
.mom.navy{background:#17213A;color:#F3EDE3}
.mom.paper{background:#F4E9DA}
.mom.storm{background:#20262E;color:#EEF0F2}
.mom.ring{background:radial-gradient(ellipse at 30% 20%,#26305A 0%,#1B2240 45%,#121730 100%);color:#E9E6F2}
.mpad{flex:1;min-height:0;padding:40px 56px 30px;display:flex;flex-direction:column;gap:20px}
.mbar{display:flex;align-items:center;gap:14px}
.mbar .grow{flex:1;font-size:16px;opacity:.85}
.pill{font:600 17px var(--sans);border:0;border-radius:999px;padding:0 28px;min-height:56px}
.pill.sun{background:var(--sun);color:#17213A}
.pill.ink{background:var(--ink);color:#FCF8F1}
.pill.ghost{background:transparent;border:1px solid currentColor;opacity:.85;font-weight:500}
.cnt{width:220px;height:220px;flex:none;position:relative;display:flex;align-items:center;justify-content:center}
.cnt svg{position:absolute;inset:0}
.cnt b{font-family:var(--serif);font-weight:400;font-size:84px;line-height:.9;display:block;text-align:center}
.cnt span{font-size:15px;opacity:.8;display:block;text-align:center}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mcard{border-radius:26px;padding:20px 24px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.mcard .big{font-family:var(--serif);font-size:36px;line-height:1.05;margin-top:8px}
.mcard .sub{font-size:16px;opacity:.8;margin-top:6px;line-height:1.5}
.paper .mcard{background:var(--card);border-color:var(--line)}
.camwrap{position:relative;border-radius:22px;overflow:hidden;background:#20263A;flex:1;min-height:0}
.camwrap img{width:100%;height:100%;object-fit:cover;display:block}
.camtag{position:absolute;left:16px;top:14px;font-size:13px;display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:999px}
.camtag i{width:8px;height:8px;border-radius:50%;background:#E0645A}

/* ---------- Sheets (Energy, Pik's notes) ---------- */
.scrim{position:absolute;inset:0;background:rgba(42,34,27,.35);z-index:8;animation:fade .3s}
.sheet{position:absolute;left:40px;right:40px;bottom:0;top:70px;background:var(--card);border-radius:30px 30px 0 0;z-index:9;padding:26px 34px;display:flex;flex-direction:column;gap:16px;animation:up .35s ease;overflow:hidden}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet.darkx{background:#1F2A2E;color:#F3EDE3}
.shtop{display:flex;align-items:center;gap:14px}
.shtop h2{font-family:var(--serif);font-weight:400;font-size:40px;margin:0;flex:1}
.done{min-height:48px;padding:0 22px;border-radius:999px;border:1px solid currentColor;background:transparent;opacity:.85}
.rule{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.rule .rw{flex:1;font-size:17px}
.rule small{display:block;font-size:13px;color:var(--mute)}
.bars{display:flex;flex-direction:column;gap:8px}
.lbar{display:grid;grid-template-columns:110px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:14px}
.lbar .tk{height:10px;border-radius:5px;background:var(--line2);position:relative}
.lbar .tk i{position:absolute;top:0;bottom:0;border-radius:5px}
.vbub{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);width:720px;max-width:calc(100% - 80px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:26px;padding:16px 22px;z-index:7;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:6px;animation:fade .3s}
.vbub.inline{position:static;transform:none;width:auto;max-width:none;box-shadow:none;animation:none}.vbub.inline .line{font-size:22px}
.vbub .who{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--clay);font-weight:600;display:flex;justify-content:space-between}
.vbub .q{font-size:14px;color:var(--mute2)}
.vbub .line{font-family:var(--serif);font-size:26px;line-height:1.15}
.toast{position:absolute;left:50%;top:22px;transform:translateX(-50%);background:var(--ink);color:#FCF8F1;padding:12px 22px;border-radius:999px;font-size:15px;z-index:20;animation:fade .3s}
@media (prefers-reduced-motion: reduce){.flow,.amb,.mom,.sheet{animation:none!important}}
